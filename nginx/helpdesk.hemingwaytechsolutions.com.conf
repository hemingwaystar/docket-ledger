# nginx — TLS front for the Hemingway Suite at helpdesk.hemingwaytechsolutions.com
#
# Design (why this shape):
#   * ONE hostname. Docket owns the root path space (/ui /api /auth /docs) —
#     its fetch URLs are deliberately absolute (bug #8), so it must live at /.
#   * Ledger rides under /ledger/ with the prefix STRIPPED by proxy_pass —
#     the Ledger UIs compute a base from their own URL (build 4), so their
#     absolute /api calls become /ledger/api on the proxied origin. No
#     root_path anywhere (bug #7).
#   * Upstreams point at the NetBird overlay address the compose stack binds
#     (BIND_ADDR in ~/docket-ledger/.env). Fill it in with:
#       sed -i "s/__BIND_ADDR__/$(grep ^BIND_ADDR ~/docket-ledger/.env | cut -d= -f2)/" \
#           /etc/nginx/sites-available/helpdesk.hemingwaytechsolutions.com.conf
#   * Direct NetBird port access (http://<BIND_ADDR>:8081) keeps working for
#     Swagger and break-glass — until COOKIE_SECURE=true is set, after which
#     sign-in works only over this https front (by design).
#
# Install:
#   cp this file → /etc/nginx/sites-available/helpdesk.hemingwaytechsolutions.com.conf
#   ln -s ../sites-available/helpdesk.hemingwaytechsolutions.com.conf /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

upstream docket_api { server __BIND_ADDR__:8081; }
upstream ledger_api { server __BIND_ADDR__:8082; }
upstream assets_api { server __BIND_ADDR__:8083; }

# credential-guessing brake on the pre-session auth endpoints (audit) — the
# edge belt over desk-api's own DB-backed 5-fails/15-min account+IP lockout
limit_req_zone $binary_remote_addr zone=authlim:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name helpdesk.hemingwaytechsolutions.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # standalone directive (listen-flag form is deprecated since 1.25.1)
    server_name helpdesk.hemingwaytechsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/helpdesk.hemingwaytechsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpdesk.hemingwaytechsolutions.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:hts:10m;

    # HSTS — no preload until you're certain this stays https-only
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;         # suite iframes are same-origin here
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP baseline (audit: none existed despite a stored-XSS history).
    # script-src keeps 'unsafe-inline' — the UIs are template-literal HTML
    # with inline handlers — so the wins here are: no external script/style
    # loads, no exfil via connect/img to foreign hosts, no plugins, no
    # base/form hijack. The mail-HTML iframe carries its own stricter CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;

    client_max_body_size 25m;                             # attachment headroom
    proxy_read_timeout   90s;

    # ---- Ledger: /ledger/* → :8082 with the prefix stripped ---------------
    # /ledger/ui/ledger.html → /ui/ledger.html · /ledger/api/… → /api/…
    # (Ledger's Swagger under /ledger/docs renders but fetches Docket's spec;
    #  use the NetBird ports for Ledger's Swagger — known cosmetic limit.)
    location /ledger/ {
        proxy_pass http://ledger_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- Assets: /assets/* → :8083 with the prefix stripped ---------------
    # /assets/ui/assets.html → /ui/assets.html · /assets/api/… → /api/…
    # (same shape as /ledger/; the Assets UI computes ABASE from its own URL)
    location /assets/ {
        proxy_pass http://assets_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- credential endpoints: rate-limited, otherwise Docket-shaped ------
    location = /auth/login {
        limit_req zone=authlim burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://docket_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /auth/mfa/enroll-start {
        limit_req zone=authlim burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://docket_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- Docket: everything else (/, /ui, /api, /auth, /docs) -------------
    location / {
        proxy_pass http://docket_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
