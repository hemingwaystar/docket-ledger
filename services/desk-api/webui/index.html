<style>
:root{--brand:#0e6e63;--brand-wash:#e7f1ef;--ink:#1d2b36;--mut:#5b6b78;--line:#dde5ea;
      --bg:#f2f5f7;--rail:#152029;--railtx:#c7d3dc;--bad:#b23c3c;--ok:#2e7d4f;--amber:#9a6b00}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--railtx);padding:16px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{color:#fff;font-size:14px;display:block}.brand span{font-size:11px;opacity:.75}
.who{margin-top:auto;position:absolute;bottom:14px;left:12px;right:12px;font-size:12px;
     border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.who b{color:#fff;display:block}
.who a{color:var(--railtx);cursor:pointer;text-decoration:underline}
main{padding:22px 26px}
h1{font-size:19px;margin-bottom:2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;
      cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;
   padding:9px 12px;border-bottom:1px solid var(--line);background:#fafcfd}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--brand-wash)}
.num{color:var(--mut);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.pill.open{background:#e7f1ef;color:var(--ok)}.pill.paused{background:#fdf3dc;color:var(--amber)}
.pill.done{background:#eef1f4;color:var(--mut)}
.empty{padding:34px;text-align:center;color:var(--mut)}
#view{display:none}
.back{color:var(--brand);cursor:pointer;font-size:13px;margin-bottom:10px;display:inline-block}
.thread{background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.art{padding:13px 16px;border-bottom:1px solid var(--line)}
.art:last-child{border-bottom:0}
.art .hd{font-size:12.5px;color:var(--mut);margin-bottom:5px}
.art .hd b{color:var(--ink)}
.art.note{background:#fdf9ee}.art.sys{background:#f6f8fa;font-size:12.5px;color:var(--mut)}
.composer{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;resize:vertical}
.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center}
select,input[type=datetime-local]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px}
.btn{padding:8px 16px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:600 13.5px/1 inherit;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.msg{font-size:12.5px;margin-left:8px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12.5px;margin-top:4px}
.meta b{color:var(--ink)}
</style></head><body>

<main>
  <div id="pwCard" style="display:none;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px">
    <h1 style="font-size:16px">Change your password</h1>
    <div class="sub">Your password was admin-issued — set your own to continue.</div>
    <label style="font-size:12.5px;font-weight:600;color:var(--mut)">Current password</label>
    <input type="password" id="pwCur" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px;font:inherit">
    <label style="font-size:12.5px;font-weight:600;color:var(--mut)">New password (12+ characters)</label>
    <input type="password" id="pwNew" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px;font:inherit">
    <label style="font-size:12.5px;font-weight:600;color:var(--mut)">Confirm new password</label>
    <input type="password" id="pwNew2" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin:4px 0 12px;font:inherit">
    <button class="btn" id="pwGo">Change password</button><span class="msg" id="pwMsg"></span>
  </div>
  <div id="queue">
    <h1>Queue</h1><div class="sub" id="qsub">Live from desk-api</div>
    <div class="toolbar" id="filters"></div>
    <div id="qwrap"></div>
  </div>
  <div id="view"></div>
</main></div>
<script>
const api=p=>fetch(p,{credentials:'same-origin'}).then(r=>{if(r.status===401)location.href='login.html';return r.json()});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ME=null,FILTER='open';

async function boot(){
  ME=await api('/auth/me');
  document.getElementById('meName').textContent=ME.name;
  document.getElementById('meMail').textContent=ME.email;
  document.getElementById('logout').onclick=async()=>{await fetch('/auth/logout',{method:'POST',credentials:'same-origin'});location.href='login.html'};
  if(ME.must_change_password||location.hash==='#change-password'){
    document.getElementById('pwCard').style.display='block';
    document.getElementById('pwGo').onclick=async()=>{
      const m=document.getElementById('pwMsg');m.textContent='';m.className='msg';
      const cur=document.getElementById('pwCur').value,nw=document.getElementById('pwNew').value;
      if(nw!==document.getElementById('pwNew2').value){m.textContent='New passwords differ';m.className='msg bad';return}
      const r=await fetch('/auth/change-password',{method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({current_password:cur,new_password:nw})});
      const d=await r.json().catch(()=>({}));
      if(r.ok){m.textContent='Changed ✓';m.className='msg ok';
        setTimeout(()=>{location.hash='';document.getElementById('pwCard').style.display='none'},700)}
      else{m.textContent=d.detail||'Failed';m.className='msg bad'}
    };
  }
  renderFilters();loadQueue();
}
function renderFilters(){
  const f=document.getElementById('filters');
  f.innerHTML=['open','paused','done','all'].map(k=>
    `<button class="chip ${k===FILTER?'on':''}" data-k="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
  f.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{FILTER=b.dataset.k;renderFilters();loadQueue()});
}
async function loadQueue(){
  const q=FILTER==='all'?'':'?state='+FILTER;
  const d=await api('/api/tickets'+q);
  const rows=d.tickets||[];
  document.getElementById('qsub').textContent=rows.length+' tickets · live from desk-api';
  document.getElementById('qwrap').innerHTML=rows.length?
    `<table><thead><tr><th>#</th><th>Title</th><th>Client</th><th>Group</th><th>State</th><th>Priority</th><th>Owner</th></tr></thead><tbody>`+
    rows.map(t=>`<tr data-id="${t.id}"><td class="num">${t.id}</td><td><b>${esc(t.title)}</b>${t.is_project?' 📋':''}</td>
      <td>${esc(t.client)}</td><td>${esc(t.group)}</td>
      <td><span class="pill ${t.state_kind}">${esc(t.state)}</span></td>
      <td>${esc(t.priority)}</td><td>${esc(t.owner||'—')}</td></tr>`).join('')+'</tbody></table>'
    :'<div class="empty">No tickets match. When Graph ingestion goes live, inbound mail lands here.</div>';
  document.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>openTicket(tr.dataset.id));
}
async function openTicket(id){
  const t=await api('/api/tickets/'+id);
  document.getElementById('queue').style.display='none';
  const v=document.getElementById('view');v.style.display='block';
  v.innerHTML=`<span class="back" id="back">← Queue</span>
    <h1>#${t.id} · ${esc(t.title)}</h1>
    <div class="meta"><span>Client <b>${esc(t.client)}</b></span><span>Group <b>${esc(t.group)}</b></span>
      <span>State <b>${esc(t.state)}</b></span><span>Priority <b>${esc(t.priority)}</b></span>
      <span>Owner <b>${esc(t.owner||'—')}</b></span>
      ${t.time.length?`<span>Time <b>${t.time.reduce((a,e)=>a+ +e.hours,0).toFixed(2)} h</b></span>`:''}</div>
    <div class="thread">${t.articles.map(a=>`<div class="art ${a.kind==='note'?'note':a.kind==='sys'?'sys':''}">
      <div class="hd"><b>${esc(a.author)}</b> · ${a.kind} · ${new Date(a.sent_at).toLocaleString()}</div>
      <div>${esc(a.body)}</div></div>`).join('')||'<div class="art sys">No articles yet</div>'}</div>
    <div class="composer">
      <textarea id="cBody" placeholder="Internal note…"></textarea>
      <div class="row">
        <label><input type="checkbox" id="cTime"> log time</label>
        <input type="datetime-local" id="cStart"><span style="color:var(--mut)">→</span>
        <input type="datetime-local" id="cEnd">
        <select id="cType"><option>Remote support</option><option>Onsite</option><option>Project work</option>
          <option>Consulting</option><option>Internal</option></select>
        <button class="btn" id="cSend">Add note</button><span class="msg" id="cMsg"></span>
      </div></div>`;
  document.getElementById('back').onclick=()=>{v.style.display='none';document.getElementById('queue').style.display='block';loadQueue()};
  const now=new Date(),pad=n=>String(n).padStart(2,'0'),
    dl=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('cEnd').value=dl(now);
  document.getElementById('cStart').value=dl(new Date(now-30*60000));
  document.getElementById('cSend').onclick=async()=>{
    const msg=document.getElementById('cMsg');msg.textContent='';msg.className='msg';
    const payload={kind:'note',body:document.getElementById('cBody').value.trim(),author_email:ME.email};
    if(!payload.body){msg.textContent='Write something first';msg.className='msg bad';return}
    if(document.getElementById('cTime').checked)
      payload.time={started_at:new Date(document.getElementById('cStart').value).toISOString(),
        ended_at:new Date(document.getElementById('cEnd').value).toISOString(),
        activity_type:document.getElementById('cType').value,technician_email:ME.email};
    const r=await fetch('/api/tickets/'+id+'/articles',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    if(r.ok){msg.textContent=d.time_entry_id?'Noted + time → Ledger':'Noted';msg.className='msg ok';openTicket(id)}
    else{msg.textContent=d.detail||'Failed';msg.className='msg bad'}
  };
}
boot();
</script></body></html>
