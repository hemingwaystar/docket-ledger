<style>
:root{--brand:#0e6e63;--ink:#1d2b36;--mut:#5b6b78;--line:#dde5ea;--bg:#f2f5f7;--bad:#b23c3c}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);
     min-height:100vh;display:grid;place-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:34px 34px 28px;
      width:min(94vw,380px);box-shadow:0 10px 30px rgba(21,32,41,.08)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo img{width:44px;height:44px;border-radius:10px}
.logo b{font-size:17px;display:block}.logo span{color:var(--mut);font-size:12.5px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:14px 0 5px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}
input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:9px;background:var(--brand);
       color:#fff;font:600 15px/1 inherit;cursor:pointer}
button:hover{filter:brightness(1.06)}
.err{display:none;margin-top:14px;padding:9px 12px;border-radius:8px;background:#fbeaea;
     color:var(--bad);font-size:13px}
#mfaRow{display:none}
.foot{margin-top:18px;text-align:center;color:var(--mut);font-size:12px}

  <a id="ssoBtn" href="/auth/oidc/login" style="display:none;width:100%;margin:2px 0 4px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:600 14.5px/1 inherit;cursor:pointer;text-align:center;text-decoration:none;box-sizing:border-box">
    <svg width="15" height="15" viewBox="0 0 21 21" style="vertical-align:-2px;margin-right:8px"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>Sign in with Microsoft</a>
  <div id="ssoDiv" style="display:none;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:14px 0 2px"><span style="flex:1;height:1px;background:var(--line)"></span>or with a password<span style="flex:1;height:1px;background:var(--line)"></span></div>
  <div id="localBox">
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" required autofocus>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <div id="mfaRow"><label for="totp">Authenticator code</label>
  <input id="totp" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456"></div>
  <button>Sign in</button>
  </div>
  <div class="err" id="err"></div>
  <div class="foot">Sessions last 12 hours · resets are admin-issued, never emailed</div>
</form>
<script>
const f=document.getElementById('f'),err=document.getElementById('err'),mfa=document.getElementById('mfaRow');
/* which doors are open — SSO button and/or the password form */
fetch('/auth/methods',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(m=>{
  if(!m) return;
  if(m.sso){ document.getElementById('ssoBtn').style.display='block';
    if(m.local) document.getElementById('ssoDiv').style.display='flex'; }
  if(!m.local && m.sso){ document.getElementById('localBox').style.display='none';
    ['email','pw'].forEach(id=>document.getElementById(id).required=false); }
}).catch(()=>0);
const oerr=new URLSearchParams(location.search).get('err');
if(oerr){ err.textContent=oerr; err.style.display='block'; }
f.addEventListener('submit',async ev=>{
  ev.preventDefault();err.style.display='none';
  const body={email:f.email.value.trim(),password:f.pw.value};
  const code=f.totp.value.trim();if(code)body.totp_code=code;
  try{
    const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      credentials:'same-origin',body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(r.ok){location.href=d.must_change_password?'index.html#change-password':'index.html';return}
    if(r.headers.get('X-MFA')==='required'){mfa.style.display='block';f.totp.focus();
      err.textContent='Enter your authenticator code.';err.style.display='block';return}
    err.textContent=d.detail||'Sign-in failed';err.style.display='block';
  }catch(e){err.textContent='Cannot reach the server';err.style.display='block'}
});
</script></body></html>
