function toggleMembership(gid, tid){
  if(!can('manage_settings')) return;
  const a = agent(tid); const has = a.groups.includes(gid);
  if(has && a.groups.length===1){ toast(`${a.name.split(' ')[0]} needs at least one group.`); return; }
  if(has) a.groups.splice(a.groups.indexOf(gid),1); else a.groups.push(gid);
  log(has?'Removed from group':'Added to group', `${a.name} ${has?'\u2212':'+'} ${grp(gid).name}`);
  bridgeSend('dir-agent-upsert', { agent:{ id:a.id, name:a.name, initials:a.initials, groups:a.groups.slice() } });
  if(tid===state.meId){ /* my own scope changed */ }
  toast(`${a.name.split(' ')[0]} ${has?'removed from':'added to'} ${grp(gid).name} \u2014 applies in Ledger too.`);
  render();
}
let nextTypeIx = 7;
function typeModal(xid){
  if(!can('manage_settings')) return;
  const x0 = xid? ATYPES.find(a=>a.id===xid) : {};
  const m = document.getElementById('modal');
  m.innerHTML = `
    <div class="modal-head"><h3>${xid?'Rename activity type':'Add activity type'}</h3><p>Types are shared: the ticket timer logs against them here; billable status and rates are configured in Ledger.</p></div>
    <div class="modal-body"><div class="field"><label>Name</label><input type="text" id="atName" value="${esc(x0.name||'')}" placeholder="e.g. After-hours"></div></div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveType('${xid||''}')">${xid?'Save':'Add type'}</button></div>`;
  document.getElementById('scrim').classList.add('open');
  document.getElementById('atName').focus();
}
function archiveType(xid){
  const x = ATYPES.find(a=>a.id===xid);
  if(x.id==='a0'){ toast('Unclassified is the sentinel \u2014 it has to stay.'); return; }
  if(!isArch(x) && aATYPES().filter(t=>t.id!=='a0').length<=1){ toast('At least one working type has to stay active.'); return; }
  x.active = isArch(x)? true : false;
  log(isArch(x)?'Activity type archived':'Activity type restored', `${x.name}${isArch(x)?' \u2014 hidden from pickers; entries carrying it keep it':''}`);
  bridgeSend('dir-type-upsert', { typeRec:{ id:x.id, name:x.name, billable:!!x.billable, active:!isArch(x) } });
  toast(`\u201c${x.name}\u201d ${isArch(x)?'archived \u2014 gone from pickers in both apps; existing entries untouched':'restored'}.`);
  render();
}
function saveType(xid){
  const name = document.getElementById('atName').value.trim();
  if(!name){ toast('The type needs a name.'); return; }
  if(xid){ const x=ATYPES.find(a=>a.id===xid); log('Activity type renamed', `${x.name} \u2192 ${name}`); x.name=name;
    bridgeSend('dir-type-upsert', { typeRec:{ id:x.id, name, billable:!!x.billable, active:!isArch(x) } }); }
  else { const x={ id:'a'+(nextTypeIx++), name, billable:false }; ATYPES.splice(ATYPES.length-1, 0, x);
    log('Activity type added', name);
    bridgeSend('dir-type-upsert', { typeRec:{ id:x.id, name, billable:false, active:true } }); }
  toast(`Type \u201c${name}\u201d saved \u2014 set its rate in Ledger.`);
  closeModal(); render();
}

function setAF(k,v){ (state.af=state.af||{}); state.af[k]=v; render(); }
function clearAF(){ state.af = { preset:'all', from:'', to:'', who:'all', action:'all', q:'' }; render(); }
function auditPreset(p){ state.af = Object.assign(state.af||{}, {preset:p, from:'', to:''}); render(); }
function auditFiltered(){
  const f = state.af || {};
  let rows = state.audit.slice();
  const cut = { '1h':1*H, '4h':4*H, '24h':24*H }[f.preset];
  if(cut) rows = rows.filter(a=>nowMs()-a.ts <= cut);
  if(f.from) rows = rows.filter(a=>a.ts >= new Date(f.from+'T00:00').getTime()-(BOOT-NOW.getTime()));
  if(f.to) rows = rows.filter(a=>a.ts <= new Date(f.to+'T23:59').getTime()-(BOOT-NOW.getTime()));
  if(f.who && f.who!=='all') rows = rows.filter(a=>a.who===f.who);
  if(f.action && f.action!=='all') rows = rows.filter(a=>a.action===f.action);
  if(f.q){ const q=f.q.toLowerCase(); rows = rows.filter(a=>((a.action||'')+' '+(a.detail||'')+' '+(a.who||'')).toLowerCase().includes(q)); }
  return rows;
}
function viewAudit(){
  const f = state.af || (state.af = { preset:'all', from:'', to:'', who:'all', action:'all', q:'' });
  const opt = (v,l,cur)=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`;
  const actions = [...new Set(state.audit.map(a=>a.action))].sort();
  const whos = [...new Set(state.audit.map(a=>a.who).filter(Boolean))].sort();
  const rows = auditFiltered();
  const anyF = f.preset!=='all'||f.from||f.to||f.who!=='all'||f.action!=='all'||f.q;
  return `
  ${can('export_csv')?`<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px">
    <button class="btn sm" onclick="copyAuditCSV()">Copy</button>
    <button class="btn primary" onclick="exportAuditCSV()">${icon(IC.export)}Export CSV</button>
  </div>`:''}
  <div class="card"><div class="card-pad" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="mini muted" style="width:52px;text-transform:uppercase;letter-spacing:.07em;font-weight:600">Period</span>
      <div class="seg">${[['1h','Last hour'],['4h','Last 4h'],['24h','Last 24h'],['all','All time']].map(([v,l])=>`<button class="${f.preset===v?'on':''}" onclick="auditPreset('${v}')">${l}</button>`).join('')}</div>
      <label class="mini muted" style="display:flex;align-items:center;gap:5px">from <input type="date" value="${f.from}" onchange="setAF('from',this.value)"></label>
      <label class="mini muted" style="display:flex;align-items:center;gap:5px">to <input type="date" value="${f.to}" onchange="setAF('to',this.value)"></label>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="mini muted" style="width:52px;text-transform:uppercase;letter-spacing:.07em;font-weight:600">Filters</span>
      <div class="search">${icon(IC.search)}<input type="text" placeholder="Search action, detail, actor…" value="${esc(f.q||'')}" oninput="setAF('q',this.value)"></div>
      <select style="width:auto" onchange="setAF('action',this.value)">${opt('all','All events',f.action)}${actions.map(a=>opt(a,a,f.action)).join('')}</select>
      <select style="width:auto" onchange="setAF('who',this.value)">${opt('all','All actors',f.who)}${whos.map(w=>opt(w,w,f.who)).join('')}</select>
      ${anyF?`<button class="btn sm ghost" onclick="clearAF()">Clear</button>`:''}
      <span class="spacer"></span><span class="mini muted">${rows.length} of ${state.audit.length} events</span>
    </div>
  </div></div>
  <div class="section-gap"></div>
  <div class="card">
    <table class="tbl">
      <thead><tr><th style="width:150px">When</th><th style="width:170px">Who</th><th>Action</th><th>Detail</th></tr></thead>
      <tbody>${rows.length? rows.map(a=>`<tr>
        <td class="time-cell">${fmtDT(a.ts)}</td>
        <td class="mini" style="padding-top:12px">${esc(a.who)}</td>
        <td><span class="cell-title">${esc(a.action)}</span></td>
        <td class="mini" style="padding-top:12px">${esc(a.detail)}</td>
      </tr>`).join('') : `<tr><td colspan="4" class="mini muted" style="padding:18px 16px">Nothing matches these filters.</td></tr>`}</tbody>
    </table>
  </div>`;
}

/* ==========================================================================
   CALLER VERIFICATION — the standalone verify service, native.
   Contact info comes from the record on file, never from the caller.
   Code: 6 digits, 5-min TTL, 3 attempts. Result is posted to the thread.
   ========================================================================== */
function verifyModal(tid){
  if(!can('verify_identity')) return;
  const t = tk(tid), p = contact(t.contactId);
  const dest = [];
  const phoneNo = p?.mobile || p?.phone;
  if(VCFG.sms.enabled && phoneNo) dest.push({ method:'sms',   label:`SMS to ${maskPhone(phoneNo)}`,   masked:maskPhone(phoneNo) });
  if(VCFG.email.enabled && p?.email) dest.push({ method:'email', label:`Email to ${maskEmail(p.email)}`, masked:maskEmail(p.email) });
  if(!VCFG.sms.enabled && !VCFG.email.enabled){ toast('Both verification channels are disabled \u2014 enable SMS or email in Settings.'); return; }
  const m = document.getElementById('modal');
  if(!dest.length){
    m.innerHTML = `
      <div class="modal-head"><h3>Verify caller — ticket #${t.id}</h3><p>${esc(p?.name||'Unknown contact')}</p></div>
      <div class="modal-body"><div class="notice lock">${icon(IC.shield)}<div><b>No phone or email on file.</b> Add a number to ${esc(p?.name||'the contact')}'s record first — codes only ever go to stored contact info, never to a number the caller reads out.</div></div></div>
      <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Close</button></div>`;
    document.getElementById('scrim').classList.add('open');
    return;
  }
  m.innerHTML = `
    <div class="modal-head"><h3>Verify caller — ticket #${t.id}</h3><p>${esc(p.name)} · ${esc(client(t.clientId).name)}. The code goes to the contact info <b>on file</b> — never to a number the caller provides.</p></div>
    <div class="modal-body" id="vfyBody">
      <div class="field"><label>Send a one-time code</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">
          ${dest.map(d=>`<button class="btn" onclick="vfySend(${t.id},'${d.method}','${d.masked}')">${d.label}</button>`).join('')}
        </div></div>
      <div class="mini muted" style="margin-top:6px">Expires after ${VCFG.ttlMin} minutes · ${VCFG.attempts} attempts · result is logged to the ticket either way.</div>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`;
  document.getElementById('scrim').classList.add('open');
}
function vfySend(tid, method, masked){
  const code = String(Math.floor(100000 + Math.random()*900000));
  state.verify[tid] = { code, method, masked, attempts:0, expires:nowMs()+VCFG.ttlMin*60000 };
  const b = document.getElementById('vfyBody');
  b.innerHTML = `
    <div class="notice info" style="margin-bottom:12px">${icon(IC.shield)}<div>Code sent via <b>${method==='sms'?'SMS':'email'}</b> to <span class="tape">${esc(masked)}</span>. Ask the caller to read it back to you.</div></div>
    <div class="notice" style="background:#fdf6e8;border:1px solid var(--seal);margin-bottom:12px;display:flex;gap:8px"><span style="color:var(--seal);font-weight:700">Demo</span><div class="mini">in the shipped app this lands on the customer's ${method==='sms'?`phone (${VCFG.sms.provider})`:'inbox (Microsoft Graph / SMTP)'}. For this walkthrough, the customer just received: <span class="tape" style="font-weight:700;letter-spacing:.2em">${state.verify[tid].code}</span></div></div>
    <div class="field"><label>Code the caller reads back</label>
      <input type="text" id="vfyCode" maxlength="6" placeholder="6 digits" style="letter-spacing:.3em;font-size:16px" onkeydown="if(event.key==='Enter')vfyCheck(${tid})"></div>
    <div class="mini muted" id="vfyMsg">${VCFG.attempts} attempts remaining · expires in ${VCFG.ttlMin} min</div>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn primary" onclick="vfyCheck(${tid})">Verify code</button>
      <button class="btn ghost sm" onclick="vfySend(${tid},'${method}','${esc(masked)}')">Resend</button>
    </div>`;
  document.getElementById('vfyCode').focus();
}
function vfyCheck(tid){
  const ch = state.verify[tid]; if(!ch) return;
  const t = tk(tid);
  const entered = document.getElementById('vfyCode').value.trim();
  const chan = ch.method==='sms'?'SMS':'email';
  if(nowMs() > ch.expires){
    document.getElementById('vfyMsg').innerHTML = `<span style="color:var(--void)">Code expired — send a new one.</span>`;
    return;
  }
  if(entered === ch.code){
    delete state.verify[tid];
    if(!t.tags.includes(VERIFIED_TAG)) t.tags.push(VERIFIED_TAG);
    t.articles.push(art('sys', me(), nowMs(), `\u2705 Identity verified via ${chan} to ${ch.masked} \u00b7 handled by ${state.user.name}`));
    t.updatedAt = nowMs();
    log('Identity verified', `#${t.id} \u00b7 ${chan} to ${ch.masked}`);
    document.getElementById('vfyBody').innerHTML = `
      <div class="notice info" style="border-color:var(--brand)">${icon(IC.shield)}<div><b>Verified.</b> An audit note was posted to the thread and the ticket is tagged <span class="chip tagchip">${VERIFIED_TAG}</span>. Proceed with the sensitive request.</div></div>`;
    document.querySelector('#modal .modal-foot').innerHTML = `<button class="btn primary" onclick="closeModal();render()">Back to ticket</button>`;
    return;
  }
  ch.attempts++;
  if(ch.attempts >= VCFG.attempts){
    delete state.verify[tid];
    if(VCFG.postToThread) t.articles.push(art('sys', me(), nowMs(), `\u274c Identity verification FAILED \u2014 ${VCFG.attempts} incorrect attempts via ${chan} to ${ch.masked} \u00b7 handled by ${state.user.name}. Treat the caller as unverified.`));
    t.updatedAt = nowMs();
    log('Verification failed', `#${t.id} \u00b7 ${VCFG.attempts} wrong attempts via ${chan}`);
    document.getElementById('vfyBody').innerHTML = `
      <div class="notice lock" style="border-color:var(--void)">${icon(IC.shield)}<div><b>Verification failed.</b> Three incorrect codes — a FAILED note is on the ticket so the attempt is on the record. Do not action sensitive requests for this caller.</div></div>`;
    document.querySelector('#modal .modal-foot').innerHTML = `<button class="btn primary" onclick="closeModal();render()">Back to ticket</button>`;
    return;
  }
  document.getElementById('vfyMsg').innerHTML = `<span style="color:var(--void)">Wrong code \u2014 ${VCFG.attempts-ch.attempts} attempt${VCFG.attempts-ch.attempts===1?'':'s'} left.</span>`;
  document.getElementById('vfyCode').value=''; document.getElementById('vfyCode').focus();
}

function openLedger(note){
  if(window.parent!==window){ window.parent.postMessage({src:'docket', type:'suite-nav', app:'ledger'}, '*'); }
  else window.open('PROTOTYPE-open-me-first.html', 'ledger');
  toast(note || 'Opening Ledger \u2014 same sign-on, same clients, shared database.');
}
window.addEventListener('message', ev=>{
  /* only accept relayed messages from our own suite shell */
  if(window.parent===window || ev.source!==window.parent) return;
  const d = ev.data || {};
  if(d.src!=='ledger') return;
  if(d.type==='open-directory'){ go('directory'); toast('Directory opened from Ledger.'); }
  if(d.type==='open-ticket' && tk(Number(d.ticket))){
    openTicket(Number(d.ticket));
    toast(`Jumped here from Ledger \u2014 ticket #${d.ticket}.`);
  }
  const findEntry = ()=>{
    const t = tk(Number(d.ticket)); if(!t) return {};
    let i = d.eid ? t.time.findIndex(e=>e.eid===d.eid) : -1;
    if(i<0) i = t.time.findIndex(e=>e.techId===d.techId && e.typeId===d.typeId && Math.abs(e.h-(d.oldH!=null?d.oldH:d.h))<1e-6);
    if(i<0) i = t.time.findIndex(e=>e.techId===d.techId && Math.abs(e.h-(d.oldH!=null?d.oldH:d.h))<1e-6);
    return { t, i };
  };
  if(d.type==='entry-removed'){
    const { t, i } = findEntry();
    if(!t || i==null || i<0) return;
    const e = t.time[i];
    const holder = t.articles.find(a=>a.time===e);
    if(holder) delete holder.time;
    t.time.splice(i,1);
    t.articles.push(art('sys', {name:'Ledger'}, nowMs(), `Time entry removed via Ledger \u2014 ${fmtHours(e.h)} h \u00b7 ${atype(e.typeId)?.name||''} (${agent(e.techId)?.name.split(' ')[0]||''})`));
    t.updatedAt = nowMs();
    state.audit.unshift({ ts:nowMs(), who:'Ledger', action:'Time entry removed in Ledger', detail:`#${t.id} \u00b7 ${fmtHours(e.h)} h \u00b7 ${atype(e.typeId)?.name||''}` });
    toast(`\u26a1 Ledger removed ${fmtHours(e.h)} h on #${t.id} \u2014 mirrored here.`);
    render();
  }
  if(d.type==='entry-updated'){
    const { t, i } = findEntry();
    if(!t || i==null || i<0) return;
    const e = t.time[i];
    const was = e.h;
    if(d.startedAt) e.startedAt = d.startedAt;
    if(d.endedAt) e.endedAt = d.endedAt;
    e.h = (d.startedAt&&d.endedAt)? spanH(e.startedAt,e.endedAt) : d.h;
    if(d.typeId) e.typeId = d.typeId;
    t.updatedAt = nowMs();
    state.audit.unshift({ ts:nowMs(), who:'Ledger', action:'Time entry edited in Ledger', detail:`#${t.id} \u00b7 ${fmtHours(was)} h \u2192 ${fmtHours(d.h)} h` });
    toast(`\u26a1 Ledger adjusted #${t.id} to ${fmtHours(d.h)} h \u2014 mirrored here.`);
    render();
  }
});

/* searchable dropdown — scales past select's comfort zone.
   opts: [{v, label, sub?}] · hidden input #<id> carries the picked value */
const _combos = {};   /* id → {opts, onpick} — options live here, not in the DOM */
function combo(id, opts, val, onpick, placeholder){
  _combos[id] = { opts, onpick: typeof onpick==='function' ? onpick : null };
  const cur = opts.find(o=>o.v===val);
  return `<div class="combo" style="position:relative">
    <input type="hidden" id="${id}" value="${esc(val||'')}">
    <input type="text" id="${id}-q" autocomplete="off" placeholder="${esc(placeholder||'Type to search\u2026')}" value="${esc(cur?cur.label:'')}"
      onfocus="comboOpen('${id}')" oninput="comboFilter('${id}')"
      onkeydown="if(event.key==='Enter'){event.preventDefault();comboPickFirst('${id}');} if(event.key==='Escape'){comboClose('${id}');}">
    <div id="${id}-list" style="display:none;position:absolute;top:100%;left:0;right:0;max-height:220px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px rgba(21,32,41,.14);z-index:80"></div>
  </div>`;
}
function comboData(id){ return (_combos[id]||{}).opts || []; }
function comboOpen(id){ comboFilter(id); }
function comboFilter(id){
  const q = document.getElementById(id+'-q').value.trim().toLowerCase();
  const opts = comboData(id).filter(o=>!q || o.label.toLowerCase().includes(q) || (o.sub||'').toLowerCase().includes(q));
  const box = document.getElementById(id+'-list');
  box.innerHTML = opts.slice(0,50).map(o=>`<div style="padding:7px 11px;cursor:pointer;font-size:13px" onmousedown="comboPick('${id}','${jsq(String(o.v))}')"><b>${esc(o.label)}</b>${o.sub?` <span class="mini muted">${esc(o.sub)}</span>`:''}</div>`).join('')
    || `<div class="mini muted" style="padding:9px 11px">No matches.</div>`;
  box.style.display='block';
}
function comboPick(id, v){
  const o = comboData(id).find(x=>String(x.v)===String(v)); if(!o) return;
  document.getElementById(id).value = o.v;
  document.getElementById(id+'-q').value = o.label;
  comboClose(id);
  const f = (_combos[id]||{}).onpick;
  if(f){ try{ f(); }catch(e){} }
}
function comboPickFirst(id){
  const q = document.getElementById(id+'-q').value.trim().toLowerCase();
  const o = comboData(id).find(x=>!q || x.label.toLowerCase().includes(q) || (x.sub||'').toLowerCase().includes(q));
  if(o) comboPick(id, o.v);
}
function comboClose(id){ const b=document.getElementById(id+'-list'); if(b) b.style.display='none'; }
document.addEventListener('mousedown', ev=>{ if(!ev.target.closest('.combo')) document.querySelectorAll('[id$="-list"]').forEach(b=>b.style.display='none'); });

const ENTRA_COLMAP = {
  name:['displayname','name','fullname'], email:['mail','emailaddress','userprincipalname','upn','email'],
  title:['jobtitle','title'], dept:['department','dept'], phone:['businessphones','telephonenumber','phone','officephone'], mobile:['mobilephone','mobile'],
};
function parseCSV(text){
  const rows = []; let row = [], cell = '', inQ = false;
  for(let i=0;i<text.length;i++){ const ch = text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else inQ=false; } else cell+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else cell+=ch;
  }
  if(cell!==''||row.length){ row.push(cell); if(row.some(x=>x.trim()!=='')) rows.push(row); }
  return rows;
}
function entraParse(text){
  const rows = parseCSV(text.trim());
  if(rows.length<2) return { err:'Need a header row plus at least one user.' };
  const hdr = rows[0].map(h=>h.toLowerCase().replace(/[^a-z]/g,''));
  const col = {};
  for(const [field, names] of Object.entries(ENTRA_COLMAP)){ const ix = hdr.findIndex(h=>names.includes(h)); if(ix>=0) col[field]=ix; }
  if(col.email===undefined) return { err:'No email column found \u2014 expected one of: mail, userPrincipalName, email.' };
  if(col.name===undefined)  return { err:'No name column found \u2014 expected displayName / name.' };
  const users = rows.slice(1).map(r=>({
    name:(r[col.name]||'').trim(), email:(r[col.email]||'').trim().toLowerCase(),
    title:col.title!==undefined?(r[col.title]||'').trim():'', dept:col.dept!==undefined?(r[col.dept]||'').trim():'',
    phone:col.phone!==undefined?(r[col.phone]||'').replace(/[\[\]"]/g,'').trim():'', mobile:col.mobile!==undefined?(r[col.mobile]||'').trim():'',
  })).filter(u=>u.email && u.name);
  return { users };
}

    <div class="modal-body">

      <textarea id="csvText" rows="7" style="width:100%;font-family:'IBM Plex Mono',monospace;font-size:11.5px" placeholder="displayName,userPrincipalName,jobTitle,department&#10;Rita Calloway,rita@bluepine-dental.com,Office Manager,Admin" oninput="csvPreview('${cid}')"></textarea>

function csvPreview(cid){
  const c = client(cid);
  const out = document.getElementById('csvPrev'); const go = document.getElementById('csvGo');
  const r = entraParse(document.getElementById('csvText').value);
  if(r.err){ out.innerHTML = `<span style="color:var(--void)">${esc(r.err)}</span>`; go.disabled = true; return; }
  const have = new Set(c.contacts.map(p=>p.email.toLowerCase()));
  const fresh = r.users.filter(u=>!have.has(u.email));
  const skip = r.users.length - fresh.length;
  out.innerHTML = `<b>${r.users.length}</b> users parsed \u00b7 <b style="color:var(--brand)">${fresh.length} new</b>${skip?` \u00b7 ${skip} already exist (skipped)`:''}
    ${fresh.slice(0,5).map(u=>`<div style="margin-top:4px">\u2192 ${esc(u.name)} <span class="tape">${esc(u.email)}</span>${u.title?` \u00b7 ${esc(u.title)}`:''}</div>`).join('')}${fresh.length>5?`<div style="margin-top:4px">\u2026 and ${fresh.length-5} more</div>`:''}`;
  go.disabled = fresh.length===0;
}
function csvImportGo(cid){
  const c = client(cid);
  const r = entraParse(document.getElementById('csvText').value);
  if(r.err) return;
  const have = new Set(c.contacts.map(p=>p.email.toLowerCase()));
  const fresh = r.users.filter(u=>!have.has(u.email));
  fresh.forEach(u=>{
    c.contacts.push({ id:'px'+(nextIntakeIx++), name:u.name, title:u.title, dept:u.dept, email:u.email, phone:u.phone, mobile:u.mobile, fax:'', pref:'email', notes:'Imported from Entra CSV.', active:true });
  });
  log('Contacts imported from Entra CSV', `${c.name} \u00b7 ${fresh.length} added, ${r.users.length-fresh.length} skipped (already existed) \u00b7 by ${state.user.name}`);
  toast(`${fresh.length} contact${fresh.length===1?'':'s'} imported into ${c.name}.`);
  closeModal(); render();

let demoMailIx = 0;
let nextIntakeIx = 1;
function routeSender(fromEmail, fromName){
  fromEmail = String(fromEmail||'').toLowerCase();
  for(const c of CLIENTS){ const p = c.contacts.find(x=>x.active!==false && x.email.toLowerCase()===fromEmail); if(p) return { clientId:c.id, contactId:p.id, how:'contact' }; }
  const dom = fromEmail.split('@')[1]||'';
  const byDom = CLIENTS.find(c=>!c.sentinel && c.status!=='archived' && c.domain && c.domain===dom);
  const home = byDom || client('c0');
  const p = { id:'px'+(nextIntakeIx++), name: fromName || fromEmail.split('@')[0].replace(/[._]/g,' '), title:'', dept:'', email:fromEmail, phone:'', mobile:'', fax:'', pref:'email', notes: byDom? 'Auto-created \u2014 sender matched the client domain.' : 'Auto-created from unknown sender \u2014 held in Unassigned intake.', active:true };
  home.contacts.push(p);
  log(byDom?'Contact auto-created (domain match)':'Contact auto-created (unknown sender)', `${p.name} <${fromEmail}> \u2192 ${home.name}`);
  return { clientId:home.id, contactId:p.id, how: byDom?'domain':'catchall' };
}
/* move an unrouted ticket — and its sender — to the right client */
function reclientTicket(tid, targetId){
  const t = tk(tid); const target = client(targetId);
  if(!t || !target || target.sentinel || !can('edit_props')) return;
  const src = client(t.clientId);
  const p = contact(t.contactId);
  if(p && src && src.sentinel){
    src.contacts.splice(src.contacts.indexOf(p),1);
    target.contacts.push(p);
    p.notes = (p.notes? p.notes+' ' : '') + `Claimed into ${target.name} from Unassigned intake.`;
  }
  const was = src?.name || '\u2014';
  t.clientId = targetId;
  t.tags = t.tags.filter(x=>x!=='unrouted');
  t.articles.push(art('sys', me(), nowMs(), `Moved to ${target.name}${p?` \u00b7 ${p.name} added to their contacts`:''}`));
  t.updatedAt = nowMs();
  log('Ticket moved to client', `#${tid} \u00b7 ${was} \u2192 ${target.name}${p?` \u00b7 sender claimed as contact`:''}`);
  bridgeSend('ticket-reclient', { ticket:tid, clientId:targetId });
  toast(`#${tid} now belongs to ${target.name} \u2014 Ledger entries follow.`);
  render();
}
function demoIncomingEmail(){
  const d = DEMO_MAILS[demoMailIx++ % DEMO_MAILS.length];
  const mb = MAILBOXES.find(m=>m.addr===d.to && m.status==='connected') || MAILBOXES[0];
  if(d.unknownFrom){
    const r = routeSender(d.unknownFrom, d.unknownName);
    d.clientId = r.clientId; d.contactId = r.contactId; d._route = r.how;
  }
  const from = contact(d.contactId).email;
  if(d.followupTo && tk(d.followupTo) && projLocked(tk(d.followupTo))){
    /* customers can always email — record it, but a locked project never
       reopens or mutates; an admin unlock is the only way back in */
    const t = tk(d.followupTo);
    t.articles.push(art('mail-in', {name:contact(t.contactId)?.name||'Customer'}, nowMs(), d.body));
    t.articles.push(art('sys', {name:'Automation'}, nowMs(), 'Follow-up received on a locked project \u2014 recorded, state unchanged (admin unlock required to act)'));
    log('Follow-up on locked project', `#${t.id} \u2014 mail recorded; ticket stays locked/solved`);
    toast(`Follow-up recorded on locked project #${t.id} \u2014 no state change.`);
    render(); return;
  }
  if(d.followupTo && tk(d.followupTo)){
    const t = tk(d.followupTo);
    t.articles.push(art('mail-in', contact(d.contactId), nowMs(), d.body));
    if((st8(t.st)||{}).type!=='open'){ t.articles.push(art('sys', {name:'Mail'}, nowMs(), 'Customer replied — state set back to open')); t.st='open'; }
    t.updatedAt = nowMs();
    mb.today++;
    const fired = fireTriggers('followup', t, { from, to:d.to });
    state.audit.unshift({ ts:nowMs(), who:'Graph · '+mb.addr.split('@')[0]+'@', action:'Follow-up on ticket', detail:`#${t.id} · ${client(t.clientId).name}${fired.length?` · ${fired.length} trigger${fired.length===1?'':'s'} fired`:''}` });
    toast(`Follow-up from ${contact(d.contactId).name} on #${t.id}${fired.length?` · trigger replied`:''}.`);
    render(); return;
  }
  const id = state.nextId++;
  const t = mkTicket({ id, clientId:d.clientId, contactId:d.contactId, groupId:mb.groupId, ownerId:null, st:'new', prio:mb.prio||2, mailboxId:mb.id,
    tags:[], articles:[ art('mail-in', contact(d.contactId), nowMs(), d.body) ], time:[], slaFrMet:false });
  if(d._route==='catchall'){ t.tags.push('unrouted'); }
  d._route = null;
  TITLES[id]=d.title;
  mb.today++;
  const fired = applyAutomations(t, { from, to:d.to, subject:d.title, body:d.body });
  const trigs = fireTriggers('create', t, { from, to:d.to });
  state.audit.unshift({ ts:nowMs(), who:'Graph · '+mb.addr.split('@')[0]+'@', action:'Ticket created from email', detail:`#${id} ${d.title} · ${client(d.clientId).name}${fired.length?` · ${fired.length} rule${fired.length===1?'':'s'}`:''}${trigs.length?` · ${trigs.length} trigger${trigs.length===1?'':'s'}`:''}` });
  toast(`New email to ${mb.addr.split('@')[0]}@ from ${contact(d.contactId).name} → ticket #${id}${(fired.length+trigs.length)?` · ${fired.length+trigs.length} automation${fired.length+trigs.length===1?'':'s'} fired`:''}.`);
  render();
}

function toast(msg){
  const w = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className='toast'; t.innerHTML=`<span class="cdot"></span><span>${msg}</span>`;
  w.appendChild(t); setTimeout(()=>t.remove(), 4200);
}

   settings) wire in the next drops; until then those edits are local-only
   and revert on the next hydrate.
   ============================================================================= */
(function(){
  const $fetch=(p,opt)=>fetch(p,{credentials:'same-origin',...(opt||{})});
  let ME=null, HYD=0;

  function mapIn(d){
    GROUPS.length=0; d.groups.forEach(g=>GROUPS.push(g));
    AGENTS.length=0; d.agents.forEach(a=>AGENTS.push(a));
    CLIENTS.length=0; d.clients.forEach(c=>CLIENTS.push(c));
    ATYPES.length=0; d.atypes.forEach(a=>ATYPES.push(a));
    const core=new Set(STATES.map(s=>s.id));
    d.states.forEach(s=>{ if(!core.has(s.id))
      STATES.push({id:s.id,label:s.label,cls:'st-hold',type:s.type,core:false,desc:''}); });
    state.tickets.length=0;
    d.tickets.forEach(t=>{
      t.tags=t.tags||[]; t.articles=t.articles||[]; t.time=t.time||[];
      state.tickets.push(t);
    });
    state.audit.length=0; d.audit.forEach(a=>state.audit.push(a));
    if(d.mailboxes){
      MAILBOXES.length=0;
      d.mailboxes.forEach(m=>MAILBOXES.push(m));
      if(!MAILBOXES.length) MAILBOXES.push({id:'mb0',addr:'(no mailbox configured)',
        type:'shared',groupId:(GROUPS[0]||{}).id,prio:2,outbound:false,
        desc:'Add one via /api/settings/mailboxes',status:'paused',today:0});
      Object.keys(GROUP_SENDAS).forEach(k=>delete GROUP_SENDAS[k]);
      GROUPS.forEach(g=>{ const m=MAILBOXES.find(x=>x.groupId===g.id)||MAILBOXES[0];
        if(m) GROUP_SENDAS[g.id]=m.id; });
    }
    try{
    RULES.length=0; TRIGGERS.length=0;   /* server automations engine is a coming build */
    d.tickets.forEach(t=>{ if(t.title) TITLES[t.id]=t.title; });
    AGENTS.forEach(a=>{ AGENT_SIGS[a.id]=a.name+(a.role?' \u00b7 '+a.role:''); });
    if(d.graph){
      GRAPH_AUTH.connected=d.graph.connected;
      GRAPH_AUTH.clientId=d.graph.clientId||'\u2014';
      GRAPH_AUTH.consentedAt=d.graph.at||null;
      GRAPH_AUTH.consentedBy=d.graph.by||'\u2014';
    }
    if(d.authCfg) Object.assign(AUTH_CFG, d.authCfg);
    if(d.secretMeta){
      const put=(slot,name,label)=>{ const m=d.secretMeta[name];
        SECRETS[slot]= m? {set:true, at:m.at, by:m.by, label} : {set:false, at:null, by:'', label}; };
      put('graphSecret','graph','Graph app client secret');
      put('entraSecret','entra_oidc','Entra OIDC client secret');
      put('voipKey','voipms','voip.ms API password');
      if(SECRETS.twilioKey!==undefined) put('twilioKey','twilio','Twilio auth token');
    }
    if(d.graph&&d.graph.tenant){ GRAPH_AUTH.tenant=d.graph.tenant; AUTH_CFG.tenant=AUTH_CFG.tenant||d.graph.tenant; }
    }catch(err){ console.error('cosmetic hydration failed (core data is live):', err); }
    if(d.roles){
      state.roleDefs.length=0;
      d.roles.forEach(r=>state.roleDefs.push({name:r.name,note:r.note||'',
        perms:new Set(r.perms),members:AGENTS.filter(a=>a.role===r.name).length,
        core:r.core,entra:r.entra||''}));
    }
    ME=d.me;
    state.user={name:ME.name,initials:ME.initials,role:'Live'};
    state.meId=(AGENTS.find(a=>a.email===ME.email)||{}).id||ME.id;
    state.perms=new Set(ME.perms);
    state.persona='live';
    state.ticketSeq=Math.max(100000,...state.tickets.map(t=>t.id));
  }

  async function hydrate(keepView){
    const r=await $fetch('/api/bootstrap');
    if(r.status===401){ location.href='login.html'; return; }
    if(!r.ok){
      const d=await r.json().catch(()=>({}));
      document.title='⚠ LIVE SYNC FAILED — Docket';
      console.error('bootstrap failed', r.status, d);
      alert('Live sync failed ('+r.status+'): '+(d.detail||'server error')+'\nShowing stale/demo data — check desk-api logs.');
      return;
    }
    const d=await r.json();
    const keep={view:state.view,ticketId:state.ticketId,clientId:state.clientId,
                qf:state.qf,searchQ:state.searchQ,overview:state.overview};
    mapIn(d);
    if(keepView!==false) Object.assign(state,keep);
    if(state.ticketId && !state.tickets.some(t=>t.id===state.ticketId)){
      state.view='queue'; state.ticketId=null; }
    render();
  }

  const typeName=id=>(ATYPES.find(a=>a.id===id)||{}).name||'Unclassified';
  const iso=ms=>new Date(ms).toISOString();
  const oops=async d=>{ alert('Live sync failed: '+(d&&d.detail||'unknown')); await hydrate(); };

  /* ---- composer: let the prototype do its local thing, then mirror ---- */
  const _sendArticle=window.sendArticle;
  window.sendArticle=function(tid){
    const t=tk(tid), before=t?t.articles.length:0;
    _sendArticle(tid);
    if(!t||t.articles.length===before) return;         // guard refused locally
    const a=t.articles[t.articles.length-1];
    const payload={kind:a.kind==='reply'?'reply':'note', body:a.body,
                   author_email:ME.email};
    if(a.time) payload.time={started_at:iso(a.time.startedAt||Date.now()-a.time.h*36e5),
      ended_at:iso(a.time.endedAt||Date.now()),
      activity_type:typeName(a.time.typeId), technician_email:ME.email,
      task_id:a.time.taskId&&a.time.taskId.length>10?a.time.taskId:null};
    $fetch('/api/tickets/'+tid+'/articles',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0));
        setTimeout(()=>hydrate(),700); });
  };

  /* ---- tags ---- */
  const wrapTags=(name)=>{ const orig=window[name];
    window[name]=function(tid,i){ const t=tk(tid), before=t?t.tags.slice():[];
      orig(tid,i); if(!t) return;
      const add=t.tags.filter(x=>!before.includes(x));
      const rem=before.filter(x=>!t.tags.includes(x));
      if(!add.length&&!rem.length) return;
      $fetch('/api/tickets/'+tid+'/tags',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({add,remove:rem})})
        .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0)); });
    }; };
  wrapTags('addTag'); wrapTags('rmTag');

  /* ---- directory: clients & contacts persist ---- */
  const PROF_KEYS=['industry','website','phone','fax','addr1','addr2','city','st','zip','tz','since','notes'];
  const _saveClient=window.saveClient;
  window.saveClient=function(cid){
    /* read the form BEFORE the original closes the modal — no demo defaults */
    const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
    const name=g('clName'), dom=g('clDomain');
    const profile={}; PROF_KEYS.forEach(k=>{ const v=g('cl'+k[0].toUpperCase()+k.slice(1)); if(v) profile[k]=v; });
    profile.notes=(document.getElementById('clNotes')||{value:''}).value.trim();
    const before=new Set(CLIENTS.map(c=>c.id));
    _saveClient(cid);
    if(!name) return;                              // original refused
    if(!cid){
      const t=CLIENTS.find(c=>!before.has(c.id));
      if(!t) return;
      $fetch('/api/directory/clients',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name, domains:dom?[dom]:[], profile})})
        .then(async r=>{ const d=await r.json().catch(()=>({}));
          if(!r.ok) return oops(d);
          if(state.clientId===t.id) state.clientId=d.id;
          hydrate(); });
    }else{
      const patch={name, profile}; if(dom) patch.domains=[dom];   // blank leaves server domains untouched
      $fetch('/api/directory/clients/'+encodeURIComponent(cid),{method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(patch)})
        .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0));
          hydrate(); });
    }
  };
  const _setClientStatus=window.setClientStatus;
  window.setClientStatus=function(cid,status){
    const c=(CLIENTS.find(x=>x.id===cid)||{}), was=c.status;
    _setClientStatus(cid,status);
    if(c.status===was) return;                     // sentinel / guard refused
    $fetch('/api/directory/clients/'+encodeURIComponent(cid),{method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({archived:status==='archived'})})
      .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0));
        hydrate(); });
  };
  const contactPayload=()=>{const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
    return {name:g('acName'), email:g('acEmail'), title:g('acTitle'),
            department:g('acDept'), phone:g('acPhone'), mobile:g('acMobile')};};
  const _saveContact=window.saveContact;
  window.saveContact=function(clientId, fromTicket){
    const p=contactPayload(); const c=tkc(clientId); const before=c?c.contacts.length:0;
    _saveContact(clientId, fromTicket);
    if(!c||c.contacts.length===before) return;     // original refused
    $fetch('/api/directory/contacts',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({client:clientId}, p))})
      .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0));
        if(!fromTicket) hydrate(); });             // ticket draft flow hydrates on create
  };
  const _saveContactEdit=window.saveContactEdit;
  window.saveContactEdit=function(clientId, pid){
    const p=contactPayload();
    const act=document.getElementById('acActive');
    _saveContactEdit(clientId, pid);
    if(String(pid).length<10) return;              // demo id — nothing server-side to edit
    $fetch('/api/directory/contacts/'+encodeURIComponent(pid),{method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({active:act?act.checked:true}, p))})
      .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0));
        hydrate(); });
  };
  function tkc(id){ return CLIENTS.find(c=>c.id===id); }

  /* ---- client / organization move ---- */
  const _reclient=window.reclientTicket;
  window.reclientTicket=function(tid,targetId){
    const t=tk(tid), was=t?t.clientId:null;
    _reclient(tid,targetId);
    if(!t||t.clientId===was) return;               // guard refused locally
    $fetch('/api/tickets/'+tid+'/client',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({client:targetId,version:t.version})})
      .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0));
        setTimeout(()=>hydrate(),400); });
  };

  /* ---- new ticket ---- */
  const _createTicket=window.createTicket;
  window.createTicket=function(){
    const beforeIds=new Set(state.tickets.map(t=>t.id));
    _createTicket();
    const t=state.tickets.find(x=>!beforeIds.has(x.id));
    if(!t) return;
    const cl=CLIENTS.find(c=>c.id===t.clientId)||{};
    const gr=GROUPS.find(g=>g.id===t.groupId)||{};
    const contact=(cl.contacts||[]).find(p=>p.id===t.contactId);
    $fetch('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:t.title||'(no subject)',client:cl.name,group:gr.name,
        contact_email:contact?contact.email:null,
        priority:(PRIOS.find(p=>p.id===t.prio)||{label:'Normal'}).label})})
      .then(async r=>{ const d=await r.json().catch(()=>({}));
        if(!r.ok) return oops(d);
        state.ticketId=(state.ticketId===t.id)?d.id:state.ticketId;
        setTimeout(()=>hydrate(),500); });
  };

  /* refresh on focus, throttled */
  window.addEventListener('focus',()=>{ if(Date.now()-HYD>30000){HYD=Date.now();hydrate();} });

  hydrate(false);
})();
</script>

</body>
</html>
