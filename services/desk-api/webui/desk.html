<style>
/* ============================ Design tokens (shared with Ledger) ============================ */
:root{
  --ink:#152029;          /* primary text / structure (deep petrol) */
  --ink-2:#4a5a64;        /* secondary text */
  --ink-3:#7c8b93;        /* tertiary / captions */
  --paper:#f5f6f4;        /* app background */
  --surface:#ffffff;      /* cards / rows */
  --surface-2:#fafbf9;    /* subtle fill */
  --line:#e3e7e4;         /* hairlines */
  --line-2:#eef1ee;
  --brand:#0e6e63;        /* primary action / brand (petrol teal) */
  --brand-ink:#0a4a43;
  --brand-wash:#e7f1ef;
  --billable:#1c7a4b;     /* solved / good */
  --billable-wash:#e7f3ec;
  --warn:#9a6b12;         /* pending / attention (brass) */
  --warn-wash:#f7efe0;
  --void:#a83a3a;         /* escalated / breached */
  --void-wash:#f6e9e9;
  --locked:#5b6b76;       /* closed / on hold (slate) */
  --locked-wash:#eef1f3;
  --seal:#b0862f;         /* seal gold */
  --open:#3457b2;         /* open state (ledger "submitted" blue) */
  --open-wash:#e7edfb;
  --shadow:0 1px 2px rgba(21,32,41,.06), 0 8px 24px -12px rgba(21,32,41,.18);
  --radius:10px;
  --radius-sm:7px;
  --rail:236px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--brand-wash)}

/* ============================ App shell ============================ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;background:var(--ink);color:#cdd8dc;
  display:flex;flex-direction:column;border-right:1px solid #0c161d;
}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:10px}
.brand-mark{
  width:30px;height:30px;border-radius:7px;background:var(--brand);
  display:grid;place-items:center;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)
}
.brand-mark svg{width:17px;height:17px;display:block}
.brand-name{font-weight:600;color:#fff;letter-spacing:.02em;font-size:15px;line-height:1}
.brand-sub{font-size:10.5px;color:#7f9096;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.nav{padding:8px 10px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.nav-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5f727a;padding:14px 8px 5px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  color:#c4d0d5;border:0;background:none;width:100%;text-align:left;font-size:13.5px;line-height:1.2;
}
.nav-item:hover{background:#1d2b35;color:#fff}
.nav-item.on{background:var(--brand);color:#fff}
.nav-item .ic{width:16px;height:16px;flex:0 0 auto;opacity:.9}
.nav-item .pip{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;background:#2a3b45;color:#e7eef0;padding:1px 6px;border-radius:20px;min-width:20px;text-align:center}
.nav-item.on .pip{background:rgba(255,255,255,.2)}
.nav-item .pip.warn{background:var(--warn);color:#fff}
.nav-item .pip.hot{background:var(--void);color:#fff}
.rail-foot{margin-top:auto;padding:12px;border-top:1px solid #223039}
.applink{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid #223039;
  background:#101a22;color:#c4d0d5;border-radius:9px;padding:9px 10px;margin-bottom:11px;
}
.applink:hover{background:#1d2b35;color:#fff;border-color:#2a3b45}
.applink .lmark{width:24px;height:24px;border-radius:6px;background:var(--seal);display:grid;place-items:center;flex:0 0 auto}
.applink .lmark svg{width:13px;height:13px}
.applink b{display:block;font-size:12.5px;color:#e7eef0;font-weight:600;line-height:1.2}
.applink span{display:block;font-size:10px;color:#7f9096;letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.applink .go{margin-left:auto;color:#5f727a;font-size:13px}
.who{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:#2a3b45;color:#e7eef0;display:grid;place-items:center;font-weight:600;font-size:12px;flex:0 0 auto}
.who-name{color:#fff;font-size:13px;line-height:1.2}
.who-meta{color:#7f9096;font-size:11px;line-height:1.3;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--billable);display:inline-block}
.dot.amber{background:var(--seal)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(245,246,244,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px
}
.page-title{font-size:18px;font-weight:600;letter-spacing:-.01em}
.page-sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:6px 11px;border-radius:20px}
.content{padding:22px 26px 60px;max-width:1240px;width:100%}

/* ============================ Primitives (shared with Ledger) ============================ */
.btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:7px 13px;border-radius:var(--radius-sm);font-weight:500;font-size:13px;
  display:inline-flex;align-items:center;gap:7px;line-height:1.1;transition:.12s;
}
.btn:hover{border-color:#cdd4cf;background:var(--surface-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.seal:hover{filter:brightness(.94)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--void);border-color:#e6cccc}
.btn.danger:hover{background:var(--void-wash)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card-head h3{margin:0;font-size:14px;font-weight:600}
.card-head .hint{color:var(--ink-3);font-size:12px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap;line-height:1.3}
.chip .cdot{width:6px;height:6px;border-radius:50%}
.chip.st-new{background:var(--brand-wash);color:var(--brand-ink)} .chip.st-new .cdot{background:var(--brand)}
.chip.st-open{background:var(--open-wash);color:var(--open)} .chip.st-open .cdot{background:var(--open)}
.chip.st-pending{background:var(--warn-wash);color:var(--warn)} .chip.st-pending .cdot{background:var(--warn)}
.chip.st-hold{background:var(--locked-wash);color:var(--locked)} .chip.st-hold .cdot{background:var(--locked)}
.chip.st-solved{background:var(--billable-wash);color:var(--billable)} .chip.st-solved .cdot{background:var(--billable)}
.chip.st-closed{background:#eef1f3;color:var(--ink-2)} .chip.st-closed .cdot{background:var(--ink-3)}
.chip.breach{background:var(--void-wash);color:var(--void)} .chip.breach .cdot{background:var(--void)}
.chip.ledger{background:var(--billable-wash);color:var(--billable)} .chip.ledger .cdot{background:var(--billable)}
.chip.tagchip{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.chip.tagchip button{border:0;background:none;color:var(--ink-3);padding:0 0 0 2px;font-size:12px;line-height:1}
.chip.tagchip button:hover{color:var(--void)}

.prio{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.prio .pflag{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.prio.p1{color:var(--ink-3)} .prio.p1 .pflag{background:#c6ced2}
.prio.p2{color:var(--ink-2)} .prio.p2 .pflag{background:#8fa1a9}
.prio.p3{color:var(--warn)} .prio.p3 .pflag{background:var(--warn)}
.prio.p4{color:var(--void)} .prio.p4 .pflag{background:var(--void)}

.grid{display:grid;gap:16px}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.rail{display:none}.g-3,.g-2,.g-4{grid-template-columns:1fr}}

.stat{padding:16px 18px}
.stat .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stat .val{font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.stat .val .u{font-size:14px;color:var(--ink-3);font-weight:500;margin-left:3px}
.stat .sub{font-size:12px;color:var(--ink-2);margin-top:4px}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)
}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr:hover{background:var(--surface-2)}
.cell-title{font-weight:500;color:var(--ink)}
.cell-meta{color:var(--ink-3);font-size:12px;margin-top:2px}
.time-cell{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);white-space:nowrap}
.time-cell b{color:var(--ink);font-weight:500}
.tape{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.rowbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;color:var(--ink-2)}
.rowbtn:hover{background:var(--surface-2);color:var(--ink)}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover{background:var(--surface-2)}
tr.rpt-total td{border-top:2px solid var(--ink-3)!important;font-weight:600;background:var(--surface-2)}
tr.rpt-total td:first-child{color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-size:11px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.rpt-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rpt-lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);width:70px;flex:0 0 70px;font-weight:600}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-size:12.5px;color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--ink);color:#fff}
.seg button .pip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;background:var(--line-2);color:var(--ink-2);padding:0 6px;border-radius:20px}
.seg button.on .pip{background:rgba(255,255,255,.22);color:#fff}
select,input[type=text],input[type=number],input[type=date],textarea{
  font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;outline:none;
}
select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-wash)}
select:disabled{opacity:.55;cursor:not-allowed}
.search{position:relative}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.search input{padding-left:31px;min-width:230px}
.spacer{flex:1}
.toggle{position:relative;width:38px;height:22px;border-radius:20px;background:#d5dbd6;border:0;transition:.15s;flex:0 0 auto}
.toggle.on{background:var(--billable)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on::after{left:18px}

.role-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.role-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.role-card.collapsed .role-card-head{margin-bottom:0}
.role-card-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0;user-select:none}
.role-caret{color:var(--ink-3);font-size:10px;width:11px;flex:none;transition:transform .12s;transform:rotate(0deg)}
.role-card.open .role-caret{transform:rotate(90deg)}
.perm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.perm-col{display:flex;flex-direction:column;gap:5px}
.perm-group{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.perm{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:4px 7px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.perm:hover{background:var(--surface-2)}
.perm.on{background:var(--brand-wash);color:var(--ink);border-color:#cfe6e1}
.perm input{accent-color:var(--brand);width:14px;height:14px;flex:0 0 auto}
.role-presets{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
@media(max-width:900px){.perm-grid{grid-template-columns:1fr}}

.money{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.section-gap{height:18px}
.empty{padding:44px;text-align:center;color:var(--ink-3)}
.empty svg{width:34px;height:34px;opacity:.4;margin-bottom:10px}
.bar{height:7px;border-radius:20px;background:var(--line-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand)}
.notice{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:9px;font-size:13px;line-height:1.5}
.notice.warn{background:var(--warn-wash);color:#6b4a0c;border:1px solid #ecdcb6}
.notice.info{background:var(--brand-wash);color:var(--brand-ink);border:1px solid #cfe4e0}
.notice.lock{background:var(--locked-wash);color:var(--locked);border:1px solid #d7dee2}
.notice svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}
.setting-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.setting-row:last-child{border-bottom:0}
.setting-row .sl{flex:1}
.setting-row .sl b{font-weight:600;font-size:13.5px}
.setting-row .sl p{margin:3px 0 0;color:var(--ink-3);font-size:12.5px}
.kv{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px}
.kv div{font-size:12px}
.kv .k{color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.kv .v{margin-top:2px;font-weight:500}

.scrim{position:fixed;inset:0;background:rgba(21,32,41,.42);display:none;place-items:center;z-index:100;padding:20px}
.scrim.open{display:grid}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);width:min(560px,100%);overflow:hidden}
.modal-head{padding:18px 20px 0}
.modal-head h3{margin:0 0 4px;font-size:17px}
.modal-head p{margin:0;color:var(--ink-3);font-size:13px}
.modal-body{padding:16px 20px}
.modal-foot{padding:14px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);background:var(--surface-2)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:5px}
.field select,.field input,.field textarea{width:100%}
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;display:flex;align-items:center;gap:10px;animation:tin .2s ease}
.toast .cdot{width:7px;height:7px;border-radius:50%;background:var(--billable)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.demo-pill{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);background:var(--warn-wash);border:1px solid #ecdcb6;border-radius:20px;padding:5px 10px}
.demo-pill b{color:#6b4a0c}
.demo-role{transform:scale(.92)} .demo-role button{padding:3px 9px;font-size:11.5px}
.mini{font-size:11px;color:var(--ink-3)}
.right{text-align:right}

/* ============================ Docket-specific: ticket workspace ============================ */
.tk-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:1000px){.tk-layout{grid-template-columns:1fr}}
.tk-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.tk-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.tk-num{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:13px;font-weight:500}

/* the case file: articles on a spine with a mono time tape */
.thread{position:relative;padding-left:0}
.art{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.art:last-child{border-bottom:0}
.art .avatar{width:28px;height:28px;font-size:11px;background:var(--locked-wash);color:var(--ink-2)}
.art.agent .avatar{background:var(--brand);color:#fff}
.art-main{flex:1;min-width:0}
.art-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.art-top b{font-size:13px;font-weight:600}
.art-kind{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.art-kind.note{color:var(--warn)}
.art-kind.mail{color:var(--open)}
.art-ts{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.art-body{margin-top:6px;font-size:13px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:11px 13px}
.art.note .art-body{background:var(--warn-wash);border-color:#ecdcb6;color:#5d430e}
.art.reply .art-body{background:var(--surface);border-color:var(--line)}
.art-time{margin-top:7px}
.art.sys{padding:7px 0;border-bottom:1px solid var(--line-2)}
.art-sysline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);width:100%}
.art-sysline .sdot{width:5px;height:5px;border-radius:50%;background:var(--ink-3);flex:0 0 auto;margin-left:11px}
.art-sysline .sts{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px}

/* composer with the built-in note timer (replaces the extension) */
.composer{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.composer.note-mode{border-color:#e4d3a8}
.composer-tabs{display:flex;align-items:center;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.composer.note-mode .composer-tabs{background:var(--warn-wash)}
.ctab{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.ctab.on{background:var(--ink);color:#fff}
.composer textarea{border:0;border-radius:0;width:100%;min-height:96px;resize:vertical;padding:12px 14px;font-size:13px;line-height:1.55;background:transparent;box-shadow:none}
.composer textarea:focus{box-shadow:none}
.composer-foot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line-2);background:var(--surface-2);flex-wrap:wrap}
.timer-pill{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);
  border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;
}
.timer-pill .tdot{width:7px;height:7px;border-radius:50%;background:#c6ced2;flex:0 0 auto}
.timer-pill.run .tdot{background:var(--billable);animation:pulse 1.6s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.timer-pill .tclock{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);min-width:42px}
.timer-pill .treset{border:0;background:none;color:var(--ink-3);font-size:11px;padding:0 0 0 2px}
.timer-pill .treset:hover{color:var(--void)}
.composer-foot select{padding:5px 8px;font-size:12.5px}

/* properties sidebar */
.props .prop{padding:11px 16px;border-bottom:1px solid var(--line-2)}
.props .prop:last-child{border-bottom:0}
.props .pk{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:5px}
.props select{width:100%;padding:6px 9px;font-size:12.5px}
.props .pv{font-size:13px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tagadd{border:1px dashed var(--line);background:none;color:var(--ink-3);border-radius:20px;padding:2px 9px;font-size:11.5px}
.tagadd:hover{color:var(--brand);border-color:var(--brand)}
.timeled{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.timeled:last-child{border-bottom:0}
.timeled .avatar{width:22px;height:22px;font-size:9.5px}
.sla-line{display:flex;align-items:center;gap:7px;font-size:12.5px}
.sla-line .sdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.ok-sla .sdot{background:var(--billable)} .ok-sla{color:var(--ink-2)}
.due-sla .sdot{background:var(--warn)} .due-sla{color:var(--warn)}
.breach-sla .sdot{background:var(--void)} .breach-sla{color:var(--void);font-weight:600}
</style>
</head>

<script>
/* ==========================================================================
   Docket — the helpdesk that replaces Zammad, built as Ledger's sibling.
   Interactive frontend prototype: all state lives in memory; reload resets.
   The shipped app persists to PostgreSQL and shares clients, agents, RBAC
   and sign-on with Ledger; the note timer is native (no extension needed).
   ========================================================================== */

/* fixed "today" so the demo is stable — same demo clock as Ledger */
const NOW = window.LIVE_MODE ? new Date() : new Date('2026-07-26T15:30:00'); /* live: real clock; demo: pinned so the seed is stable */
const BOOT = Date.now();               // real ms at load, for the live timer
const nowMs = () => NOW.getTime() + (Date.now() - BOOT);
/* time entries are intervals: date + start + end are the source of truth,
   hours are DERIVED to 2 decimals (3:30pm–5:00pm → 1.50). */
const spanH = (a,b) => Math.round(Math.max(0,(b-a))/36000)/100;
const msDate = ms => { const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const msTime = ms => { const d=new Date(ms); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const validT = t => /^\d{2}:\d{2}$/.test(t||'');
const spanMs = (dateStr, timeStr) => new Date(dateStr+'T'+timeStr+':00').getTime();

/* ---------------- tiny utils ---------------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* for user-supplied strings embedded inside onclick='fn(\u2018...\u2019)' JS literals:
   entity-escaping is NOT enough there (the browser decodes entities before the JS
   parser runs), so backslash-escape the JS string too, then entity-escape. */
const jsq = s => esc(String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const H = 3600e3, MIN = 60e3;
function fmtDT(ms){ const d=new Date(ms); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtAgo(ms){
  const d = nowMs()-ms;
  if(d < MIN) return 'just now';
  if(d < H) return Math.round(d/MIN)+'m ago';
  if(d < 24*H) return Math.round(d/H)+'h ago';
  return Math.round(d/(24*H))+'d ago';
}
function fmtIn(ms){
  const d = ms-nowMs(), a=Math.abs(d);

  return d>=0 ? 'in '+t : t+' over';
}

const mbox = id => MAILBOXES.find(m=>m.id===id);
function outboundBoxes(){ return MAILBOXES.filter(m=>m.outbound && m.status==='connected'); }
function outboundFor(t){

function ruleWhen(r){
  if(!r.conds.length) return 'every inbound message';
  const F = {from:'from address', fromDomain:'sender domain', to:'to mailbox', subject:'subject', text:'subject or body'};
  return r.conds.map(c=>`${F[c.field]} ${c.op} \u201c${c.value}\u201d`).join(' and ');
}
function ruleThen(r){
  const a = r.act, out = [];
  if(a.groupId) out.push(`board \u2192 ${grp(a.groupId).name}`);
  if(a.prio) out.push(`priority ${prio(a.prio).label}`);
  if(a.prioAtLeast) out.push(`priority at least ${prio(a.prioAtLeast).label}`);
  if(a.tag) out.push(`tag \u201c${a.tag}\u201d`);
  if(a.notify) out.push('notify the group');
  return out.join(' \u00b7 ') || '\u2014';
}
function condMatch(c, meta){
  const hay = { from:meta.from, fromDomain:(meta.from||'').split('@')[1]||'', to:meta.to, subject:meta.subject, text:(meta.subject+' '+meta.body) }[c.field] || '';
  const vals = c.value.split(',').map(v=>v.trim().toLowerCase()).filter(Boolean);
  const h = hay.toLowerCase();
  return c.op==='is' ? vals.some(v=>h===v) : vals.some(v=>h.includes(v));
}
function applyAutomations(t, meta){
  const fired = [];
  RULES.filter(r=>r.enabled).forEach(r=>{
    if(!r.conds.every(c=>condMatch(c,meta))) return;
    const a = r.act, did = [];
    if(a.groupId){ t.groupId=a.groupId; did.push(`board \u2192 ${grp(a.groupId).name}`); }
    if(a.prio){ t.prio=a.prio; did.push(`priority ${prio(a.prio).label}`); }
    if(a.prioAtLeast && t.prio<a.prioAtLeast){ t.prio=a.prioAtLeast; did.push(`priority \u2192 ${prio(a.prioAtLeast).label}`); }
    if(a.tag && !t.tags.includes(a.tag)){ t.tags.push(a.tag); did.push(`tag \u201c${a.tag}\u201d`); }
    if(a.notify) did.push('group notified');
    r.runs++;
    if(did.length) fired.push({r, did});
  });
  fired.forEach(f=>{ t.articles.push(art('sys', {name:'Automation'}, nowMs(), `\u2699 Rule \u201c${f.r.name}\u201d \u2014 ${f.did.join(' \u00b7 ')}`));
    state.audit.unshift({ ts:nowMs(), who:'Automation', action:'Mail rule fired', detail:`#${t.id} \u00b7 \u201c${f.r.name}\u201d \u2014 ${f.did.join(' \u00b7 ')}` }); });
  t.updatedAt = nowMs();
  return fired;
}

function trigVars(t, tpl){
  const p = contact(t.contactId)||{}, c = client(t.clientId)||{}, o = t.ownerId? agent(t.ownerId) : null;
  return tpl
    .replaceAll('#{ticket.number}', String(t.id))
    .replaceAll('#{ticket.title}', TITLES[t.id]||firstLine(t))
    .replaceAll('#{customer.name}', p.name||'customer')
    .replaceAll('#{client.name}', c.name||'')
    .replaceAll('#{agent.name}', o? o.name : state.user.name)
    .replaceAll('#{state.label}', st8(t.st)?.label||t.st);
}
function trigCondMatch(c, t, meta){
  const hay = {
    state: st8(t.st)?.label||t.st,
    priority: prio(t.prio)?.label||'',
    group: grp(t.groupId)?.name||'',
    client: client(t.clientId)?.name||'',
    tags: t.tags.join(', '),
    from: meta?.from||'',
    mailbox: mbox(t.mailboxId)?.addr||'',
  }[c.field] || '';
  const vals = c.value.split(',').map(v=>v.trim().toLowerCase()).filter(Boolean);
  const h = String(hay).toLowerCase();
  const hit = c.op==='is'||c.op==='is not' ? vals.some(v=>h===v) : vals.some(v=>h.includes(v));
  return (c.op==='is not'||c.op==='not contains') ? !hit : hit;
}
function fireTriggers(event, t, meta){
  const fired = [];
  TRIGGERS.filter(g=>g.enabled && g.event===event).forEach(g=>{
    if(g.event==='state' && g.eventValue && g.eventValue!==t.st) return;
    if(!g.conds.every(c=>trigCondMatch(c,t,meta))) return;
    const did = [];
    g.actions.forEach(a=>{
      if(a.type==='email'){
        const from = outboundFor(t);
        const ar = art('reply', {name:'Docket \u00b7 trigger', initials:'\u26a1'}, nowMs(), trigVars(t, a.value));
        ar.from = from.addr; ar.auto = true;
        t.articles.push(ar);
        did.push(`emailed ${contact(t.contactId)?.name||'customer'} from ${from.addr.split('@')[0]}@`);
      }
      if(a.type==='note'){ t.articles.push(art('note', {name:'Docket \u00b7 trigger', initials:'\u26a1'}, nowMs(), trigVars(t, a.value))); did.push('internal note added'); }
      if(a.type==='tag' && a.value && !t.tags.includes(a.value)){ t.tags.push(a.value); did.push(`tag \u201c${a.value}\u201d`); }
      if(a.type==='state' && st8(a.value)){ t.st=a.value; did.push(`state \u2192 ${st8(a.value).label}`); }
      if(a.type==='prio' && prio(Number(a.value))){ t.prio=Number(a.value); did.push(`priority \u2192 ${prio(Number(a.value)).label}`); }
      if(a.type==='group' && grp(a.value)){ t.groupId=a.value; did.push(`board \u2192 ${grp(a.value).name}`); }
      if(a.type==='autoassign' && !t.ownerId){
        const pool = AGENTS.filter(x=>x.groups.includes(t.groupId));
        if(pool.length){
          let pick;
          if(a.value==='least'){
            pick = pool.slice().sort((x,y)=> state.tickets.filter(q=>q.ownerId===x.id && !isDone(q)).length
                                            - state.tickets.filter(q=>q.ownerId===y.id && !isDone(q)).length)[0];
            did.push(`assigned \u2192 ${pick.name.split(' ')[0]} (least loaded)`);
          } else {
            GROUP_RR[t.groupId] = ((GROUP_RR[t.groupId]??-1)+1) % pool.length;
            pick = pool[GROUP_RR[t.groupId]];
            did.push(`assigned \u2192 ${pick.name.split(' ')[0]} (round-robin)`);
          }
          t.ownerId = pick.id;
        }
      }
    });
    g.runs++;
    if(did.length){
      t.articles.push(art('sys', {name:'Trigger'}, nowMs(), `\u26a1 Trigger \u201c${g.name}\u201d \u2014 ${did.join(' \u00b7 ')}`));
      state.audit.unshift({ ts:nowMs(), who:'Automation', action:'Trigger fired', detail:`#${t.id} \u00b7 \u201c${g.name}\u201d \u2014 ${did.join(' \u00b7 ')}` });
      fired.push(g);
    }
  });
  if(fired.length) t.updatedAt = nowMs();
  return fired;
}

/* CSV: rows = array of arrays; downloads client-side */
function csvEsc(v){ v = String(v ?? ''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(name, rows){
  const csv = rows.map(r=>r.map(csvEsc).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = name; a.click();
  log('CSV exported', `${name} \u00b7 ${rows.length-1} rows`);
  toast(`${name} \u2014 ${rows.length-1} rows.`);
}

const D = (mo,day,h,mi=0) => new Date(2026, mo-1, day, h, mi).getTime();

/* kinds: 'mail-in' (customer email) · 'reply' (agent, public) · 'note' (internal) · 'sys' */

function mkTicket(t){
  t.tags = t.tags||[]; t.articles = t.articles||[]; t.time = t.time||[];
  /* one object per entry: the article chip and the ticket's time list must be
     the same record, so an edit in either place is an edit everywhere */
  t.articles.forEach(a=>{ if(a.time && !t.time.includes(a.time)){
    const m = t.time.find(e=>!e._ln && e.techId===a.time.techId && e.h===a.time.h && e.typeId===a.time.typeId);
    if(m){ a.time = m; m._ln = true; } } });
  t.time.forEach(e=>{ delete e._ln;
    if(!e.eid) e.eid = 'te'+(state.teSeq=(state.teSeq||0)+1);
    if(!e.endedAt){ const holder=t.articles.find(a=>a.time===e); const end=holder?holder.ts:(t.updatedAt||nowMs());
      e.endedAt=end; e.startedAt=end - e.h*H; }
    e.h = spanH(e.startedAt, e.endedAt); });
  t.createdAt = t.articles.length? t.articles[0].ts : nowMs();
  t.updatedAt = t.articles.length? t.articles[t.articles.length-1].ts : t.createdAt;
  state.tickets.push(t); return t;
}

/* SLA: first-response due until an agent replies; then resolution due */
/* Business calendar — SLA hours only tick inside working time.
   Editable in Settings; the walk is 15-min steps (fast enough at SLA scale). */
const BIZ = { days:[1,2,3,4,5], start:8, end:18, holidays:['2026-07-03','2026-11-26','2026-12-25'] };
function isBizTime(ms){
  const d = new Date(ms);
  if(!BIZ.days.includes(d.getDay())) return false;
  if(BIZ.holidays.includes(msDate(ms))) return false;
  const hr = d.getHours() + d.getMinutes()/60;
  return hr >= BIZ.start && hr < BIZ.end;
}
function addBizHours(startMs, hours){
  let remaining = hours*60, t = startMs;
  const STEP = 15;
  let guard = 0;
  while(remaining > 0 && guard++ < 40000){
    if(isBizTime(t)) remaining -= STEP;
    t += STEP*MIN;
  }
  return t;
}
function slaInfo(t){
  if((st8(t.st)||{}).type!=='open') return null;
  const pol = SLA[t.prio];
  if(!t.slaFrMet){
    const due = addBizHours(t.createdAt, pol.fr);
    return { kind:'First response', due, breached: nowMs()>due };
  }
  const due = addBizHours(t.createdAt, pol.res);
  return { kind:'Resolution', due, breached: nowMs()>due };
}

  const isAgent = a.kind!=='mail-in';

  const tIdx = a.time ? t.time.indexOf(a.time) : -1;

         <span class="tape" style="font-weight:600">${fmtHours(a.time.h)} h</span>

         ${isProj(t)?`· <select style="width:auto;max-width:150px;font-size:11.5px;padding:1px 18px 1px 4px;border:1px solid var(--line);border-radius:5px;background:#fff" ${projEditable(t)?'':'disabled'} onchange="editTimeEntry(${t.id},${tIdx},'taskId',this.value)" title="Which checklist task this time bills under — audited"><option value="">— no task —</option>${t.project.tasks.map(x=>`<option value="${x.id}" ${a.time.taskId===x.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`:''}
         <button class="rowbtn" style="padding:0 6px" onclick="removeTimeEntry(${t.id},${tIdx})" title="Remove this entry — Ledger keeps a voided row">×</button></span></div>`
    : a.time && can('see_billing')
    ? `<div class="art-time"><span class="chip ledger"><span class="cdot"></span><span class="tape">${msTime(a.time.startedAt)}–${msTime(a.time.endedAt)} · ${fmtHours(a.time.h)} h</span>&nbsp;→ Ledger · ${esc(atype(a.time.typeId).name)}${atype(a.time.typeId).id==='a0'?' — classify there':''}${isProj(t)&&a.time.taskId?` · ${esc(projTask(t,a.time.taskId)?.label||'')}`:''}</span></div>`

  return `<div class="art ${a.kind} ${isAgent?'agent':''}">
    <span class="avatar">${esc(av)}</span>
    <div class="art-main">
      <div class="art-top" style="display:flex;align-items:center;gap:8px"><b>${esc(a.author.name)}</b>${kindLab}${a.editedAt?`<span class="mini muted" title="Edited ${fmtDT(a.editedAt)} — original preserved in the audit log">· edited</span>`:''}${noteActions}<span class="art-ts">${fmtDT(a.ts)}</span></div>
      ${bodyHtml}

      ${timeChip}
    </div>
  </div>`;
}

/* segmented inputs (time / datetime-local / number spinners) fire change
   while still focused; re-rendering then destroys the field mid-typing.
   Commit state immediately, defer the re-render to blur. */
function commitRender(srcEl){
  if(srcEl && document.activeElement===srcEl){ srcEl.addEventListener('blur', ()=>render(), {once:true}); }
  else render();
}
/* ---- API — a working in-page mock of the future desk-api ---- */
const API_TOKENS = [ { id:'tk1', label:'reporting-bot', token:'dk_live_7f3a9q2m8x1c', createdAt:Date.now(), lastUsed:null } ];
let nextTokIx = 2;
window.DocketAPI = {
  _auth(tok){ const t = API_TOKENS.find(x=>x.token===tok); if(!t) throw new Error('401 invalid token'); t.lastUsed = Date.now(); return true; },
  call(path, token){
    this._auth(token);
    const [p, qs] = String(path).split('?');
    if(p==='/api/tickets'){
      const params = Object.fromEntries((qs||'').split('&').filter(Boolean).map(x=>x.split('=')));
      let rows = state.tickets.filter(t=>!t.mergedInto);
      if(params.state) rows = rows.filter(t=>t.st===params.state);
      if(params.client) rows = rows.filter(t=>t.clientId===params.client);
      return rows.map(t=>({ number:t.id, title:TITLES[t.id]||firstLine(t), state:t.st, priority:t.prio, client:client(t.clientId).name, owner:t.ownerId?agent(t.ownerId).name:null, hours:Number(fmtHours(timeTotal(t))), updated:new Date(t.updatedAt).toISOString() }));
    }
    const mt = p.match(/^\/api\/tickets\/(\d+)$/);
    if(mt){ const t = tk(Number(mt[1])); if(!t) throw new Error('404');
      return { number:t.id, title:TITLES[t.id]||firstLine(t), state:t.st, priority:t.prio, tags:t.tags, cc:t.cc||[], pendingUntil:t.pendingUntil||null,
        articles:t.articles.filter(a=>a.kind!=='sys').map(a=>({kind:a.kind, author:a.author.name, ts:new Date(a.ts).toISOString(), body:a.body, attachments:(a.atts||[]).map(f=>f.name)})),
        time:t.time.map(e=>({tech:agent(e.techId).name, started:new Date(e.startedAt).toISOString(), ended:new Date(e.endedAt).toISOString(), hours:e.h, type:atype(e.typeId).name})) }; }
    if(p==='/api/reports/queue'){
      return { open: state.tickets.filter(t=>!isDone(t)&&!t.mergedInto).length,
               unassigned: state.tickets.filter(t=>!t.ownerId&&!isDone(t)&&!t.mergedInto).length,
               breached: state.tickets.filter(t=>{const x=slaInfo(t);return x&&x.breached;}).length,
               byGroup: Object.fromEntries(GROUPS.map(g=>[g.name, state.tickets.filter(t=>t.groupId===g.id&&!isDone(t)&&!t.mergedInto).length])) };
    }
    if(p==='/api/audit'){ return state.audit.slice(0,200).map(a=>({ts:new Date(a.ts).toISOString(), who:a.who, action:a.action, detail:a.detail})); }
    throw new Error('404 \u2014 known: /api/tickets, /api/tickets/:id, /api/reports/queue, /api/audit');
  }
};

function bulkApply(k, v){
  if(!v){ render(); return; }
  const ids = state.bulk.slice(); let n = 0;
  ids.forEach(id=>{
    const t = tk(id); if(!t || t.mergedInto) return;
    if(k==='tag'){ if(can('edit_props') && !t.tags.includes(v)){ t.tags.push(v); n++; } return; }
    if(k==='owner' && can('assign')){ setProp(id,'ownerId',v); n++; }
    if(k==='st' && (can('edit_props')||can('close'))){ setProp(id,'st',v); n++; }
    if(k==='prio' && can('edit_props')){ setProp(id,'prio',v); n++; }
  });
  if(k==='tag' && n) log('Bulk tag added', `\u201c${v}\u201d on ${n} tickets`);
  state.bulk = [];
  toast(`Applied to ${n} ticket${n===1?'':'s'} \u2014 each change audited individually.`);
  render();
}

  if(f.client!=='all') rows = rows.filter(t=>t.clientId===f.client);
  const data = [['number','title','client','contact','group','state','priority','owner','tags','opened','updated','hours_logged','sla_due','sla_breached']];

}

function checkSlaEscalations(){
  let hit = false;
  state.tickets.forEach(t=>{
    if(t.mergedInto) return;
    const s = slaInfo(t); if(!s) return;
    if(s.breached && !t._slaBreachNotified){
      t._slaBreachNotified = true; hit = true;
      notify('breach', `SLA BREACHED \u2014 #${t.id} ${(TITLES[t.id]||firstLine(t)).slice(0,40)} \u00b7 ${s.kind.toLowerCase()} overdue`, t.id);
    } else if(!s.breached && !t._slaWarned && s.due - nowMs() < 2*H){
      t._slaWarned = true; hit = true;
      notify('warn', `SLA due soon \u2014 #${t.id} ${(TITLES[t.id]||firstLine(t)).slice(0,40)} \u00b7 ${s.kind.toLowerCase()} ${fmtIn(s.due)}`, t.id);
    }
  });
  if(hit){ const bb=document.getElementById('bellBox'); if(!(bb && bb.matches && bb.matches(':hover'))) render(); }
}
function gSearch(q){

      String(t.id).includes(ql) ||
      (TITLES[t.id]||firstLine(t)).toLowerCase().includes(ql) ||
      t.articles.some(a=>a.kind!=='sys' && (a.body||'').toLowerCase().includes(ql))

function composerTimerStart(tid){
  if(state.timer && state.timer.ticketId===tid) return;
  state.timer = { ticketId:tid, startedReal:Date.now() };
  const el=document.getElementById('timerPill'); if(el) el.classList.add('run');
  tickTimer();
}
function timerSeconds(){ return state.timer ? (Date.now()-state.timer.startedReal)/1000 : 0; }
function demoStart(){ return state.timer ? NOW.getTime() + (state.timer.startedReal - BOOT) : nowMs(); }
function setTW(k,v){
  const cm = state.composer;
  cm.tw = cm.tw || { date:msDate(demoStart()), start:msTime(demoStart()), end:msTime(nowMs()) };
  if(k!=='date' && !validT(v)) return;              /* partial “:30 --” keystrokes never poison the span */
  if(k==='date' && !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  cm.tw[k] = v; cm.tw.manual = true;
  const el = document.getElementById('twH'); if(el){ const h=composerH(); el.textContent = isNaN(h)? '0.00' : h.toFixed(2); }
}
function composerSpan(){
  const cm = state.composer;
  if(cm.tw && cm.tw.manual){
    const a = spanMs(cm.tw.date, cm.tw.start); let b = spanMs(cm.tw.date, cm.tw.end);
    return { a, b };
  }
  const a = demoStart(); const b = nowMs();
  return { a, b };
}
function composerH(){ const {a,b} = composerSpan(); const h = spanH(a,b); return isNaN(h)? 0 : h; }
function tickTimer(){
  checkPendingWakes();
  checkSlaEscalations();
  const el=document.getElementById('timerClock');
  if(el && state.timer && state.timer.ticketId===state.ticketId) el.textContent = fmtClock(timerSeconds());
  const st=document.getElementById('timerStart');
  if(st && state.timer) st.textContent = new Date(NOW.getTime()+(state.timer.startedReal-BOOT)).toTimeString().slice(0,5);
  if(state.timer && !(state.composer.tw&&state.composer.tw.manual)){
    const te=document.getElementById('twEnd'); if(te && document.activeElement!==te) te.value = msTime(nowMs());
    const ts2=document.getElementById('twStart'); if(ts2 && document.activeElement!==ts2) ts2.value = msTime(demoStart());
    const td=document.getElementById('twDate'); if(td && document.activeElement!==td) td.value = msDate(demoStart());
    const hh=document.getElementById('twH'); if(hh){ const h=composerH(); hh.textContent = isNaN(h)? '0.00' : h.toFixed(2); }
  }
}

}; }

function editTimeEntry(tid, i, k, v, srcEl){
  const t = tk(tid), e = t.time[i]; if(!e) return;
  if(projLocked(t)){ toast('Approved project \u2014 time is frozen. Admin unlock available on the checklist card.'); commitRender(srcEl); return; }
  if(!(can('see_billing') || (can('log_time') && e.techId===state.meId))) return;
  const oldH = e.h;
  if(k==='date' || k==='start' || k==='end'){
    if(k!=='date' && !validT(v)){ commitRender(srcEl); return; }
    if(k==='date' && !/^\d{4}-\d{2}-\d{2}$/.test(v)){ commitRender(srcEl); return; }
    const wasS=e.startedAt, wasE=e.endedAt;
    let a = e.startedAt, b = e.endedAt;
    if(k==='date'){ const dur=b-a; a = spanMs(v, msTime(a)); b = a + dur; }
    if(k==='start') a = spanMs(msDate(e.startedAt), v);
    if(k==='end')   b = spanMs(msDate(e.endedAt), v);
    if(!(b>a)){ toast('End must be after start \u2014 change not saved. (Worked past noon? 4:30 PM is 16:30.)'); commitRender(srcEl); return; }
    e.startedAt=a; e.endedAt=b; e.h = spanH(a,b);
    log('Time entry edited', `#${t.id} \u00b7 ${agent(e.techId).name.split(' ')[0]} \u00b7 ${msTime(wasS)}\u2013${msTime(wasE)} \u2192 ${msTime(a)}\u2013${msTime(b)} on ${msDate(a)} = ${fmtHours(e.h)} h`);
  } else if(k==='typeId'){
    log('Time entry reclassified', `#${t.id} \u00b7 ${atype(e.typeId).name} \u2192 ${atype(v).name}`);
    e.typeId = v;
  } else if(k==='taskId'){
    if(!isProj(t) || !projEditable(t)) return;
    const was = e.taskId? (projTask(t,e.taskId)?.label||'?') : '(no task)';
    const now = v? (projTask(t,v)?.label||'?') : '(no task)';
    log('Time entry moved between tasks', `#${t.id} \u00b7 ${was} \u2192 ${now}`);
    e.taskId = v||null;
  }
  t.updatedAt = nowMs();
  bridgeSend('time-updated', { eid:e.eid, startedAt:e.startedAt, endedAt:e.endedAt, h:e.h, oldH, techId:e.techId, typeId:e.typeId, ticket:t.id, task: taskPayload(t, e.taskId) });
  toast(`Span saved \u2014 ${msTime(e.startedAt)}\u2013${msTime(e.endedAt)} = ${fmtHours(e.h)} h. Audited and mirrored in Ledger.`); commitRender(srcEl);
}
function removeTimeEntry(tid, i){
  if(projLocked(tk(tid))){ toast('Approved project \u2014 time is frozen.'); return; }
  const t = tk(tid), e = t.time[i]; if(!e) return;
  if(!(can('see_billing') || (can('log_time') && e.techId===state.meId))) return;
  const holder = t.articles.find(a=>a.time===e);

  bridgeSend('time-removed', { eid:e.eid, ticket:t.id, techId:e.techId, typeId:e.typeId, h:e.h });
  toast('Entry removed here — Ledger keeps a voided row for the audit trail.'); render();
}

function sendArticle(tid){
  const t = tk(tid); const cm = state.composer;
  const body = document.getElementById('composeBody').value.trim();
  if(!body){ toast('Write something first — the composer is empty.'); return; }
  if(cm.kind==='reply' && !can('reply')) return;
  if(cm.kind==='note' && !can('note')) return;
  if(projLocked(t)){ toast('This project is approved & locked \u2014 an admin can unlock it from the checklist card.'); return; }
  /* validate EVERYTHING before touching the ticket — a blocked send must
     leave no side effects (no cc persistence, no state, nothing) */
  const to = cm.kind==='reply' ? (cm.to ?? contact(t.contactId)?.email ?? '').trim() : null;
  if(cm.kind==='reply' && !to){ toast('The reply needs a To address.'); return; }
  let logged = null;
  if(can('log_time') && cm.logTime){
    const { a:spA, b:spB } = composerSpan();
    if(!(spB>spA) || isNaN(spB-spA)){ toast('Set a real span \u2014 end after start. (Worked past noon? 4:30 PM is 16:30.)'); return; }
    const h = spanH(spA, spB);
    if(h < 0.01){ toast('That span rounds to 0.00 h \u2014 adjust the start or end time.'); return; }
    logged = { startedAt:spA, endedAt:spB, h, typeId: cm.typeId, techId: state.meId, eid:'te'+(state.teSeq=(state.teSeq||0)+1) };
    if(isProj(t)){
      logged.taskId = cm.taskId || defaultTaskId(t);
      if(!logged.taskId){ toast('Pick the checklist task this time belongs to.'); return; }
    }
  }
  /* --- all checks passed; mutations begin --- */
  let outBody = body;
  if(cm.kind==='reply'){
    const sigP = AGENT_SIGS[state.meId], sigB = BOARD_SIGS[t.groupId];
    outBody = body + (sigP||sigB ? '\n\n' + [sigP, sigB].filter(Boolean).join('\n') : '');
  }
  const a = art(cm.kind==='reply'?'reply':'note', me(), nowMs(), outBody);
  if(cm.kind==='reply'){
    a.from = outboundFor(t).addr;
    a.to = to;
    const ccList = (cm.cc ?? (t.cc||[]).join(', ')).split(',').map(x=>x.trim()).filter(Boolean);
    if(ccList.length) a.cc = ccList;
    const keep = cm.keepCc ?? !!(t.cc&&t.cc.length);
    const before = (t.cc||[]).join(', ');
    if(keep && ccList.length){
      if(before !== ccList.join(', ')){ t.cc = ccList; log('Cc list saved on ticket', `#${t.id} \u00b7 ${before||'\u2014'} \u2192 ${ccList.join(', ')}`); }
    } else if(!keep && t.cc && t.cc.length){
      log('Cc persistence removed', `#${t.id} \u00b7 was: ${before}`); delete t.cc;
    }
  }
  if(cm.atts && cm.atts.length){ a.atts = cm.atts; cm.atts = []; }
  if(logged){
    if(cm.tw && cm.tw.manual) log('Time entered manually', `#${t.id} \u00b7 ${msTime(logged.startedAt)}\u2013${msTime(logged.endedAt)} on ${msDate(logged.startedAt)} = ${fmtHours(logged.h)} h`);
    cm.tw = null;
    a.time = logged;
    t.time.push(logged);
  }
  t.articles.push(a);
  if(logged) bridgeSend('time-logged', { eid:logged.eid, ticket:t.id, title:TITLES[t.id]||firstLine(t), clientId:t.clientId, techId:logged.techId, typeId:logged.typeId, h:logged.h, startedAt:logged.startedAt, endedAt:logged.endedAt, note:body.slice(0,140), task: taskPayload(t, logged.taskId) });
  if(cm.kind==='reply'){ t.slaFrMet = true; }
  if(t.st==='new' && cm.kind==='reply'){
    t.st='open';
    log('State changed', `#${t.id} \u00b7 New \u2192 Open (first reply)`);
    fireTriggers('state', t);
  }
  t.updatedAt = nowMs();
  log(cm.kind==='reply'?'Reply sent':'Note added', `#${t.id} ${TITLES[t.id]||''}`.trim() + (logged?` · ${fmtHours(logged.h)}h → Ledger (${atype(logged.typeId).name})`:'') + (a.atts?` · ${a.atts.length} attachment${a.atts.length===1?'':'s'}`:''));
  state.timer=null;
  toast(cm.kind==='reply'
    ? (logged? `Reply sent · ${fmtHours(logged.h)} h logged to Ledger.` : 'Reply sent.')
    : (logged? `Note added · ${fmtHours(logged.h)} h logged to Ledger.` : 'Note added.'));
  render();
}

function mergeModal(tid){
  if(!can('edit_props')) return;
  const t = tk(tid);
  const cands = state.tickets.filter(x=>x.id!==tid && !x.mergedInto);
  const m = document.getElementById('modal');
  m.innerHTML = `
    <div class="modal-head"><h3>Merge #${tid} into\u2026</h3><p>Everything moves to the target \u2014 the full thread (with a divider), every time entry, tags and the Cc list. This ticket becomes a closed stub that points at the target. This cannot be undone in the UI.</p></div>
    <div class="modal-body"><div class="field"><label>Target ticket</label>
      <select id="mgTarget">${cands.map(x=>`<option value="${x.id}">#${x.id} \u00b7 ${esc((TITLES[x.id]||firstLine(x)).slice(0,60))} (${esc(client(x.clientId).name)})</option>`).join('')}</select></div>
      <div class="mini muted">Cross-client merges are allowed but flagged in the audit line.</div></div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doMerge(${tid})">Merge</button></div>`;
  document.getElementById('scrim').classList.add('open');
}
function doMerge(fromId){
  const from = tk(fromId), to = tk(Number(document.getElementById('mgTarget').value));
  if(!from || !to) return;
  const crossClient = from.clientId!==to.clientId;
  to.articles.push(art('sys', me(), nowMs(), `\u2b07 Merged from #${from.id} \u2014 \u201c${TITLES[from.id]||firstLine(from)}\u201d \u2014 thread and time follow`));
  from.articles.forEach(a=>{ to.articles.push(a); });
  from.time.forEach(e=>{ to.time.push(e); });
  to.tags = [...new Set([...to.tags, ...from.tags])];
  if(from.cc && from.cc.length) to.cc = [...new Set([...(to.cc||[]), ...from.cc])];
  from.articles = [ art('sys', me(), nowMs(), `Merged into #${to.id}`) ];
  from.time = [];
  from.st = 'closed'; from.mergedInto = to.id;
  delete from.pendingUntil;
  to.updatedAt = nowMs(); from.updatedAt = nowMs();
  log('Ticket merged', `#${from.id} \u2192 #${to.id}${crossClient?' \u00b7 CROSS-CLIENT':''} \u00b7 thread, time, tags and Cc moved`);
  bridgeSend('ticket-merged', { from:from.id, to:to.id });
  toast(`Merged into #${to.id} \u2014 everything moved; this ticket is now a stub.`);
  closeModal(); openTicket(to.id);
}

function doLink(tid){

function unlink(tid, other){

function setPendingUntil(tid, v, srcEl){

function checkPendingWakes(){
  let woke = false;
  state.tickets.forEach(t=>{

function viewClient(){
  const c = client(state.clientId);
  if(!c) return '';
  const arch = c.status==='archived';
  const ts = state.tickets.filter(t=>t.clientId===c.id && ticketVisible(t)).sort((a,b)=>b.updatedAt-a.updatedAt);

/* Reports filter state. Every prior filter is kept; new: custom from/to date
   range, date basis (updated vs created), ticket state, tag, full-text search
   over titles + article bodies, and a selectable breakdown table with CSV. */
const RF_DEFAULTS = { preset:'all', from:'', to:'', basis:'updated', group:'all', client:'all', tech:'all', prio:'all', st:'all', tag:'all', q:'', breakdown:'group' };
function rf(){ return state.rf = Object.assign({}, RF_DEFAULTS, state.rf||{}); }
function setRF(k,v){ rf()[k]=v; render(); }
function setRFPreset(v){ const f=rf(); f.preset=v; f.from=''; f.to=''; render(); }
function setRFDate(k,v){ const f=rf(); f[k]=v; f.preset='custom'; render(); }
/* text search: re-render live but keep focus + caret in the search box
   (innerHTML rebuild would otherwise blur it on every keystroke) */
function setRFQ(el){ const pos=el.selectionStart; rf().q=el.value; render();
  const n=document.getElementById('rfQ'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
function clearRF(){ const keep={ basis:rf().basis, breakdown:rf().breakdown }; state.rf = Object.assign({}, RF_DEFAULTS, keep); render(); }
/* the filtered slice — one function so the stat cards, charts, breakdown
   table and CSV export all see exactly the same tickets */
function reportSlice(){
  const f = rf();
  let sc = scoped();
  const bt = t => f.basis==='created' ? t.createdAt : t.updatedAt;
  if(f.from){ const s=new Date(f.from+'T00:00:00').getTime(); sc = sc.filter(t=>bt(t)>=s); }
  if(f.to){ const e=new Date(f.to+'T23:59:59').getTime(); sc = sc.filter(t=>bt(t)<=e); }
  if(!f.from && !f.to){
    const cut = { '24h':24*H, '7d':7*24*H, '30d':30*24*H }[f.preset];
    if(cut) sc = sc.filter(t=>nowMs()-bt(t) <= cut);
  }
  if(f.group!=='all') sc = sc.filter(t=>t.groupId===f.group);
  if(f.client!=='all') sc = sc.filter(t=>t.clientId===f.client);
  if(f.prio!=='all') sc = sc.filter(t=>String(t.prio)===f.prio);
  if(f.tech!=='all') sc = sc.filter(t=>t.ownerId===f.tech || t.time.some(e=>e.techId===f.tech));
  if(f.st!=='all'){
    if(f.st.startsWith('type:')){ const ty=f.st.slice(5); sc = sc.filter(t=>(st8(t.st)||{}).type===ty); }
    else sc = sc.filter(t=>t.st===f.st);
  }
  if(f.tag!=='all'){
    if(f.tag==='(untagged)') sc = sc.filter(t=>t.tags.length===0);
    else sc = sc.filter(t=>t.tags.includes(f.tag));
  }
  if(f.q){
    const ql = f.q.toLowerCase();
    sc = sc.filter(t =>
      String(t.id).includes(ql) ||
      (TITLES[t.id]||firstLine(t)).toLowerCase().includes(ql) ||
      client(t.clientId).name.toLowerCase().includes(ql) ||
      t.articles.some(a=>a.kind!=='sys' && (a.body||'').toLowerCase().includes(ql)));
  }
  return sc;
}
/* breakdown: group the slice by the chosen dimension with per-bucket metrics.
   Tag buckets can overlap (a ticket carries several tags) — that's expected. */
function reportBreakdown(sc){
  const f = rf();
  const push = (m,k,t)=>{ (m.get(k)||m.set(k,[]).get(k)).push(t); };
  const m = new Map();
  sc.forEach(t=>{
    if(f.breakdown==='group') push(m, grp(t.groupId).name, t);
    else if(f.breakdown==='client') push(m, client(t.clientId).name, t);
    else if(f.breakdown==='tech') push(m, t.ownerId?agent(t.ownerId).name:'(unassigned)', t);
    else if(f.breakdown==='prio') push(m, prio(t.prio).label, t);
    else if(f.breakdown==='state') push(m, st8(t.st).label, t);
    else if(f.breakdown==='tag'){ if(t.tags.length===0) push(m,'(untagged)',t); else t.tags.forEach(tag=>push(m,tag,t)); }
  });
  const rows = [...m.entries()].map(([label,ts])=>{
    const frs = ts.map(t=>{ const r=t.articles.find(a=>a.kind==='reply'); return r? (r.ts-t.createdAt)/H : null; }).filter(x=>x!==null).sort((a,b)=>a-b);
    return { label, n:ts.length,
      open: ts.filter(t=>!isDone(t)).length,
      resolved: ts.filter(isDone).length,
      hours: ts.reduce((a,t)=>a+timeTotal(t),0),
      medFR: frs.length? frs[Math.floor(frs.length/2)] : null };
  }).sort((a,b)=>b.n-a.n || b.hours-a.hours);
  return rows;
}
const RF_BREAKDOWNS = [['group','By group'],['client','By client'],['tech','By technician'],['prio','By priority'],['state','By state'],['tag','By tag']];
function reportCSVRowsDk(){
  const f = rf();
  const dim = (RF_BREAKDOWNS.find(([v])=>v===f.breakdown)||['','Dimension'])[1].replace('By ','');
  const data = [[dim.toLowerCase(), 'tickets', 'open', 'resolved', 'hours_logged', 'median_first_response_h']];
  reportBreakdown(reportSlice()).forEach(r=>
    data.push([r.label, r.n, r.open, r.resolved, r.hours.toFixed(2), r.medFR===null?'':r.medFR.toFixed(2)]));
  return data;
}

/* ==========================================================================
   PROJECTS — checklist-driven project tickets
   A project IS a ticket (t.isProject) so the thread, composer, SLA, owner and
   bridge all work unchanged. On top of it: a task checklist (templated at
   creation, editable with manage_projects), per-task billing (hourly at the
   standard Ledger price, hourly at an override rate, or a flat fee — mix
   freely), time entries pinned to tasks, and a review flow: all tasks done →
   Submit for review (manage_projects) → Approve (approve_projects) → the
   project bills to Ledger over the bridge. Approval freezes the checklist.
   ========================================================================== */
const PROJ_TEMPLATES = [
  { id:'blank', name:'Blank project', tasks:[] },
  { id:'onboard', name:'Client onboarding', tasks:['Discovery & audit','Network & firewall setup','Workstation rollout','M365 / email migration','Documentation & handoff'] },
  { id:'srvmig', name:'Server migration', tasks:['Pre-migration audit','New host provisioning','Data migration','Cutover & DNS','Decommission & documentation'] },
];
let PTSEQ = 1;
/* full-ticket lock after approval: immutable to everyone except an admin
   unlock (approve_projects). Unlock reopens the TICKET (notes, time, props);
   the approved checklist & billing stay frozen — they already billed. */
function projLocked(t){ return isProj(t) && t.project.status==='approved' && !t.project.unlocked; }
function unlockProject(tid){
  const t=tk(tid); if(!can('approve_projects')||!isProj(t)||t.project.status!=='approved') return;
  t.project.unlocked=true;
  log('Project ticket unlocked (admin)', `#${t.id} \u2014 notes, time and properties editable again; approved billing stays frozen \u2014 by ${agent(state.meId).name}`);
  toast('Ticket unlocked \u2014 the approved checklist & billing remain frozen.');
  render();
}
function relockProject(tid){
  const t=tk(tid); if(!can('approve_projects')||!isProj(t)||!t.project.unlocked) return;
  t.project.unlocked=false;
  log('Project ticket re-locked', `#${t.id} \u2014 by ${agent(state.meId).name}`);
  render();
}
function defaultTaskId(t){ const x=t.project.tasks.find(y=>!y.done)||t.project.tasks[0]; return x?x.id:null; }
function taskPayload(t, taskId){ if(!isProj(t)||!taskId) return null; const x=projTask(t,taskId); return x? {id:x.id,label:x.label} : null; }
const mkTask = (label, mode='hourly') => ({ id:'pt'+(PTSEQ++), label, done:false, doneAt:null, doneBy:null, mode, rate:null, flat:null });
const isProj = t => !!(t && t.isProject);
const projTask = (t,id) => t.project.tasks.find(x=>x.id===id);
const projEditable = t => isProj(t) && t.project.status==='open';
function projHours(t, taskId){ return t.time.filter(e=>e.taskId===taskId).reduce((a,e)=>a+e.h,0); }
function projUnassignedTime(t){ return t.time.filter(e=>!e.taskId); }
function projSummary(t){
  const p=t.project; let flat=0, hourlyH=0;
  if(p.pmode==='flat'){
    /* one flat rate covers the whole project — every task, every hour */
    flat = p.projectFlat||0;
  } else {
    p.tasks.forEach(x=>{ const h=projHours(t,x.id);
      if(x.mode==='flat') flat += (x.flat||0); else hourlyH += h; });
  }
  return { flat, hourlyH, done:p.tasks.filter(x=>x.done).length, total:p.tasks.length, pflat:p.pmode==='flat' };
}
function setProjectBilling(tid, k, v, srcEl){
  const t=tk(tid); if(!can('manage_projects')||!projEditable(t)) return;
  const p=t.project;
  if(k==='pmode'){
    if(v!=='tasks'&&v!=='flat') return;
    log('Project billing model changed', `#${t.id} \u00b7 ${p.pmode==='flat'?'single flat rate':'per-task'} \u2192 ${v==='flat'?'single flat rate':'per-task'}`);
    p.pmode=v; render(); return;
  }
  if(k==='projectFlat'){
    const n = v===''? null : Number(v);
    if(v!=='' && (isNaN(n)||n<0)) return;
    log('Project flat rate set', `#${t.id} \u00b7 $${p.projectFlat||0} \u2192 $${n||0}`);
    p.projectFlat=n; commitRender(srcEl);
  }
}
function projStatusChip(t){
  const s=t.project.status, sum=projSummary(t);
  if(s==='approved') return `<span class="chip st-solved"><span class="cdot"></span>Approved &amp; billed</span>`;
  if(s==='review')   return `<span class="chip st-pending"><span class="cdot"></span>In review</span>`;
  if(sum.total>0 && sum.done===sum.total) return `<span class="chip st-open"><span class="cdot"></span>Tasks complete</span>`;
  return `<span class="chip st-new"><span class="cdot"></span>In progress</span>`;
}
function toggleTask(tid, taskId){
  const t=tk(tid), x=projTask(t,taskId); if(!t||!x) return;
  if(!projEditable(t)) return;
  if(!(can('log_time')||can('manage_projects'))) return;
  x.done=!x.done; x.doneAt = x.done? nowMs() : null; x.doneBy = x.done? state.meId : null;
  t.updatedAt=nowMs();
  log(x.done?'Project task completed':'Project task reopened', `#${t.id} \u00b7 \u201c${x.label}\u201d${x.done?' \u2014 by '+agent(state.meId).name:''}`);
  render();
}
function addProjTask(tid){
  const t=tk(tid); if(!can('manage_projects')||!projEditable(t)) return;
  const label=(prompt('Task label')||'').trim(); if(!label) return;
  t.project.tasks.push(mkTask(label, t.project.defaultMode||'hourly'));
  log('Project task added', `#${t.id} \u00b7 \u201c${label}\u201d`); render();
}
function renameProjTask(tid, taskId){
  const t=tk(tid), x=projTask(t,taskId); if(!can('manage_projects')||!projEditable(t)||!x) return;
  const label=(prompt('Rename task', x.label)||'').trim(); if(!label||label===x.label) return;
  log('Project task renamed', `#${t.id} \u00b7 \u201c${x.label}\u201d \u2192 \u201c${label}\u201d`); x.label=label; render();
}
function rmProjTask(tid, taskId){
  const t=tk(tid), x=projTask(t,taskId); if(!can('manage_projects')||!projEditable(t)||!x) return;
  if(x.done){ toast('Reopen the task before removing it.'); return; }
  if(projHours(t,taskId)>0){ toast('This task has time logged under it \u2014 move or remove the time first.'); return; }
  t.project.tasks = t.project.tasks.filter(y=>y.id!==taskId);
  log('Project task removed', `#${t.id} \u00b7 \u201c${x.label}\u201d`); render();
}
function setTaskBilling(tid, taskId, k, v, srcEl){
  const t=tk(tid), x=projTask(t,taskId); if(!can('manage_projects')||!projEditable(t)||!x) return;
  if(k==='mode'){
    if(v!=='hourly'&&v!=='flat') return;
    log('Task billing changed', `#${t.id} \u00b7 \u201c${x.label}\u201d \u00b7 ${x.mode} \u2192 ${v}`);
    x.mode=v; render(); return;
  }
  const n = v===''? null : Number(v);
  if(v!=='' && (isNaN(n)||n<0)) return;
  if(k==='rate'){ log('Task hourly rate set', `#${t.id} \u00b7 \u201c${x.label}\u201d \u00b7 ${x.rate==null?'standard':'$'+x.rate} \u2192 ${n==null?'standard':'$'+n}/h`); x.rate=n; }
  if(k==='flat'){ log('Task flat fee set', `#${t.id} \u00b7 \u201c${x.label}\u201d \u00b7 $${x.flat||0} \u2192 $${n||0}`); x.flat=n; }
  commitRender(srcEl);
}
function submitProject(tid){
  const t=tk(tid); if(!can('manage_projects')||!projEditable(t)) return;
  const sum=projSummary(t);
  if(sum.total===0){ toast('Add at least one task first.'); return; }
  if(sum.done<sum.total){ toast(`${sum.total-sum.done} task${sum.total-sum.done===1?'':'s'} still open \u2014 complete the checklist first.`); return; }
  const loose=projUnassignedTime(t);
  if(loose.length){ toast(`${loose.length} time entr${loose.length===1?'y isn\u2019t':'ies aren\u2019t'} assigned to a task \u2014 set the task on each entry first.`); return; }
  if(t.project.pmode==='flat'){
    if(!(t.project.projectFlat>0)){ toast('Set the project flat rate before submitting.'); return; }
  } else {
    const badFlat=t.project.tasks.filter(x=>x.mode==='flat'&&!(x.flat>0));
    if(badFlat.length){ toast(`Set the flat fee on \u201c${badFlat[0].label}\u201d before submitting.`); return; }
  }
  t.project.status='review'; t.project.submittedAt=nowMs(); t.project.submittedBy=state.meId;
  t.updatedAt=nowMs();
  log('Project submitted for review', `#${t.id} \u00b7 ${sum.total} tasks \u00b7 ${fmtHours(sum.hourlyH)} h hourly + $${sum.flat} flat \u2014 by ${agent(state.meId).name}`);
  toast('Project submitted \u2014 an approver signs off and it bills to Ledger.');
  render();
}
function reopenProject(tid){
  const t=tk(tid); if(!t||t.project.status!=='review') return;
  if(!(can('approve_projects')||can('manage_projects'))) return;
  t.project.status='open'; t.project.submittedAt=null; t.project.submittedBy=null;
  log('Project review reopened', `#${t.id} \u2014 back to In progress \u2014 by ${agent(state.meId).name}`);
  render();
}
function approveProject(tid){
  const t=tk(tid); if(!can('approve_projects')||!t||t.project.status!=='review') return;
  const p=t.project;
  p.status='approved'; p.approvedAt=nowMs(); p.approvedBy=state.meId;
  if((st8(t.st)||{}).type!=='done'){ t.st='solved'; log('State changed', `#${t.id} \u00b7 \u2192 Solved (project approved)`); }
  t.updatedAt=nowMs();
  const sum=projSummary(t);
  log('Project approved \u2192 Ledger', `#${t.id} \u00b7 ${sum.total} tasks \u00b7 ${fmtHours(sum.hourlyH)} h hourly + $${sum.flat} flat \u2014 approved by ${agent(state.meId).name}`);
  bridgeSend('project-approved', { ticket:t.id, title:TITLES[t.id]||firstLine(t), clientId:t.clientId,
    approvedBy:agent(state.meId).name, approvedAt:p.approvedAt, pmode:p.pmode||'tasks', projectFlat:p.projectFlat||null,
    tasks:p.tasks.map(x=>({ id:x.id, label:x.label, mode:x.mode, rate:x.rate, flat:x.flat, hours:projHours(t,x.id) })) });
  toast('Project approved \u2014 billing details sent to Ledger.');
  render();
}

function createProject(){
  const title=document.getElementById('pjTitle').value.trim();
  if(!title){ toast('The project needs a title.'); return; }
  const clientId=document.getElementById('pjClient').value, groupId=document.getElementById('pjGroup').value;
  const tpl=PROJ_TEMPLATES.find(x=>x.id===document.getElementById('pjTpl').value)||PROJ_TEMPLATES[0];
  const sel=document.getElementById('pjMode').value;
  const pmode = sel==='pflat' ? 'flat' : 'tasks';
  const mode = sel==='flat' ? 'flat' : 'hourly';
  const id=++state.ticketSeq;
  const t=mkTicket({ id, clientId, contactId:(client(clientId).contacts[0]||{}).id, groupId, ownerId:state.meId, st:'open', prio:2, tags:['project'],
    isProject:true, project:{ status:'open', template:tpl.id, defaultMode:mode, pmode, projectFlat:null, tasks:tpl.tasks.map(l=>mkTask(l,mode)), submittedAt:null, submittedBy:null, approvedAt:null, approvedBy:null },
    articles:[ art('sys', agent(state.meId), nowMs(), `Project created from template \u201c${tpl.name}\u201d`) ] });
  TITLES[id]=title;
  log('Project created', `#${id} \u00b7 ${title} \u00b7 ${esc(client(clientId).name)} \u00b7 template \u201c${tpl.name}\u201d \u00b7 ${tpl.tasks.length} tasks`);
  closeModal(); openTicket(id);
}

    :`<div class="empty">${icon(IC.proj)}<div>No projects yet.${can('manage_projects')?' Create one \u2014 pick a checklist template and set per-task billing.':''}</div></div>`}</div>`;
}
function projChecklistCard(t){
  const p=t.project, sum=projSummary(t), open=projEditable(t), mng=can('manage_projects');
  const loose=projUnassignedTime(t).length;
  const pflat = p.pmode==='flat';
  const taskRows = p.tasks.map(x=>{
    const h=projHours(t,x.id);
    const billing = pflat
      ? `<span class="mini muted" title="Covered by the project flat rate">\u2014 project rate \u2014</span>`
      : open&&mng
      ? `<select style="width:auto;font-size:12px;padding:3px 6px" onchange="setTaskBilling(${t.id},'${x.id}','mode',this.value)">
           <option value="hourly" ${x.mode==='hourly'?'selected':''}>Hourly</option><option value="flat" ${x.mode==='flat'?'selected':''}>Flat fee</option></select>
         ${x.mode==='hourly'
           ? `<input type="number" min="0" step="5" placeholder="std rate" value="${x.rate==null?'':x.rate}" style="width:88px;font-size:12px;padding:3px 6px" title="$/h override \u2014 empty = standard Ledger pricing" onchange="setTaskBilling(${t.id},'${x.id}','rate',this.value,this)">`
           : `<span class="mini">$</span><input type="number" min="0" step="50" placeholder="0" value="${x.flat==null?'':x.flat}" style="width:88px;font-size:12px;padding:3px 6px" title="Fixed fee for this task, regardless of hours" onchange="setTaskBilling(${t.id},'${x.id}','flat',this.value,this)">`}`
      : (x.mode==='flat' ? `<span class="mini tape">$${(x.flat||0).toLocaleString()} flat</span>` : `<span class="mini tape">${x.rate!=null?('$'+x.rate+'/h'):'std hourly'}</span>`);
    return `<tr class="${x.done?'locked-row':''}">
      <td class="selcell"><input type="checkbox" ${x.done?'checked':''} ${open&&(can('log_time')||mng)?'':'disabled'} onclick="toggleTask(${t.id},'${x.id}')" title="${x.done?'Reopen':'Mark complete'}"></td>
      <td><div class="cell-title" style="font-weight:500;${x.done?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(x.label)}</div>
        ${x.done?`<div class="cell-meta">done ${fmtAgo(x.doneAt)}${x.doneBy?' by '+esc(agent(x.doneBy).name.split(' ')[0]):''}</div>`:''}</td>
      <td style="white-space:nowrap">${billing}</td>
      <td class="num"><span class="tape">${fmtHours(h)}</span> h</td>
      <td class="right">${open&&mng?`<button class="rowbtn" onclick="renameProjTask(${t.id},'${x.id}')" title="Rename">Edit</button><button class="rowbtn" onclick="rmProjTask(${t.id},'${x.id}')" title="Remove (no time, not done)">\u00d7</button>`:''}</td>
    </tr>`; }).join('');
  let foot='';
  if(p.status==='approved'){
    foot=`<div class="notice lock">${icon(IC.seal)}<div><b>Approved ${fmtAgo(p.approvedAt)} by ${esc(agent(p.approvedBy)?.name||'')}.</b> ${p.unlocked?'Checklist &amp; billing stay frozen, but the ticket is <b>admin-unlocked</b> \u2014 notes, time and properties are editable.':'The whole ticket is locked \u2014 checklist, billing, thread, time and properties are immutable.'}</div>
      <span class="spacer"></span>
      ${can('approve_projects')? (p.unlocked
        ? `<button class="btn sm" onclick="relockProject(${t.id})">${icon(IC.seal)}Re-lock</button>`
        : `<button class="btn sm ghost" onclick="unlockProject(${t.id})" title="Reopens notes, time and properties; the approved billing stays frozen">Unlock (admin)</button>`) : ''}</div>`;
  } else if(p.status==='review'){
    foot=`<div class="notice info">${icon(IC.clock)}<div><b>Submitted for review ${fmtAgo(p.submittedAt)} by ${esc(agent(p.submittedBy)?.name||'')}.</b> ${can('approve_projects')?'Approve to bill the project to Ledger, or reopen it.':'Waiting on an approver.'}</div>
      <span class="spacer"></span>
      ${can('approve_projects')?`<button class="btn seal sm" onclick="approveProject(${t.id})">${icon(IC.seal)}Approve &amp; bill</button>`:''}
      ${(can('approve_projects')||mng)?`<button class="btn sm ghost" onclick="reopenProject(${t.id})">Reopen</button>`:''}</div>`;
  } else {
    const ready = sum.total>0 && sum.done===sum.total && loose===0;
    foot=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="mini muted">${sum.done}/${sum.total} tasks complete${loose?` \u00b7 <span style="color:var(--warn)">${loose} time entr${loose===1?'y':'ies'} without a task</span>`:''}</span>
      <span class="spacer"></span>
      ${mng?`<button class="btn sm ghost" onclick="addProjTask(${t.id})">${icon(IC.plus)}Add task</button>`:''}
      ${mng?`<button class="btn primary sm" ${ready?'':'disabled title="Complete every task and assign all time to tasks first"'} onclick="submitProject(${t.id})">Submit for review</button>`:''}
    </div>`;
  }
  const billingRow = `<div class="card-pad" style="border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span class="mini" style="font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)">Billing model</span>
    ${open&&mng?`<div class="seg">
      <button class="${!pflat?'on':''}" onclick="setProjectBilling(${t.id},'pmode','tasks')" title="Each task bills hourly (standard or override rate) or as its own flat fee \u2014 mix freely">Per task</button>
      <button class="${pflat?'on':''}" onclick="setProjectBilling(${t.id},'pmode','flat')" title="One fixed fee covers the entire project regardless of hours">Single flat rate</button>
    </div>`:`<span class="mini tape">${pflat?'single flat rate':'per task'}</span>`}
    ${pflat?(open&&mng
      ?`<span class="mini">$</span><input type="number" min="0" step="100" placeholder="0" value="${p.projectFlat==null?'':p.projectFlat}" style="width:110px;font-size:12.5px;padding:4px 6px" title="Fixed fee for the whole project" onchange="setProjectBilling(${t.id},'projectFlat',this.value,this)">`
      :`<span class="tape" style="font-weight:600">$${(p.projectFlat||0).toLocaleString()} flat \u2014 whole project</span>`):''}
  </div>`;
  return `<div class="card" style="margin-bottom:14px">
    <div class="card-head"><h3>Project checklist</h3>${projStatusChip(t)}
      <span class="hint" style="margin-left:auto">${sum.pflat?`$${sum.flat.toLocaleString()} flat \u2014 whole project`:`${fmtHours(sum.hourlyH)} h hourly${sum.flat>0?` \u00b7 $${sum.flat.toLocaleString()} in flat fees`:''}`} \u00b7 detail &amp; pricing in Ledger</span></div>
    ${billingRow}
    <table class="tbl"><thead><tr><th class="selcell"></th><th>Task</th><th>Billing</th><th class="num">Time</th><th></th></tr></thead>
    <tbody>${taskRows || `<tr><td colspan="5" class="mini muted" style="padding:14px 16px">No tasks yet${mng?' \u2014 add the first one below':''}.</td></tr>`}</tbody></table>
    <div class="card-pad" style="border-top:1px solid var(--line)">${foot}</div>
  </div>`;
}

function toggleRole(name){ state.openRole = state.openRole===name? null : name; render(); }
function togglePerm(name, pid){
  const r = state.roleDefs.find(r=>r.name===name); if(!r) return;
  if(r.perms.has(pid)) r.perms.delete(pid); else r.perms.add(pid);
  log('Role updated', `${name} · ${r.perms.has(pid)?'granted':'revoked'} “${PERM_CATALOG.find(p=>p.id===pid).label}”`);
  if(state.persona.toLowerCase()===name.toLowerCase()){ state.perms=new Set(r.perms); }
  render();
}
function applyPreset(name, preset){
  const r = state.roleDefs.find(r=>r.name===name); if(!r) return;
  r.perms = new Set(PRESETS[preset]); log('Role preset applied', `${name} ← ${preset}`); render();
}

        <div class="field"><label>Ledger permissions start from</label><select id="rlLPreset">${['Technician','Dispatcher','Admin','(none)'].map(k=>`<option>${k}</option>`).join('')}</select></div>
      </div>`}
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRole('${jsq(name||'')}')">${name?'Save role':'Add role'}</button></div>`;
  document.getElementById('scrim').classList.add('open');
  document.getElementById('rlName').focus();
}
function saveRole(oldName){
  const name = document.getElementById('rlName').value.trim();
  const note = document.getElementById('rlNote').value.trim();
  if(!name){ toast('The role needs a name.'); return; }
  if(name!==oldName && state.roleDefs.some(r=>r.name===name)){ toast('A role with that name already exists.'); return; }
  if(oldName){
    const r = state.roleDefs.find(x=>x.name===oldName);
    if(name!==oldName){
      log('Role renamed', `${oldName} \u2192 ${name} \u2014 both apps`);
      if(LEDGER_ROLE_PERMS[oldName]){ LEDGER_ROLE_PERMS[name]=LEDGER_ROLE_PERMS[oldName]; delete LEDGER_ROLE_PERMS[oldName]; }
      if(ENTRA_MAP[oldName]!==undefined){ ENTRA_MAP[name]=ENTRA_MAP[oldName]; delete ENTRA_MAP[oldName]; }
      Object.values(PERSONAS).forEach(p=>{ if(p.role===oldName) p.role=name; });
      if(state.user.role===oldName) state.user.role=name;
      if(state.openRole===oldName) state.openRole=name;
      bridgeSend('dir-role-upsert', { role:{ name, oldName, note, ledgerPerms:[...(LEDGER_ROLE_PERMS[name]||[])] } });
    } else if(note!==r.note){ log('Role description updated', name); }
    r.name=name; r.note=note;
  } else {
    const dp = document.getElementById('rlDPreset').value, lp = document.getElementById('rlLPreset').value;
    state.roleDefs.push({ name, note, perms:new Set(dp==='(none)'?[]:PRESETS[dp]), members:0 });
    LEDGER_ROLE_PERMS[name] = new Set(lp==='(none)'?[]:[...(LEDGER_ROLE_PERMS[lp]||[])]);
    ENTRA_MAP[name] = 'SG-Desk-'+name.replace(/\s+/g,'');
    log('Role added', `${name} \u2014 Docket from ${dp}, Ledger from ${lp} \u2014 assign people via the matching Entra group`);
    bridgeSend('dir-role-upsert', { role:{ name, note, ledgerPerms:[...LEDGER_ROLE_PERMS[name]] } });
  }
  toast(`Role \u201c${name}\u201d saved \u2014 applies in both apps.`);
  closeModal(); render();
}
function archiveRole(name){
  const r = state.roleDefs.find(x=>x.name===name);
  if(name==='Admin'){ toast('Admin can\u2019t be archived \u2014 someone has to hold the keys.'); return; }
  r.active = r.active===false ? true : false;
  const arch = r.active===false;
  log(arch?'Role archived':'Role restored', `${name}${arch?' \u2014 its Entra group stops granting access in both apps; members keep their other roles':''}`);
  bridgeSend('dir-role-upsert', { role:{ name, note:r.note, active:r.active!==false, ledgerPerms:[...(LEDGER_ROLE_PERMS[name]||[])] } });
  toast(`Role \u201c${name}\u201d ${arch?'archived \u2014 both apps':'restored'}.`);
  render();
}
function deleteRole(name){
  const r = state.roleDefs.find(x=>x.name===name);
  if(r.core){ toast('Built-in roles can be renamed but not deleted \u2014 the Entra mapping depends on them.'); return; }
  if(r.members>0){ toast(`\u201c${name}\u201d still has members \u2014 move them to another Entra group first.`); return; }
  state.roleDefs.splice(state.roleDefs.indexOf(r),1);
  delete LEDGER_ROLE_PERMS[name];
  delete ENTRA_MAP[name];
  bridgeSend('dir-role-delete', { name });
  log('Role deleted', `${name} \u2014 both apps`);
  toast(`Role \u201c${name}\u201d deleted.`);
  render();
}

function toggleLedgerPerm(name, pid){
  const set = LEDGER_ROLE_PERMS[name] || (LEDGER_ROLE_PERMS[name]=new Set());
  if(set.has(pid)) set.delete(pid); else set.add(pid);
  log('Ledger permission '+(set.has(pid)?'granted':'revoked'), `${name} \u00b7 \u201c${LEDGER_PERMS.find(p=>p.id===pid).label}\u201d \u2014 via Directory`);
  bridgeSend('dir-role-perms', { role:{ name, perms:[...set] } });
  render();
}

function goBoard(gid){ state.qf.group = gid; state.overview='allopen'; go('tickets'); }

  if(state.tickets.some(t=>t.prio===pid)){ toast(`Tickets still carry \u201c${p.label}\u201d \u2014 re-prioritise them first.`); return; }
  if(MAILBOXES.some(m=>m.prio===pid)){ toast(`A mailbox defaults to \u201c${p.label}\u201d \u2014 change it in Automations first.`); return; }
  PRIOS.splice(PRIOS.findIndex(x=>x.id===pid),1); delete SLA[pid];
  log('Priority deleted', p.label); toast(`Priority \u201c${p.label}\u201d deleted.`); render();
}

   Ledger and any future app. Every change here broadcasts live.
