<title>Ledger — Hemingway Tech Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================ Design tokens ============================ */
:root{
  --ink:#152029;          /* primary text / structure (deep petrol) */
  --ink-2:#4a5a64;        /* secondary text */
  --ink-3:#7c8b93;        /* tertiary / captions */
  --paper:#f5f6f4;        /* app background */
  --surface:#ffffff;      /* cards / rows */
  --surface-2:#fafbf9;    /* subtle fill */
  --line:#e3e7e4;         /* hairlines */
  --line-2:#eef1ee;
  --brand:#0e6e63;        /* primary action / brand (petrol teal) */
  --brand-ink:#0a4a43;
  --brand-wash:#e7f1ef;
  --billable:#1c7a4b;     /* money / billable status */
  --billable-wash:#e7f3ec;
  --warn:#9a6b12;         /* unclassified / attention (brass) */
  --warn-wash:#f7efe0;
  --void:#a83a3a;         /* deleted / voided */
  --void-wash:#f6e9e9;
  --locked:#5b6b76;       /* immutable / locked */
  --locked-wash:#eef1f3;
  --seal:#b0862f;         /* approval seal gold */
  --shadow:0 1px 2px rgba(21,32,41,.06), 0 8px 24px -12px rgba(21,32,41,.18);
  --radius:10px;
  --radius-sm:7px;
  --rail:236px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--brand-wash)}

/* ============================ App shell ============================ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}

/* ---- Left rail ---- */
.rail{
  position:sticky;top:0;height:100vh;background:var(--ink);color:#cdd8dc;
  display:flex;flex-direction:column;border-right:1px solid #0c161d;
}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:10px}
.brand-mark{
  width:30px;height:30px;border-radius:7px;background:var(--brand);
  display:grid;place-items:center;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)
}
.brand-mark svg{width:17px;height:17px;display:block}
.brand-name{font-weight:600;color:#fff;letter-spacing:.02em;font-size:15px;line-height:1}
.brand-sub{font-size:10.5px;color:#7f9096;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.nav{padding:8px 10px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.nav-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5f727a;padding:14px 8px 5px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  color:#c4d0d5;border:0;background:none;width:100%;text-align:left;font-size:13.5px;line-height:1.2;
}
.nav-item:hover{background:#1d2b35;color:#fff}
.nav-item.on{background:var(--brand);color:#fff}
.nav-item .ic{width:16px;height:16px;flex:0 0 auto;opacity:.9}
.nav-item .pip{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;background:#2a3b45;color:#e7eef0;padding:1px 6px;border-radius:20px;min-width:20px;text-align:center}
.nav-item.on .pip{background:rgba(255,255,255,.2)}
.nav-item .pip.warn{background:var(--warn);color:#fff}
.rail-foot{margin-top:auto;padding:12px;border-top:1px solid #223039}
.who{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:#2a3b45;color:#e7eef0;display:grid;place-items:center;font-weight:600;font-size:12px;flex:0 0 auto}
.who-name{color:#fff;font-size:13px;line-height:1.2}
.who-meta{color:#7f9096;font-size:11px;line-height:1.3;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--billable);display:inline-block}
.dot.amber{background:var(--seal)}

/* ---- Main ---- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(245,246,244,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px
}
.page-title{font-size:18px;font-weight:600;letter-spacing:-.01em}
.page-sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:6px 11px;border-radius:20px}
.content{padding:22px 26px 60px;max-width:1240px;width:100%}

/* ============================ Primitives ============================ */
.btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:7px 13px;border-radius:var(--radius-sm);font-weight:500;font-size:13px;
  display:inline-flex;align-items:center;gap:7px;line-height:1.1;transition:.12s;
}
.btn:hover{border-color:#cdd4cf;background:var(--surface-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.seal:hover{filter:brightness(.94)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--void);border-color:#e6cccc}
.btn.danger:hover{background:var(--void-wash)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card-head h3{margin:0;font-size:14px;font-weight:600}
.card-head .hint{color:var(--ink-3);font-size:12px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap;line-height:1.3}
.chip .cdot{width:6px;height:6px;border-radius:50%}
.chip.pending{background:var(--brand-wash);color:var(--brand-ink)} .chip.pending .cdot{background:var(--brand)}
.chip.approved{background:var(--locked-wash);color:var(--locked)} .chip.approved .cdot{background:var(--locked)}
.chip.void{background:var(--void-wash);color:var(--void);text-decoration:none} .chip.void .cdot{background:var(--void)}
.chip.billable{background:var(--billable-wash);color:var(--billable)} .chip.billable .cdot{background:var(--billable)}
.chip.nonbill{background:#eef1f3;color:var(--ink-2)} .chip.nonbill .cdot{background:var(--ink-3)}
.chip.unclassified{background:var(--warn-wash);color:var(--warn)} .chip.unclassified .cdot{background:var(--warn)}
.chip.exported{background:var(--billable-wash);color:var(--billable)} .chip.exported .cdot{background:var(--billable)}
.chip.locked{background:var(--locked-wash);color:var(--locked)}

.grid{display:grid;gap:16px}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.rail{display:none}.g-3,.g-2,.g-4{grid-template-columns:1fr}}

.stat{padding:16px 18px}
.stat .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stat .val{font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.stat .val .u{font-size:14px;color:var(--ink-3);font-weight:500;margin-left:3px}
.stat .sub{font-size:12px;color:var(--ink-2);margin-top:4px}

/* ---- table / ledger ---- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)
}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.void td{color:var(--ink-3)}
.tbl tr.void .primary-cell{text-decoration:line-through;text-decoration-color:var(--void)}
.tbl tr.locked-row{background:linear-gradient(90deg,rgba(91,107,118,.045),transparent 40%)}
.cell-title{font-weight:500;color:var(--ink)}
.cell-meta{color:var(--ink-3);font-size:12px;margin-top:2px}
.time-cell{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);white-space:nowrap}
.time-cell b{color:var(--ink);font-weight:500}
.tape{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

.rowbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;color:var(--ink-2)}
.rowbtn:hover{background:var(--surface-2);color:var(--ink)}
.rowbtn.lock{border-style:dashed;cursor:default;color:var(--locked)}
.rowbtn.lock:hover{background:none}

.expand td{background:var(--surface-2);padding:0}
.expand-inner{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.note-body{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink-2);white-space:pre-wrap;line-height:1.55}
.kv{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px}
.kv div{font-size:12px}
.kv .k{color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.kv .v{margin-top:2px;font-weight:500}

/* ---- toolbar / filters ---- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--ink);color:#fff}
.seg.wrap{flex-wrap:wrap;display:flex}
.rpt-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rpt-lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);width:62px;flex:0 0 62px;font-weight:600}
tr.rpt-total td{border-top:2px solid var(--ink-3)!important;font-weight:600;background:var(--surface-2)}
tr.rpt-total td:first-child{color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.selcell{width:38px;text-align:center;padding-left:14px}
.selcell input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;vertical-align:middle}
.tbl tr.sel-row{background:var(--brand-wash)}
.selbar{display:flex;align-items:center;gap:10px;background:var(--void-wash);border:1px solid #e6cccc;color:var(--void);padding:9px 14px;border-radius:10px;margin-bottom:12px;font-size:13px}
.selbar.ok{background:var(--brand-wash);border-color:#bfe0da;color:var(--brand)}
.selbar svg{width:17px;height:17px;flex:0 0 auto}
.chip.submitted{background:#e7edfb;color:#3457b2} .chip.submitted .cdot{background:#3457b2}
.edit-time{margin-top:14px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2)}
.edit-time input[type=datetime-local]{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.demo-role{transform:scale(.92)} .demo-role button{padding:3px 9px;font-size:11.5px}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover{background:var(--surface-2)}
.role-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.role-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.role-card.collapsed .role-card-head{margin-bottom:0}
.role-card-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0;user-select:none}
.role-caret{color:var(--ink-3);font-size:10px;width:11px;flex:none;transition:transform .12s;transform:rotate(0deg)}
.role-card.open .role-caret{transform:rotate(90deg)}
.perm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.perm-col{display:flex;flex-direction:column;gap:5px}
.perm-group{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.perm{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:4px 7px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.perm:hover{background:var(--surface-2)}
.perm.on{background:var(--brand-wash);color:var(--ink);border-color:#cfe6e1}
.perm input{accent-color:var(--brand);width:14px;height:14px;flex:0 0 auto}
.role-presets{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
@media(max-width:900px){.perm-grid{grid-template-columns:1fr}}
select,input[type=text],input[type=number],input[type=date]{
  font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;outline:none;
}
select:focus,input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-wash)}
.search{position:relative}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.search input{padding-left:31px;min-width:230px}
.spacer{flex:1}

/* ---- classify dropdown ---- */
.classify{position:relative;display:inline-block}
.classify-btn{display:inline-flex;align-items:center;gap:6px}
.classify-btn .caret{width:12px;height:12px;opacity:.6}
.menu{
  position:absolute;z-index:60;top:calc(100% + 5px);left:0;min-width:230px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px -10px rgba(21,32,41,.3);padding:6px;display:none
}
.menu.open{display:block}
.menu-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;border:0;background:none;width:100%;text-align:left;font-size:13px}
.menu-item:hover{background:var(--surface-2)}
.menu-item .mt{flex:1}
.menu-item .rate{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}

/* ---- toggle ---- */
.toggle{position:relative;width:38px;height:22px;border-radius:20px;background:#d5dbd6;border:0;transition:.15s;flex:0 0 auto}
.toggle.on{background:var(--billable)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on::after{left:18px}

/* ---- seal ---- */
.seal-stamp{
  display:inline-flex;align-items:center;gap:8px;color:var(--seal);border:1.5px solid var(--seal);
  border-radius:8px;padding:6px 12px;font-weight:600;font-size:12px;letter-spacing:.02em;
  background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(176,134,47,.05) 6px,rgba(176,134,47,.05) 12px)
}
.seal-stamp svg{width:16px;height:16px}

/* ---- misc ---- */
.money{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.section-gap{height:18px}
.empty{padding:44px;text-align:center;color:var(--ink-3)}
.empty svg{width:34px;height:34px;opacity:.4;margin-bottom:10px}
.bar{height:7px;border-radius:20px;background:var(--line-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand)}
.notice{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:9px;font-size:13px;line-height:1.5}
.notice.warn{background:var(--warn-wash);color:#6b4a0c;border:1px solid #ecdcb6}
.notice.info{background:var(--brand-wash);color:var(--brand-ink);border:1px solid #cfe4e0}
.notice.lock{background:var(--locked-wash);color:var(--locked);border:1px solid #d7dee2}
.notice svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}

.setting-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.setting-row:last-child{border-bottom:0}
.setting-row .sl{flex:1}
.setting-row .sl b{font-weight:600;font-size:13.5px}
.setting-row .sl p{margin:3px 0 0;color:var(--ink-3);font-size:12.5px}

/* ---- modal / toast ---- */
.scrim{position:fixed;inset:0;background:rgba(21,32,41,.42);display:none;place-items:center;z-index:100;padding:20px}
.scrim.open{display:grid}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);width:min(520px,100%);overflow:hidden}
.modal-head{padding:18px 20px 0}
.modal-head h3{margin:0 0 4px;font-size:17px}
.modal-head p{margin:0;color:var(--ink-3);font-size:13px}
.modal-body{padding:16px 20px}
.modal-foot{padding:14px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);background:var(--surface-2)}
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;display:flex;align-items:center;gap:10px;animation:tin .2s ease}
.toast .cdot{width:7px;height:7px;border-radius:50%;background:var(--billable)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

.demo-pill{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);background:var(--warn-wash);border:1px solid #ecdcb6;border-radius:20px;padding:5px 10px}
.demo-pill b{color:#6b4a0c}
.mini{font-size:11px;color:var(--ink-3)}
.right{text-align:right}
</style>
</head>

/* ------------ helpers: time, money, periods ------------ */
function iso(d){return new Date(d).toISOString()}
function hoursBetween(a,b){ return Math.max(0,(new Date(b)-new Date(a))/3600000) }
function fmtHours(h){ return h.toFixed(2) }
function fmtMoney(n){ return CURRENCY + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) }
function fmtTime(d){ return new Date(d).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}) }
function fmtDate(d){ return new Date(d).toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}) }
function fmtDateShort(d){ return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}) }
function fmtStamp(d){ return new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}) }
function tech(id){ return state.techs.find(t=>t.id===id) }
function client(id){ return state.clients.find(c=>c.id===id) }
function atype(id){ return state.types.find(a=>a.id===id) }

/* Period math — start/end range + human label + stable key, per cycle */
function periodFor(cycle, dateStr){
  const d = new Date(dateStr); let start, end, label, key;
  if(cycle==='weekly'){
    const day=(d.getDay()+6)%7; start=new Date(d); start.setDate(d.getDate()-day); start.setHours(0,0,0,0);
    end=new Date(start); end.setDate(start.getDate()+7);
    key='W'+start.toISOString().slice(0,10);
    label='Week of '+fmtDateShort(start);
  } else if(cycle==='biweekly'){
    const anchor=new Date('2026-01-05T00:00:00'); // a Monday
    const diff=Math.floor((d-anchor)/(86400000*14));
    start=new Date(anchor); start.setDate(anchor.getDate()+diff*14);
    end=new Date(start); end.setDate(start.getDate()+14);
    key='B'+start.toISOString().slice(0,10);
    label=fmtDateShort(start)+' – '+fmtDateShort(new Date(end-86400000));
  } else { // monthly
    start=new Date(d.getFullYear(),d.getMonth(),1);
    end=new Date(d.getFullYear(),d.getMonth()+1,1);
    key='M'+start.toISOString().slice(0,7);
    label=start.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  }
  return {start,end,label,key};
}
function entryPeriod(e){ const c=client(e.clientId); return periodFor(c.cycle, e.startedAt) }
function periodState(clientId, key){
  const k=clientId+'|'+key;
  if(!state.periods[k]) state.periods[k]={status:'open',approvedAt:null,approvedBy:null,exportedAt:null,exportRef:null};
  return state.periods[k];
}
function isLocked(e){ const p=entryPeriod(e); return periodState(e.clientId,p.key).status!=='open' }

/* pricing resolution:
   billable = per-client-type override ?? type.billable (sentinel never billable)
   rate     = per-client-type rate ?? client.rateOverride ?? type.rate
   EFFECTIVE-DATED: every rate holder may carry a history array
   [{from:'YYYY-MM-DD', rate:N}, ...]; an entry prices against the rate in
   force at its startedAt, so changing a rate NEVER reprices history. */
function effRate(current, hist, atMs){
  if(!hist || !hist.length) return current;
  const day = new Date(atMs).toISOString().slice(0,10);
  let best = null;
  hist.forEach(hh=>{ if(hh.from<=day && (!best || hh.from>best.from)) best = hh; });
  return best ? best.rate : (hist[0].preHistory!=null ? hist[0].preHistory : current);
}
function projFor(e){ return (state.projects && state.projects[e.zTicket]) || null; }
function projTaskFor(e){ const p=projFor(e); if(!p||!e.zTask) return null; return p.tasks.find(x=>x.id===e.zTask.id)||null; }
function priced(e){
  const t=atype(e.typeId), c=client(e.clientId);
  const h=e.hours;
  /* project overlay: once Docket approves a project, its tasks price the time.
     Flat tasks: hours are covered by the fixed fee (amount 0 here; the fee
     itself bills as a flat line on the period/export). Hourly tasks: the
     task's override rate wins; empty = standard pricing below. */
  const pj = projFor(e);
  if(pj && pj.pmode==='flat'){
    return {h, billable:false, rate:0, amount:0, unclassified:false, projFlat:true};
  }
  const pt = projTaskFor(e);
  if(pt && pt.mode==='flat'){
    return {h, billable:false, rate:0, amount:0, unclassified:false, projFlat:true};
  }
  const ov = (c.rates && c.rates[e.typeId]) || null;
  const billable = t.sentinel ? false : (ov && ov.billable!=null ? !!ov.billable : !!t.billable);
  let rate = 0;
  if(billable){
    if(pt && pt.mode==='hourly' && pt.rate!=null) rate = pt.rate;
    else if(ov && ov.rate!=null)       rate = effRate(ov.rate, ov.rateHist, e.startedAt);
    else if(c.rateOverride!=null)      rate = effRate(c.rateOverride, c.rateOverrideHist, e.startedAt);
    else                               rate = effRate(t.rate, t.rateHist, e.startedAt);
  }
  const amount = e.status==='void' ? 0 : (billable ? h*rate : 0);
  return {h,billable,rate,amount,unclassified:!!(t&&t.sentinel)};
}
/* flat project fees landing in a client's billing period (period of approval) */
function projFlatLines(clientId, perKey){
  if(!state.projects) return [];
  const out=[];
  Object.values(state.projects).forEach(p=>{
    if(p.clientId!==clientId) return;
    const c=client(clientId); if(!c) return;
    if(periodFor(c.cycle, p.approvedAt).key!==perKey) return;
    if(p.pmode==='flat'){
      if(p.projectFlat>0){ const hrs=p.tasks.reduce((a,x)=>a+(x.hours||0),0); out.push({ project:p.title, ticket:p.ticket, label:'Project flat rate', amount:p.projectFlat, hours:hrs }); }
    } else {
      p.tasks.forEach(x=>{ if(x.mode==='flat' && x.flat>0) out.push({ project:p.title, ticket:p.ticket, label:x.label, amount:x.flat, hours:x.hours||0 }); });
    }
  });
  return out;
}
function projFlatTotal(clientId, perKey){ return projFlatLines(clientId, perKey).reduce((a,l)=>a+l.amount,0); }

/* ------------ retainers / block-hour agreements ------------ */
function retainersOn(){ return !!(state.settings && state.settings.retainers && state.settings.retainers.enabled); }
function retainerFor(c){ return (retainersOn() && c && c.retainer && c.retainer.enabled) ? c.retainer : null; }
function periodBillableHours(clientId, pk){
  return state.entries.filter(e=>e.clientId===clientId && entryPeriod(e).key===pk && e.status!=='void' && priced(e).billable)
    .reduce((s,e)=>s+e.hours, 0);
}
function prevPeriodKey(clientId, pk){
  const keys = [...new Set(state.entries.filter(e=>e.clientId===clientId).map(e=>entryPeriod(e).key))].sort();
  const i = keys.indexOf(pk);
  return i>0 ? keys[i-1] : null;
}
function retainerMath(clientId, pk){
  const c = client(clientId); const r = retainerFor(c);
  if(!r) return null;
  let rollover = 0;
  const prev = prevPeriodKey(clientId, pk);
  if(prev && r.rolloverCap>0){
    const prevUsed = periodBillableHours(clientId, prev);
    rollover = Math.min(Math.max(r.includedHours - prevUsed, 0), r.rolloverCap);
  }
  const included = r.includedHours + rollover;
  const used = periodBillableHours(clientId, pk);
  const covered = Math.min(used, included);
  const overageH = Math.max(used - included, 0);
  /* overage priced at the agreement rate when set, else normal resolution applies per entry —
     for display we quote the agreement rate or the client's default */
  const oRate = r.overageRate!=null ? r.overageRate : (c.rateOverride!=null ? c.rateOverride : 150);
  return { included, base:r.includedHours, rollover, used, covered, overageH, overageAmt:overageH*oRate, oRate };
}

  if(seg){ const keys=['admin','reviewer','technician']; [...seg.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',state.persona===keys[i])); }
}

function render(){
  /* focus-preserving render: a rebuild must not eject the person typing
     (bug #26 — every oninput→render() input lost focus per keystroke, and
     scrollTo(0,0) flung the page to the top on every keystroke too). */
  { const ae=document.activeElement;
    window.__fk_ae=(ae&&ae!==document.body)?(ae.id||ae.getAttribute('data-fkey')||null):null;
    window.__fk_sel=(ae&&ae.selectionStart!=null&&/^(text|search|number|email|tel|url|password)$/.test(ae.type||''))?[ae.selectionStart,ae.selectionEnd]:(ae&&ae.tagName==='TEXTAREA'?[ae.selectionStart,ae.selectionEnd]:null); }
  if(!canView(state.view)) state.view='dashboard';
  renderNav();
  document.getElementById('pgTitle').textContent=pgTitle();
  document.getElementById('pgSub').innerHTML=PAGES[state.view].s();
  const c=document.getElementById('content');
  c.innerHTML = ({
    dashboard:viewDashboard, timesheets:viewTimesheets, approvals:viewApprovals, clients:viewClients, client:viewClient,
    types:viewTypes, periods:viewPeriods, reports:viewReports, export:viewExport, audit:viewAudit, directory:viewDirectory, settings:viewSettings
  })[state.view]();
  const __ae=window.__fk_ae, __sel=window.__fk_sel;
  if(__ae){ const el=document.getElementById(__ae)||document.querySelector('[data-fkey="'+__ae+'"]');
    if(el){ el.focus();
      if(__sel&&el.setSelectionRange){ try{ el.setSelectionRange(__sel[0],__sel[1]); }catch(e){} } } }
  if(window.__fk_view!==state.view){ window.__fk_view=state.view; window.scrollTo(0,0); }
}

/* helper: chips */
function statusChip(e){
  if(e.status==='void') return `<span class="chip void"><span class="cdot"></span>Voided</span>`;
  if(isLocked(e)) return `<span class="chip approved"><span class="cdot"></span>Locked</span>`;
  if(e.tsApproved) return `<span class="chip approved"><span class="cdot"></span>Approved</span>`;
  if(e.submitted) return `<span class="chip submitted"><span class="cdot"></span>Submitted</span>`;
  return `<span class="chip pending"><span class="cdot"></span>Pending</span>`;
}
function typeChip(e){
  const t=atype(e.typeId);
  if(t.sentinel) return `<span class="chip unclassified"><span class="cdot"></span>Unclassified</span>`;
  if(t.billable) return `<span class="chip billable"><span class="cdot"></span>Billable</span>`;
  return `<span class="chip nonbill"><span class="cdot"></span>Non-billable</span>`;
}

/* ===================== DASHBOARD ===================== */
function viewDashboard(){
  if(!isAdmin()) return viewDashboardTech();
  const live = state.entries.filter(e=>e.status!=='void');
  // current-period figures: entries whose period is still open
  const openEntries = live.filter(e=>!isLocked(e));
  let billH=0, nonbillH=0, amt=0, unclass=0;
  openEntries.forEach(e=>{ const p=priced(e); if(p.unclassified) unclass++; billH+=p.billable?p.h:0; nonbillH+=p.billable?0:p.h; amt+=p.amount; });
  const totalH=billH+nonbillH;

  // group current open work by client
  const byClient={};
  openEntries.forEach(e=>{ (byClient[e.clientId]=byClient[e.clientId]||[]).push(e); });
  const clientCards = Object.keys(byClient).map(cid=>{
    const c=client(cid), es=byClient[cid]; const per=periodFor(c.cycle, es[0].startedAt);
    let h=0,a=0,u=0; es.forEach(e=>{const p=priced(e); h+=p.h; a+=p.amount; if(p.unclassified)u++;});
    return {c,per,h,a,u,n:es.length};
  }).sort((x,y)=>y.a-x.a);

  return `
  <div class="grid g-4">
    <div class="card stat"><div class="lab">Unbilled this cycle</div><div class="val money">${fmtMoney(amt)}</div><div class="sub">across ${clientCards.length} clients</div></div>
    <div class="card stat"><div class="lab">Billable hours</div><div class="val tape">${fmtHours(billH)}<span class="u">h</span></div><div class="sub">${fmtHours(nonbillH)} h non-billable</div></div>
    <div class="card stat"><div class="lab">Entries pending</div><div class="val tape">${openEntries.length}</div><div class="sub">${totalH.toFixed(2)} h logged</div></div>
    <div class="card stat"><div class="lab">Needs classifying</div><div class="val tape" style="color:${unclass?'var(--warn)':'var(--ink)'}">${unclass}</div><div class="sub">${unclass?'blocks period close':'all classified'}</div></div>
  </div>

  ${unclass>0?`<div class="section-gap"></div><div class="notice warn">${icon(IC.warn)}<div><b>${unclass} ${unclass===1?'entry':'entries'} still Unclassified.</b> A billing period can\u2019t be approved until every entry in it has an activity type. Classify them on the <a href="#" onclick="go('timesheets');return false" style="color:inherit;text-decoration:underline">Timesheets</a> page.</div></div>`:''}

  <div class="section-gap"></div>
  <div class="card">
    <div class="card-head"><h3>Current period by client</h3><span class="hint">each client bills on its own cycle</span></div>
    <table class="tbl">
      <thead><tr><th>Client</th><th>Cycle · period</th><th>Entries</th><th class="num">Hours</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody>
        ${clientCards.map(x=>`
          <tr>
            <td><div class="cell-title">${esc(x.c.name)}</div><div class="cell-meta">org #${x.c.zorg} · shared with Docket</div></td>
            <td><span class="chip nonbill" style="text-transform:capitalize">${x.c.cycle}</span> <span class="mini">${x.per.label}</span></td>
            <td>${x.n}${x.u?` · <span style="color:var(--warn)">${x.u} unclassified</span>`:''}</td>
            <td class="num">${fmtHours(x.h)}</td>
            <td class="num" style="font-weight:600">${fmtMoney(x.a)}</td>
            <td class="right"><button class="btn sm" onclick="go('periods')">Review</button></td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* technician's personal dashboard — their own time, no billing figures */
function viewDashboardTech(){
  const mine = scopedEntries().filter(e=>e.status!=='void');
  const open = mine.filter(e=>!isLocked(e));
  let totalH=0, unclass=0, unsub=0, submitted=0, lockedH=0;
  mine.forEach(e=>{ if(!isLocked(e)) totalH+=e.hours; else lockedH+=e.hours; });
  open.forEach(e=>{ if(atype(e.typeId).sentinel) unclass++; if(e.submitted) submitted++; else if(!atype(e.typeId).sentinel) unsub++; });
  const toClassify = open.filter(e=>atype(e.typeId).sentinel);
  const toSubmit   = open.filter(e=>!e.submitted && !atype(e.typeId).sentinel);
  const money = canSeeMoney();

  const recent = mine.slice().sort((a,b)=>b.startedAt-a.startedAt).slice(0,8);
  return `
  <div class="grid g-4">
    <div class="card stat"><div class="lab">My hours this cycle</div><div class="val tape">${fmtHours(totalH)}<span class="u">h</span></div><div class="sub">${fmtHours(lockedH)} h already locked</div></div>
    <div class="card stat"><div class="lab">Needs a type</div><div class="val tape" style="color:${unclass?'var(--warn)':'var(--ink)'}">${unclass}</div><div class="sub">${unclass?'classify before submitting':'all classified'}</div></div>
    <div class="card stat"><div class="lab">Ready to submit</div><div class="val tape" style="color:${unsub?'var(--brand)':'var(--ink)'}">${unsub}</div><div class="sub">classified, not yet sent</div></div>
    <div class="card stat"><div class="lab">Submitted</div><div class="val tape">${submitted}</div><div class="sub">awaiting review</div></div>
  </div>

  ${(()=>{ const ret=open.filter(e=>!e.submitted&&e.returnedBy);
    if(!ret.length) return '';
    const why=[...new Set(ret.map(e=>e.returnReason).filter(Boolean))];
    return `<div class="section-gap"></div><div class="notice warn">${icon(IC.warn)}<div><b>${ret.length} ${ret.length===1?'entry was':'entries were'} returned by ${esc(ret[0].returnedBy)}</b>${why.length?` — “${esc(why[0])}”`:''}. Review ${ret.length===1?'it':'them'} on <a href="#" onclick="go('timesheets');return false" style="color:inherit;text-decoration:underline">My Timesheets</a> (marked <b>returned</b>), fix, and resubmit.</div></div>`; })()}
  ${unclass>0?`<div class="section-gap"></div><div class="notice warn">${icon(IC.warn)}<div><b>${unclass} ${unclass===1?'entry needs':'entries need'} an activity type</b> before ${unclass===1?'it':'they'} can be submitted. Set ${unclass===1?'it':'them'} on <a href="#" onclick="go('timesheets');return false" style="color:inherit;text-decoration:underline">My Timesheets</a>.</div></div>`:''}
  ${(unclass===0&&unsub>0)?`<div class="section-gap"></div><div class="notice info">${icon(IC.check)}<div><b>${unsub} ${unsub===1?'entry is':'entries are'} classified and ready to submit.</b> Open <a href="#" onclick="go('timesheets');return false" style="color:inherit;text-decoration:underline">My Timesheets</a>, tick them, and choose <b>Submit for review</b>.</div></div>`:''}

  <div class="section-gap"></div>
  <div class="card">
    <div class="card-head"><h3>My recent time</h3><span class="hint">newest first</span></div>
    <table class="tbl">
      <thead><tr><th>Ticket / client</th><th>Activity</th><th class="num">Hours</th><th>Status</th></tr></thead>
      <tbody>
        ${recent.map(e=>`<tr>
          <td><div class="cell-title">${esc(e.ticketTitle)}</div><div class="cell-meta">${esc(client(e.clientId).name)} · #${e.zTicket} · ${fmtDate(e.startedAt)}</div></td>
          <td>${atype(e.typeId).sentinel?'<span class="chip unclassified" style="padding:1px 8px"><span class="cdot"></span>Unclassified</span>':esc(atype(e.typeId).name)}</td>
          <td class="num" style="font-weight:600">${fmtHours(e.hours)}</td>
          <td>${statusChip(e)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}
state.tf={client:'all',tech:'all',status:'all',type:'all',q:'',from:'',to:'',expanded:null,sel:{},_vis:[]};
state.rpt={
  group:'client', from:'2026-06-01', to:'2026-07-31',
  client:'all', tech:'all', type:'all', billable:'all', scope:'all', includeVoid:false,

};
function viewTimesheets(){
  const f=state.tf, admin=isAdmin(), showMoney=canSeeMoney();
  let rows=scopedEntries().slice().sort((a,b)=>b.startedAt-a.startedAt);
  const [tfFrom,tfTo]=_dateRange(f);
  rows=rows.filter(e=>e.startedAt>=tfFrom && e.startedAt<=tfTo);
  if(f.client!=='all') rows=rows.filter(e=>e.clientId===f.client);
  if(admin && f.tech!=='all') rows=rows.filter(e=>e.techId===f.tech);
  if(f.type==='billable')          rows=rows.filter(e=>{const t=atype(e.typeId);return t.billable&&!t.sentinel});
  else if(f.type==='nonbill')      rows=rows.filter(e=>{const t=atype(e.typeId);return !t.billable&&!t.sentinel});
  else if(f.type==='unclassified') rows=rows.filter(e=>atype(e.typeId).sentinel);
  else if(f.type!=='all')          rows=rows.filter(e=>e.typeId===f.type);
  if(f.status!=='all'){
    rows=rows.filter(e=> f.status==='void'?e.status==='void'
      : f.status==='locked'?(isLocked(e)&&e.status!=='void')
      : f.status==='approved'?(e.tsApproved&&!isLocked(e)&&e.status!=='void')
      : f.status==='submitted'?(e.submitted&&!e.tsApproved&&!isLocked(e)&&e.status!=='void')
      : (e.status==='pending'&&!isLocked(e)&&!e.submitted));
  }
  if(f.q){ const q=f.q.toLowerCase(); rows=rows.filter(e=> (e.ticketTitle+e.content+client(e.clientId).name+tech(e.techId).name).toLowerCase().includes(q)); }

  let sumH=0,sumA=0; rows.forEach(e=>{const p=priced(e); if(e.status!=='void'){sumH+=p.h; sumA+=p.amount;}});

  const opt=(v,l,cur)=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`;
  const statuses = admin ? ['all','pending','submitted','approved','locked','void'] : ['all','pending','submitted','approved','locked'];
  const anyFilter = f.from||f.to||f.client!=='all'||(admin&&f.tech!=='all')||f.type!=='all'||f.status!=='all'||f.q;
  const typeSel=`<select onchange="setTF('type',this.value)">${opt('all','All types',f.type)}${opt('billable','Billable',f.type)}${opt('nonbill','Non-billable',f.type)}${opt('unclassified','Unclassified',f.type)}${state.types.filter(t=>!t.sentinel).map(t=>opt(t.id,t.name,f.type)).join('')}</select>`;
  const toolbar=`
  <div class="card"><div class="card-pad" style="display:flex;flex-direction:column;gap:13px">
    <div class="rpt-line"><span class="rpt-lab">Period</span>

        <button onclick="tsPreset('7d')">Last 7 days</button>
        <button onclick="tsPreset('30d')">Last 30 days</button>
        <button onclick="tsPreset('90d')">Last 90 days</button>

        <button onclick="tsPreset('all')">All time</button>
      </div>
      <label class="mini" style="display:flex;align-items:center;gap:6px">from <input type="date" value="${f.from||''}" onchange="setTF('from',this.value)"></label>
      <label class="mini" style="display:flex;align-items:center;gap:6px">to <input type="date" value="${f.to||''}" onchange="setTF('to',this.value)"></label>
    </div>
    <div class="rpt-line"><span class="rpt-lab">Filters</span>
      <div class="search">${icon(IC.search)}<input type="text" placeholder="Search ticket, note, client${admin?', tech':''}…" value="${esc(f.q)}" data-fkey="tf-q" oninput="setTF('q',this.value)"></div>
      <span style="display:inline-block;min-width:180px;vertical-align:middle">${combo('tfClient', [{v:'all',label:'All clients'},...state.clients.map(c=>({v:c.id,label:c.name}))], f.client, function(){ setTF('client', document.getElementById('tfClient').value); }, 'All clients')}</span>
      ${admin?`<select onchange="setTF('tech',this.value)">${opt('all','All techs',f.tech)}${state.techs.map(t=>opt(t.id,t.name,f.tech)).join('')}</select>`:''}
      ${typeSel}
      <div class="seg wrap">${statuses.map(s=>`<button class="${f.status===s?'on':''}" onclick="setTF('status','${s}')">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div>
      ${anyFilter?`<button class="btn sm ghost" onclick="tsClear()">Clear</button>`:''}
    </div>
    <div class="rpt-line"><span class="rpt-lab">Showing</span><div class="mini">${rows.length} entr${rows.length===1?'y':'ies'} · <span class="tape">${fmtHours(sumH)}</span> h${showMoney?` · <span class="tape" style="font-weight:600;color:var(--ink)">${fmtMoney(sumA)}</span>`:''}</div></div>
  </div></div>`;

  const hint = admin ? '' : `<div class="notice info" style="margin:14px 0">${icon(IC.sheet)}<div>This is <b>your</b> time only. Classify each entry, then tick the ones you\u2019ve finished and <b>Submit for review</b> — your timesheet administrator approves and bills from there. Once submitted or approved, an entry locks so the record stays accurate.</div></div>`;

  if(rows.length===0){ f._vis=[]; return toolbar+hint+`<div class="section-gap"></div><div class="card"><div class="empty">${icon(IC.sheet)}<div>No entries match these filters.</div></div></div>`; }

  // checkbox acts on any live (non-void, non-deleted) row; which actions are
  // offered depends on the current persona's permissions.
  const eligible = rows.filter(e=> e.status!=='void' && !e.zDeleted);
  f._vis = eligible.map(e=>e.id);
  Object.keys(f.sel).forEach(id=>{ if(!f._vis.includes(id)) delete f.sel[id]; });
  const selCount = Object.keys(f.sel).length;
  const allChecked = eligible.length>0 && eligible.every(e=>f.sel[e.id]);

  let selBar='';
  if(selCount){
    const sel=Object.keys(f.sel).map(id=>state.entries.find(e=>e.id===id)).filter(Boolean);

  const body = rows.map(e=>{

          <div class="cell-title">${esc(e.ticketTitle)}</div>
          <div class="cell-meta">${esc(c.name)} · #${e.zTicket}${e.zTask?' · <span title="Project task">'+esc(e.zTask.label)+'</span>':''}${admin?' · '+esc(t.name):''}${(!e.submitted&&e.returnedBy)?' · <span style="color:var(--warn);font-weight:600">returned</span>':''}${e.zDeleted?' · <span style="color:var(--void)">removed in Docket</span>':''}</div>
        </td>
        <td>${classifyControl(e)}</td>
        <td>
          <div class="time-cell"><b>${fmtTime(start)}</b> → <b>${fmtTime(end)}</b></div>
          <div class="cell-meta">${fmtDate(start)}</div>
        </td>
        <td class="num" style="font-weight:600">${fmtHours(p.h)}</td>
        ${showMoney?`<td class="num">${p.billable?fmtMoney(p.amount):'<span class="muted">—</span>'}</td>`:''}
        <td>${statusChip(e)}</td>
        <td class="right"><button class="rowbtn" onclick="toggleExpand('${e.id}')">${state.tf.expanded===e.id?'Hide':'Open'}</button></td>
      </tr>`;
    if(state.tf.expanded!==e.id) return main;
    const exp=`
      <tr class="expand"><td colspan="${colCount}"><div class="expand-inner">
        <div class="note-body">${esc(e.content)}</div>
        <div class="kv">
          <div><div class="k">Client</div><div class="v">${esc(c.name)}</div></div>
          <div><div class="k">Technician</div><div class="v">${esc(t.name)}</div></div>
          <div><div class="k">Activity</div><div class="v">${esc(atype(e.typeId).name)}</div></div>
          ${showMoney?`<div><div class="k">Rate</div><div class="v tape">${p.billable?fmtMoney(p.rate)+'/h':'—'}</div></div>`:''}
          <div><div class="k">Start</div><div class="v tape">${fmtStamp(e.startedAt)}</div></div>
          <div><div class="k">End</div><div class="v tape">${fmtStamp(e.endedAt)}</div></div>
          <div><div class="k">Docket</div><div class="v tape">entry #${e.zEntryId}${e.zArticleId?` · note #${e.zArticleId}`:''}</div>
            <button class="btn sm ghost" style="margin-top:6px" onclick="openInDocket(${e.zTicket})">Open ticket #${e.zTicket} in Docket ↗</button></div>
          <div><div class="k">Submitted</div><div class="v">${e.submitted?fmtStamp(e.submittedAt||e.createdAt):'<span class="muted">not yet</span>'}</div></div>
          <div><div class="k">Timesheet approval</div><div class="v">${e.tsApproved?fmtStamp(e.tsApprovedAt)+(e.tsApprovedBy?' · '+esc(e.tsApprovedBy):''):'<span class="muted">not yet</span>'}</div></div>
        </div>
        ${editable?`<div class="edit-time">
          <div class="mini" style="font-weight:600;margin-bottom:2px">Adjust time &amp; date</div>
          <div class="mini muted" style="margin-bottom:8px">Changes re-price this entry and, once saved, are written straight to the shared time record Docket reads.</div>

        ${(!locked&&!e.submitted&&e.returnedBy)?`<div style="margin-top:12px"><div class="notice warn">${icon(IC.warn)}<div><b>Returned by ${esc(e.returnedBy)}</b> ${e.returnedAt?fmtStamp(e.returnedAt):''}${e.returnReason?` — “${esc(e.returnReason)}”`:' — no note given'}. Fix it up and submit again.</div></div></div>`:''}
        ${(!locked&&e.tsApproved)?`<div style="margin-top:12px"><div class="notice info">${icon(IC.seal)}<div>Timesheet approved${e.tsApprovedBy?' by '+esc(e.tsApprovedBy):''} — this entry is frozen until the billing period locks.${admin?' Revoke on the Approvals page to reopen it.':''}</div></div></div>`

/* ===================== TIMESHEET APPROVALS =====================
   A "timesheet" is the bundle of one technician's live entries for one
   client in one billing period. Techs submit entries; a manager approves
   the timesheet here, which freezes those entries (revocable until the
   period itself is approved & locked). The Billing Periods page then
   reports manager approval progress instead of raw tech submission. */
function buildTimesheets(){
  const m={};
  state.entries.forEach(e=>{
    if(e.status==='void') return;
    const per=entryPeriod(e), k=e.techId+'|'+e.clientId+'|'+per.key;
    const g=m[k]||(m[k]={key:k,techId:e.techId,clientId:e.clientId,per,es:[]});
    g.es.push(e);
  });
  return Object.values(m).map(g=>{
    let h=0,amt=0,sub=0,app=0,uncl=0;
    g.es.forEach(e=>{ const p=priced(e); h+=p.h; amt+=p.amount;
      if(p.unclassified) uncl++;
      if(e.submitted||isLocked(e)) sub++;
      if(e.tsApproved||isLocked(e)) app++; });
    g.h=h; g.amt=amt; g.sub=sub; g.app=app; g.uncl=uncl; g.n=g.es.length;
    g.locked = periodState(g.clientId,g.per.key).status!=='open';
    g.status = g.locked ? 'locked'
             : g.app===g.n ? 'approved'
             : g.sub===g.n ? 'awaiting'
             : g.sub>0 ? 'partial' : 'open';
    return g;
  }).sort((a,b)=> b.per.start-a.per.start
      || client(a.clientId).name.localeCompare(client(b.clientId).name)
      || tech(a.techId).name.localeCompare(tech(b.techId).name));
}
function tsEntries(techId,clientId,perKey){
  return state.entries.filter(e=> e.status!=='void' && e.techId===techId &&
    e.clientId===clientId && entryPeriod(e).key===perKey);
}
function tsApprove(techId,clientId,perKey){
  if(!can('approve')) return;
  const es=tsEntries(techId,clientId,perKey);
  const open=es.filter(e=>!isLocked(e));
  if(open.some(e=>atype(e.typeId).sentinel)){ toast('Classify every entry before approving'); return; }
  if(open.some(e=>!e.submitted)){ toast('Not everything is submitted yet \u2014 wait for the technician or return the sheet'); return; }
  const todo=open.filter(e=>!e.tsApproved);
  if(!todo.length){ toast('Already approved'); return; }
  let h=0; todo.forEach(e=>{ e.tsApproved=true; e.tsApprovedAt=Date.now(); e.tsApprovedBy=myName(); h+=e.hours; });
  const per=periodFor(client(clientId).cycle, todo[0].startedAt);
  log('Timesheet approved', `${esc(tech(techId).name)} \u00b7 ${esc(client(clientId).name)} \u00b7 ${per.label} \u2014 ${todo.length} entr${todo.length===1?'y':'ies'}, ${fmtHours(h)} h \u2014 approved by ${esc(myName())}`);
  toast(`Timesheet approved \u2014 ${todo.length} entr${todo.length===1?'y':'ies'} locked from edits`);
  render();
}
function tsRevoke(techId,clientId,perKey){
  if(!can('approve')) return;
  const todo=tsEntries(techId,clientId,perKey).filter(e=>e.tsApproved && !isLocked(e));
  if(!todo.length){ toast('Nothing to revoke \u2014 the period may already be locked'); return; }
  todo.forEach(e=>{ e.tsApproved=false; e.tsApprovedAt=null; e.tsApprovedBy=null; });
  const per=periodFor(client(clientId).cycle, todo[0].startedAt);
  log('Timesheet approval revoked', `${esc(tech(techId).name)} \u00b7 ${esc(client(clientId).name)} \u00b7 ${per.label} \u2014 ${todo.length} entr${todo.length===1?'y':'ies'} back to Submitted \u2014 by ${esc(myName())}`);
  toast('Approval revoked \u2014 entries are Submitted again');
  render();
}
function tsReturn(techId,clientId,perKey){
  if(!can('approve')) return;
  const todo=tsEntries(techId,clientId,perKey).filter(e=>e.submitted && !e.tsApproved && !isLocked(e));
  if(!todo.length){ toast('Nothing to return'); return; }
  const why=(prompt('Reason to return this timesheet to the technician (optional)')||'').trim();
  const at=Date.now();
  todo.forEach(e=>{ e.submitted=false; e.submittedAt=null;
    e.returnedBy=myName(); e.returnedAt=at; e.returnReason=why||null; });
  const per=periodFor(client(clientId).cycle, todo[0].startedAt);
  log('Timesheet returned', `${esc(tech(techId).name)} \u00b7 ${esc(client(clientId).name)} \u00b7 ${per.label} \u2014 ${todo.length} entr${todo.length===1?'y':'ies'} back to the technician${why?` \u2014 \u201c${esc(why)}\u201d`:''} \u2014 by ${esc(myName())}`);
  toast(`Timesheet returned to ${tech(techId).name}${why?' with a note':''}`);
  render();
}
