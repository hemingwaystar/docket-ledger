      ? `<span class="chip submitted" style="padding:1px 8px"><span class="cdot"></span>${(c.access.groups||[]).length} group${(c.access.groups||[]).length===1?'':'s'}</span>`
      : `<span class="chip submitted" style="padding:1px 8px"><span class="cdot"></span>${(c.access.techs||[]).length} tech${(c.access.techs||[]).length===1?'':'s'}</span>`;
    return `<tr class="clickable" onclick="openClient('${c.id}')">
      <td><div class="cell-title">${esc(c.name)}${c.archivedInDocket?' <span class="chip void" style="padding:1px 8px;margin-left:6px"><span class="cdot"></span>archived in Docket</span>':''}</div><div class="cell-meta">org #${c.zorg} · shared with Docket</div></td>
      <td><span class="chip nonbill" style="text-transform:capitalize;padding:1px 8px"><span class="cdot"></span>${c.cycle}</span></td>
      <td>${acc}</td>
      <td class="num">${es.length} · ${fmtHours(h)} h</td>
      ${showMoney?`<td class="num" style="font-weight:600">${fmtMoney(a)}</td>`:''}
      <td class="right"><button class="rowbtn" onclick="event.stopPropagation();openClient('${c.id}')">Open →</button></td>
    </tr>`;
  }).join('');
  return `
  <div class="notice info" style="margin-bottom:16px">${icon(IC.client)}<div>Clients live in the shared directory — Docket reads and writes the same records. Click one to configure its <b>per-activity-type billing</b>, browse its <b>ticket breakdown</b>, and set <b>which technicians can access it</b>.${hidden>0?` <span class="muted">${hidden} client${hidden===1?'':'s'} hidden — you don\u2019t have access.</span>`:''}</div></div>
  <div class="card"><table class="tbl">
    <thead><tr><th>Client</th><th>Cycle</th><th>Access</th><th class="num">Open work</th>${showMoney?'<th class="num">Amount</th>':''}<th></th></tr></thead>
    <tbody>${rows||`<tr><td colspan="6"><div class="empty">${icon(IC.client)}<div>No clients you can access.</div></div></td></tr>`}</tbody></table></div>`;
}

/* ===================== CLIENT DETAIL ===================== */
function setCF(k,v){ state.cf[k]=v; render(); }
function viewClient(){
  const c=client(state.clientId);
  if(!c) return `<div class="card"><div class="empty">${icon(IC.client)}<div>Client not found. <a href="#" onclick="go('clients');return false">Back to clients</a>.</div></div></div>`;
  if(!canAccessClient(c)) return `<div class="card"><div class="empty">${icon(IC.lock)}<div>You don\u2019t have access to this client.</div></div></div>`;
  const manage=can('manage_clients'), showMoney=canSeeMoney(), cf=state.cf||(state.cf={tech:'all',type:'all',status:'all',q:'',from:'',to:''});
  const cycles=['weekly','biweekly','monthly'];
  const back=`<button class="btn sm ghost" onclick="go('clients')">← All clients</button>`;

  /* ---- billing: per-activity-type ---- */
  const typeRows=state.types.filter(t=>!t.sentinel).map(t=>{
    const ov=(c.rates&&c.rates[t.id])||null;
    const effBill = ov&&ov.billable!=null ? !!ov.billable : !!t.billable;
    const effRate = effBill ? (ov&&ov.rate!=null?ov.rate:(c.rateOverride!=null?c.rateOverride:t.rate)) : 0;
    const overridden = !!ov && (ov.rate!=null||ov.billable!=null);
    const src = ov&&ov.rate!=null ? 'client override' : (c.rateOverride!=null&&effBill ? 'client default rate' : 'type rate');
    return `<tr>
      <td><div class="cell-title">${esc(t.name)}</div><div class="cell-meta">${t.note?esc(t.note):'<span class="muted">—</span>'}</div></td>
      <td>${manage
        ? `<div style="display:flex;align-items:center;gap:8px"><button class="toggle ${effBill?'on':''}" onclick="toggleClientTypeBillable('${c.id}','${t.id}')"></button><span class="mini">${effBill?'Billable':'Non-billable'}</span></div>`
        : `<span class="chip ${effBill?'billable':'nonbill'}" style="padding:1px 8px"><span class="cdot"></span>${effBill?'Billable':'Non-billable'}</span>`}</td>
      <td class="num">${!showMoney?'<span class="muted">—</span>':(manage
        ? `<input type="number" min="0" step="5" value="${effBill?effRate:''}" placeholder="${effBill?(c.rateOverride!=null?c.rateOverride:t.rate):'—'}" data-fkey="cr-${c.id}-${t.id}" oninput="setClientTypeRate('${c.id}','${t.id}',this.value)" ${effBill?'':'disabled'} style="width:100px;text-align:right">`
        : (effBill?fmtMoney(effRate)+'/h':'—'))}</td>
      <td class="mini muted">${showMoney?src:''}${overridden&&manage?` · <a href="#" onclick="clearClientTypeOverride('${c.id}','${t.id}');return false" style="color:inherit;text-decoration:underline">reset</a>`:''}</td>
    </tr>`;
  }).join('');

  const billing=`<div class="card">
    ${retainersOn()?`<div class="card-head"><h3>Retainer / block hours</h3><span class="hint">${c.retainer&&c.retainer.enabled?'agreement active':'no agreement'}</span></div>
    <div class="card-pad" style="border-bottom:1px solid var(--line)">
      ${(()=>{ const r=c.retainer||{}; const per=periodFor(c.cycle, new Date());
        const rm = retainerFor(c) ? retainerMath(c.id, per.key) : null;
        return `
        ${manage?`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
          <label class="mini" style="display:inline-flex;gap:6px;align-items:center;text-transform:none;cursor:pointer"><input type="checkbox" ${r.enabled?'checked':''} onchange="retSet('${c.id}','enabled',this.checked,this)" style="width:auto;accent-color:var(--brand)"> agreement active</label>
          <span class="mini muted">included h / cycle</span><input type="number" min="0" step="0.5" value="${r.includedHours??0}" style="width:74px" onchange="retSet('${c.id}','includedHours',this.value,this)" ${r.enabled?'':'disabled'}>
          <span class="mini muted">overage $/h</span><input type="number" min="0" value="${r.overageRate??''}" placeholder="std" style="width:74px" onchange="retSet('${c.id}','overageRate',this.value,this)" ${r.enabled?'':'disabled'}>
          <span class="mini muted">rollover cap h</span><input type="number" min="0" step="0.5" value="${r.rolloverCap??0}" style="width:70px" onchange="retSet('${c.id}','rolloverCap',this.value,this)" ${r.enabled?'':'disabled'}>
        </div>`:''}
        ${rm?`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <div style="flex:1;height:10px;background:#e8edec;border-radius:6px;overflow:hidden"><div style="height:100%;width:${Math.min(100, rm.used/rm.included*100||0)}%;background:${rm.overageH>0?'var(--warn,#b3261e)':'var(--brand)'}"></div></div>
          <span class="tape" style="font-weight:600">${rm.used.toFixed(2)} / ${rm.included.toFixed(2)} h</span>
        </div>
        <div class="mini muted">${rm.base} h included${rm.rollover?` + ${rm.rollover.toFixed(2)} h rolled over`:''} \u00b7 ${rm.covered.toFixed(2)} h covered${rm.overageH>0?` \u00b7 <b style="color:#b3261e">${rm.overageH.toFixed(2)} h overage @ ${fmtMoney(rm.oRate)}/h = ${fmtMoney(rm.overageAmt)}</b>`:' \u00b7 no overage'} \u00b7 this ${c.cycle} period</div>
        ${r.note?`<div class="mini muted" style="margin-top:6px">${esc(r.note)}</div>`:''}`
        : `<div class="mini muted">No block-hour agreement \u2014 all billable time prices at the normal rates.${manage?' Tick \u201cagreement active\u201d to start one.':''}</div>`}`; })()}
    </div>`:''}
    <div class="card-head"><h3>Billing configuration</h3><span class="hint">${manage?'per-activity-type rates for this client':'read-only — needs “Manage client billing & access”'}</span></div>
    <div class="card-pad">
      <div class="grid g-3" style="margin-bottom:16px">
        <div><div class="mini muted">Billing cycle</div>${manage?`<select onchange="setClientCycle('${c.id}',this.value)" style="text-transform:capitalize;margin-top:4px">${cycles.map(cy=>`<option value="${cy}" ${c.cycle===cy?'selected':''}>${cy}</option>`).join('')}</select>`:`<div class="v" style="text-transform:capitalize">${c.cycle}</div>`}</div>
        <div><div class="mini muted">Client default rate (all billable types)</div>${(manage&&showMoney)?`<input type="number" min="0" step="5" placeholder="use type rate" value="${c.rateOverride??''}" data-fkey="crw-${c.id}" oninput="setClientRate('${c.id}',this.value)" style="width:150px;margin-top:4px">`:`<div class="v tape">${showMoney?(c.rateOverride!=null?fmtMoney(c.rateOverride)+'/h':'type rate'):'—'}</div>`}</div>
        <div><div class="mini muted">Org</div><div class="v tape">#${c.zorg}</div></div>
      </div>
      <table class="tbl">
        <thead><tr><th>Activity type</th><th>Billable (this client)</th><th class="num">Rate ($/h)</th><th>Effective from</th></tr></thead>
        <tbody>${typeRows}</tbody></table>
      <div class="mini muted" style="margin-top:10px">Rate resolution: <b>per-type override</b> → <b>client default rate</b> → <b>activity-type rate</b>. Overrides only change <b>open</b> entries; locked periods never re-price.</div>
    </div>
  </div>`;

  /* ---- ticket breakdown & filtering ---- */
  let es=state.entries.filter(e=>e.clientId===c.id);
  if(!can('view_all')) es=es.filter(e=>e.techId===state.demoTechId);
  const [cfFrom,cfTo]=_dateRange(cf);
  es=es.filter(e=>e.startedAt>=cfFrom && e.startedAt<=cfTo);
  if(can('view_all') && cf.tech!=='all') es=es.filter(e=>e.techId===cf.tech);
  if(cf.type==='billable')          es=es.filter(e=>{const t=atype(e.typeId);return t.billable&&!t.sentinel});
  else if(cf.type==='nonbill')      es=es.filter(e=>{const t=atype(e.typeId);return !t.billable&&!t.sentinel});
  else if(cf.type==='unclassified') es=es.filter(e=>atype(e.typeId).sentinel);
  else if(cf.type!=='all')          es=es.filter(e=>e.typeId===cf.type);
  if(cf.status!=='all') es=es.filter(e=> cf.status==='void'?e.status==='void':cf.status==='locked'?(isLocked(e)&&e.status!=='void'):cf.status==='approved'?(e.tsApproved&&!isLocked(e)&&e.status!=='void'):cf.status==='submitted'?(e.submitted&&!e.tsApproved&&!isLocked(e)&&e.status!=='void'):(e.status==='pending'&&!isLocked(e)&&!e.submitted));
  if(cf.q){const q=cf.q.toLowerCase(); es=es.filter(e=>(e.ticketTitle+e.content+tech(e.techId).name).toLowerCase().includes(q));}
  es=es.slice().sort((a,b)=>b.startedAt-a.startedAt);
  // breakdown by activity type
  const byType={}; let tot={h:0,a:0,n:0};
  es.forEach(e=>{const p=priced(e); if(e.status==='void')return; const k=e.typeId; (byType[k]=byType[k]||{h:0,a:0,n:0}); byType[k].h+=p.h; byType[k].a+=p.amount; byType[k].n++; tot.h+=p.h; tot.a+=p.amount; tot.n++;});
  const breakdownRows=Object.keys(byType).map(k=>{const b=byType[k];return `<tr><td>${esc(atype(k).name)}</td><td class="num">${b.n}</td><td class="num">${fmtHours(b.h)}</td>${showMoney?`<td class="num" style="font-weight:600">${fmtMoney(b.a)}</td>`:''}</tr>`;}).join('');
  const opt=(v,l,cur)=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`;
  const cfAny = cf.from||cf.to||(can('view_all')&&cf.tech!=='all')||cf.type!=='all'||cf.status!=='all'||cf.q;
  const filters=`<div class="card" style="margin-bottom:12px"><div class="card-pad" style="display:flex;flex-direction:column;gap:12px">
    <div class="rpt-line"><span class="rpt-lab">Period</span>
      <div class="seg">
        <button onclick="cfPreset('7d')">7 days</button>
        <button onclick="cfPreset('30d')">30 days</button>
        <button onclick="cfPreset('90d')">90 days</button>
        <button onclick="cfPreset('thismonth')">This month</button>
        <button onclick="cfPreset('all')">All time</button>
      </div>
      <label class="mini" style="display:flex;align-items:center;gap:6px">from <input type="date" value="${cf.from||''}" onchange="setCF('from',this.value)"></label>
      <label class="mini" style="display:flex;align-items:center;gap:6px">to <input type="date" value="${cf.to||''}" onchange="setCF('to',this.value)"></label>
    </div>
    <div class="rpt-line"><span class="rpt-lab">Filters</span>
      <div class="search">${icon(IC.search)}<input type="text" placeholder="Search ticket, note${can('view_all')?', tech':''}…" value="${esc(cf.q)}" data-fkey="cf-q" oninput="setCF('q',this.value)"></div>
      ${can('view_all')?`<select onchange="setCF('tech',this.value)">${opt('all','All techs',cf.tech)}${state.techs.map(t=>opt(t.id,t.name,cf.tech)).join('')}</select>`:''}
      <select onchange="setCF('type',this.value)">${opt('all','All types',cf.type)}${opt('billable','Billable',cf.type)}${opt('nonbill','Non-billable',cf.type)}${opt('unclassified','Unclassified',cf.type)}${state.types.filter(t=>!t.sentinel).map(t=>opt(t.id,t.name,cf.type)).join('')}</select>
      <div class="seg wrap">${['all','pending','submitted','approved','locked','void'].map(s=>`<button class="${cf.status===s?'on':''}" onclick="setCF('status','${s}')">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div>
      ${cfAny?`<button class="btn sm ghost" onclick="cfClear()">Clear</button>`:''}
    </div>
    <div class="rpt-line"><span class="rpt-lab">Showing</span><div class="mini">${es.length} entr${es.length===1?'y':'ies'} · <span class="tape">${fmtHours(tot.h)}</span> h${showMoney?` · <span class="tape" style="font-weight:600;color:var(--ink)">${fmtMoney(tot.a)}</span>`:''}</div></div>
  </div></div>`;
  const ticketRows=es.map(e=>{const p=priced(e);return `<tr class="${e.status==='void'?'void':(isLocked(e)?'locked-row':'')}">
    <td><div class="cell-title">${esc(e.ticketTitle)}</div><div class="cell-meta">#${e.zTicket}${can('view_all')?' · '+esc(tech(e.techId).name):''} · ${fmtDate(e.startedAt)}</div></td>
    <td>${atype(e.typeId).sentinel?'<span class="chip unclassified" style="padding:1px 8px"><span class="cdot"></span>Unclassified</span>':esc(atype(e.typeId).name)}</td>
    <td class="num" style="font-weight:600">${fmtHours(p.h)}</td>
    ${showMoney?`<td class="num">${p.billable?fmtMoney(p.amount):'<span class="muted">—</span>'}</td>`:''}
    <td>${statusChip(e)}</td></tr>`;}).join('');
  const breakdown=`<div class="card">
    <div class="card-head"><h3>Ticket breakdown</h3><span class="hint">all of this client's logged time</span></div>
    <div class="card-pad">
      ${breakdownRows?`<table class="tbl" style="margin-bottom:16px"><thead><tr><th>Activity type</th><th class="num">Entries</th><th class="num">Hours</th>${showMoney?'<th class="num">Amount</th>':''}</tr></thead>
        <tbody>${breakdownRows}</tbody>
        <tfoot><tr class="rpt-total"><td>Total</td><td class="num">${tot.n}</td><td class="num">${fmtHours(tot.h)}</td>${showMoney?`<td class="num">${fmtMoney(tot.a)}</td>`:''}</tr></tfoot></table>`:''}
      ${filters}
      <table class="tbl"><thead><tr><th>Ticket</th><th>Activity</th><th class="num">Hours</th>${showMoney?'<th class="num">Amount</th>':''}<th>Status</th></tr></thead>
        <tbody>${ticketRows||`<tr><td colspan="5"><div class="empty" style="padding:20px">${icon(IC.sheet)}<div>No entries match.</div></div></td></tr>`}</tbody></table>
    </div>
  </div>`;

  /* ---- access control ---- */
  const mode = (c.access&&c.access.mode)||'all';
  const restricted = mode==='restricted', grouped = mode==='group';
  const techChecks=state.techs.map(t=>{
    const on=(c.access&&c.access.techs||[]).includes(t.id);
    return `<label class="perm ${on?'on':''}" style="max-width:230px">
      <input type="checkbox" ${on?'checked':''} ${manage&&restricted?'':'disabled'} onclick="toggleClientAccessTech('${c.id}','${t.id}')">
      <span>${esc(t.name)}</span></label>`;
  }).join('');
  const groupChecks=state.zammadGroups.filter(g=>!g.archived).map(g=>{
    const on=(c.access&&c.access.groups||[]).includes(g.id);
    const members=state.techs.filter(t=>(t.groups||[]).includes(g.id)).length;
    return `<label class="perm ${on?'on':''}" style="max-width:230px">
      <input type="checkbox" ${on?'checked':''} ${manage&&grouped?'':'disabled'} onclick="toggleClientAccessGroup('${c.id}','${g.id}')">
      <span>${esc(g.name)} <span class="mini muted">· ${members} tech${members===1?'':'s'}</span></span></label>`;
  }).join('');
  const radio=(m,label,sub)=>`<label class="mini" style="display:flex;align-items:center;gap:7px"><input type="radio" name="acc" ${mode===m?'checked':''} ${manage?'':'disabled'} onclick="setClientAccessMode('${c.id}','${m}')"> <b>${label}</b> ${sub||''}</label>`;
  const access=`<div class="card">
    <div class="card-head"><h3>Client access</h3><span class="hint">${manage?'who can see &amp; work this client':'read-only'}</span></div>
    <div class="card-pad">
      <div class="notice info" style="margin-bottom:14px">${icon(IC.lock)}<div>Restrict this client to specific technicians or groups. Anyone without access <b>won\u2019t see the client, its tickets, or its billing</b> — and can\u2019t log or edit time against it. People with the <b>“Access every client”</b> permission always have access.</div></div>
      <div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px">
        ${radio('all','Everyone','with client access')}
        ${radio('restricted','Only selected technicians','')}
        ${radio('group','Technicians in selected groups','')}
      </div>
      ${restricted?`<div style="display:flex;flex-flow:row wrap;gap:8px">${techChecks}</div>`
        :grouped?`<div style="display:flex;flex-flow:row wrap;gap:8px">${groupChecks}</div>
           <div class="mini muted" style="margin-top:10px">A technician gets access if they belong to <b>any</b> selected group. Group membership is shared with Docket.</div>`
        :'<div class="mini muted">All technicians with client access can see and work this client.</div>'}
    </div>
  </div>`;

  return `<div style="margin-bottom:14px">${back}</div>
    ${billing}<div class="section-gap"></div>${breakdown}<div class="section-gap"></div>${access}`;
}
function setClientTypeRate(cid,tid,v){ const c=client(cid); c.rates=c.rates||{}; const o=c.rates[tid]||(c.rates[tid]={}); if(v===''){ delete o.rate; } else { o.rate=Number(v); } if(o.rate==null&&o.billable==null) delete c.rates[tid]; render(); }
function toggleClientTypeBillable(cid,tid){ const c=client(cid); const t=atype(tid); c.rates=c.rates||{}; const o=c.rates[tid]||(c.rates[tid]={}); const eff=o.billable!=null?o.billable:t.billable; o.billable=!eff; if(o.billable===t.billable){ delete o.billable; if(o.rate==null) delete c.rates[tid]; } log('Client billing changed',`${esc(c.name)} · ${esc(t.name)} → ${(o.billable!=null?o.billable:t.billable)?'billable':'non-billable'}`,cid); render(); }
function clearClientTypeOverride(cid,tid){ const c=client(cid); if(c.rates) delete c.rates[tid]; render(); }
function setClientAccessMode(cid,mode){ const c=client(cid); c.access=c.access||{mode:'all',techs:[],groups:[]}; c.access.mode=mode; c.access.techs=c.access.techs||[]; c.access.groups=c.access.groups||[]; if(mode==='restricted'&&!c.access.techs.length){ c.access.techs=[state.demoTechId].filter(Boolean); } log('Client access changed',`${esc(c.name)} → ${mode==='all'?'everyone':mode==='group'?'by group':'restricted'}`,cid); render(); }
function toggleClientAccessTech(cid,tid){ const c=client(cid); c.access=c.access||{mode:'restricted',techs:[],groups:[]}; c.access.techs=c.access.techs||[]; const i=c.access.techs.indexOf(tid); if(i>=0)c.access.techs.splice(i,1); else c.access.techs.push(tid); render(); }
function toggleClientAccessGroup(cid,gid){ const c=client(cid); c.access=c.access||{mode:'group',techs:[],groups:[]}; c.access.groups=c.access.groups||[]; const i=c.access.groups.indexOf(gid); if(i>=0)c.access.groups.splice(i,1); else c.access.groups.push(gid); render(); }


/* ===================== ACTIVITY TYPES ===================== */
function viewTypes(){
  const rows=state.types.map(a=>{
    const n=state.entries.filter(e=>e.typeId===a.id && e.status!=='void').length;
    if(a.sentinel) return `<tr>
      <td><div class="cell-title">${esc(a.name)} <span class="chip unclassified" style="margin-left:6px"><span class="cdot"></span>system</span></div>
          <div class="cell-meta">Where the ticket timer parks entries with no activity type. Blocks a period close until reclassified.</div></td>
      <td><span class="chip nonbill"><span class="cdot"></span>Never billable</span></td>
      <td class="num muted">—</td>
      <td class="num">${n}</td>
    </tr>`;
    return `<tr>
      <td><div class="cell-title">${esc(a.name)}</div><div class="cell-meta">${a.note?esc(a.note):'<span class="muted">— no note —</span>'}</div></td>
      <td><div style="display:flex;align-items:center;gap:9px"><button class="toggle ${a.billable?'on':''}" onclick="toggleTypeBillable('${a.id}')"></button><span class="mini">${a.billable?'Billable':'Non-billable'}</span></div></td>
      <td class="num"><input type="number" min="0" step="5" value="${a.rate}" onchange="setTypeRate('${a.id}',this.value,this)" ${a.billable?'':'disabled'} style="width:110px;text-align:right"></td>
      <td class="num">${n}</td>
    </tr>`;
  }).join('');
  return `
  <div class="notice info" style="margin-bottom:16px">${icon(IC.tag)}<div>These are the same activity types Docket\u2019s ticket timer logs against. Turning a type <b>billable</b> and setting a rate re-prices every open (unlocked) entry that uses it. Locked entries never change.</div></div>
  <div class="card"><table class="tbl">
    <thead><tr><th>Activity type</th><th>Billable</th><th class="num">Rate ($/h)</th><th class="num">Entries</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ===================== BILLING PERIODS ===================== */
function viewPeriods(){
  // build the set of (client, period) buckets that have entries
  const buckets={};
  state.entries.forEach(e=>{
    const per=entryPeriod(e); const k=e.clientId+'|'+per.key;
    if(!buckets[k]) buckets[k]={clientId:e.clientId,per,es:[]};
    buckets[k].es.push(e);
  });
  const list=Object.values(buckets).sort((a,b)=> b.per.start-a.per.start || client(a.clientId).name.localeCompare(client(b.clientId).name));
  const cards=list.map(b=>{
    const c=client(b.clientId), ps=periodState(b.clientId,b.per.key);
    let h=0,a=0,unclass=0,voided=0,submitted=0,approved=0;
    b.es.forEach(e=>{const p=priced(e); if(e.status==='void'){voided++;return;} h+=p.h; a+=p.amount; if(p.unclassified)unclass++; if(e.submitted||isLocked(e))submitted++; if(e.tsApproved||isLocked(e))approved++;});
    const flatFees = projFlatTotal(b.clientId, b.per.key); a += flatFees;
    const live=b.es.length-voided;
    const open=ps.status==='open';
    const status = ps.status==='exported'
      ? `<span class="chip exported"><span class="cdot"></span>Approved · exported</span>`
      : ps.status==='approved'
      ? `<span class="chip approved"><span class="cdot"></span>Approved · locked</span>`
      : `<span class="chip pending"><span class="cdot"></span>Open</span>`;
    let action;
    if(open){
      action = unclass>0
        ? `<button class="btn" disabled title="Classify all entries first">${icon(IC.lock)}Approve &amp; lock</button><div class="mini" style="color:var(--warn);margin-top:6px">${unclass} unclassified — classify first</div>`
        : `<button class="btn seal" onclick="approvePeriod('${b.clientId}','${b.per.key}')">${icon(IC.seal)}Approve &amp; lock</button>`;
    } else {
      action = `<div class="seal-stamp">${icon(IC.seal)}Approved ${ps.approvedAt?fmtDate(ps.approvedAt):''}</div>
        ${ps.status==='approved'?`<button class="btn primary sm" style="margin-top:8px" onclick="go('export')">${icon(IC.export)}Export to Odoo</button>`:`<div class="mini" style="margin-top:8px">Exported → <span class="tape">${ps.exportRef}</span></div>`}`;
    }
    return `<div class="card card-pad" style="${open?'':'background:linear-gradient(180deg,rgba(176,134,47,.04),transparent)'}">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:10px"><div class="cell-title" style="font-size:15px">${esc(c.name)}</div>${status}</div>
          <div class="cell-meta" style="margin-top:3px;text-transform:capitalize">${c.cycle} · ${b.per.label}</div>
        </div>
      </div>
      <div style="display:flex;gap:26px;margin:14px 0 4px" class="tape">
        <div><div class="mini muted">Entries</div><div style="font-size:17px;font-weight:600">${live}${voided?` <span class="mini" style="color:var(--void)">+${voided} void</span>`:''}</div></div>
        <div><div class="mini muted">Hours</div><div style="font-size:17px;font-weight:600">${fmtHours(h)}</div></div>
        <div><div class="mini muted">Amount</div><div style="font-size:17px;font-weight:600">${fmtMoney(a)}</div>${flatFees>0?`<div class="mini" style="color:var(--seal)">incl. ${fmtMoney(flatFees)} project flat fees</div>`:''}</div>
        ${open?`<div><div class="mini muted">Approved by manager</div><div style="font-size:17px;font-weight:600;color:${(live>0&&approved===live)?'var(--brand)':'var(--ink)'}">${approved}/${live}</div></div>`:''}
      </div>
      ${open&&live>0&&submitted<live&&unclass===0?`<div class="mini" style="color:var(--ink-3);margin-top:2px">${live-submitted} entr${live-submitted===1?'y':'ies'} not yet submitted by the technician — you can still approve &amp; lock, or wait for them.</div>`
      :open&&live>0&&approved<live&&submitted===live?`<div class="mini" style="color:var(--ink-3);margin-top:2px">${live-approved} submitted entr${live-approved===1?'y':'ies'} awaiting timesheet approval — review on the <a href="#" onclick="go('approvals');return false" style="color:inherit;text-decoration:underline">Approvals</a> page.</div>`:''}
      <div style="margin-top:12px">${action}</div>
    </div>`;
  }).join('');
  return `<div class="notice info" style="margin-bottom:16px">${icon(IC.period)}<div>Approving a period <b>locks every entry in it permanently</b> — they become immutable and can\u2019t be edited or deleted, and the period is cleared for Odoo export. A period can\u2019t be approved while any entry is Unclassified.</div></div>
  <div class="grid g-2">${cards}</div>`;
}

/* ===================== ODOO EXPORT ===================== */
function viewExport(){
  const approved=[];
  Object.entries(state.periods).forEach(([k,ps])=>{
    if(ps.status==='open') return;
    const [clientId,pk]=k.split('|');
    const es=state.entries.filter(e=>e.clientId===clientId && entryPeriod(e).key===pk && e.status!=='void');
    if(es.length) approved.push({clientId,pk,ps,es});
  });
  approved.sort((a,b)=>b.ps.approvedAt-a.ps.approvedAt);

  const connector=`
    <div class="card">
      <div class="card-head"><h3>Odoo connector</h3><span class="hint">${state.settings.odoo.enabled?'configured':'not configured — export runs in preview mode'}</span></div>
      <div class="card-pad">
        <div class="notice ${state.settings.odoo.enabled?'info':'warn'}" style="margin-bottom:14px">${icon(state.settings.odoo.enabled?IC.check:IC.warn)}<div>${state.settings.odoo.enabled?'Connected. Approved periods post as invoices to the configured journal.':'This is an <b>open connector stub</b>. Fill in your Odoo details in Settings and wire the endpoint in the backend — until then, export produces a preview payload and a reference, without posting.'}</div></div>
        <div class="grid g-2">
          <div><div class="mini muted">Instance URL</div><div class="v tape">${state.settings.odoo.url||'—'}</div></div>
          <div><div class="mini muted">Database</div><div class="v tape">${state.settings.odoo.db||'—'}</div></div>
          <div><div class="mini muted">Journal</div><div class="v">${esc(state.settings.odoo.journal)}</div></div>
          <div><div class="mini muted">Post as</div><div class="v" style="text-transform:capitalize">${state.settings.odoo.mode} invoice</div></div>
        </div>
        <div style="margin-top:12px"><button class="btn sm" onclick="go('settings')">${icon(IC.settings)}Edit connector settings</button></div>
      </div>
    </div>`;

  if(approved.length===0) return connector+`<div class="section-gap"></div><div class="card"><div class="empty">${icon(IC.export)}<div>No approved periods yet.<br>Approve a period on the <a href="#" onclick="go('periods');return false">Billing Periods</a> page to make it exportable.</div></div></div>`;

  const cards=approved.map(x=>{
    const c=client(x.clientId), per=periodFor(c.cycle, x.es[0].startedAt);
    // group into invoice lines by activity type (billable only)
    const lines={};
    let total=0;
    x.es.forEach(e=>{const p=priced(e); if(!p.billable)return; const t=atype(e.typeId);
      const key=t.id; if(!lines[key])lines[key]={name:t.name,h:0,rate:p.rate,amt:0}; lines[key].h+=p.h; lines[key].amt+=p.amount; total+=p.amount;});
    const flatLines = projFlatLines(x.clientId, x.pk);
    flatLines.forEach(fl=>{ total += fl.amount; });
    const flatRows = flatLines.map(fl=>`<tr><td>${esc(fl.project)} \u2014 ${esc(fl.label)} <span class="mini muted">#${fl.ticket} \u00b7 flat fee${fl.hours?` \u00b7 ${fmtHours(fl.hours)} h worked`:''}</span></td><td class="num">\u2014</td><td class="num">\u2014</td><td class="num" style="font-weight:600">${fmtMoney(fl.amount)}</td></tr>`).join('');
    const lineRows=(Object.values(lines).map(l=>`<tr><td>${esc(l.name)}</td><td class="num">${fmtHours(l.h)}</td><td class="num">${fmtMoney(l.rate)}</td><td class="num" style="font-weight:600">${fmtMoney(l.amt)}</td></tr>`).join('') + flatRows)
      || `<tr><td colspan="4" class="muted">No billable lines (all non-billable this period)</td></tr>`;
    const done=x.ps.status==='exported';
    return `<div class="card">
      <div class="card-head"><h3>${esc(c.name)}</h3><span class="hint" style="text-transform:capitalize">${c.cycle} · ${per.label}${(()=>{const rm=retainerFor(c)?retainerMath(c.id,per.key):null; return rm?` \u00b7 retainer ${rm.used.toFixed(1)}/${rm.included.toFixed(1)} h${rm.overageH>0?` \u00b7 overage ${fmtMoney(rm.overageAmt)}`:''}`:'';})()}</span>
        <div style="margin-left:auto">${done?`<span class="chip exported"><span class="cdot"></span>Exported · ${x.ps.exportRef}</span>`:`<span class="chip approved"><span class="cdot"></span>Ready</span>`}</div></div>
      <table class="tbl"><thead><tr><th>Invoice line (by activity)</th><th class="num">Hours</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
        <tbody>${lineRows}<tr><td colspan="3" class="num" style="font-weight:600">Invoice total</td><td class="num" style="font-weight:700">${fmtMoney(total)}</td></tr></tbody></table>
      <div class="card-pad" style="border-top:1px solid var(--line);display:flex;align-items:center;gap:10px">
        ${done
          ? `<div class="mini muted">Exported ${fmtStamp(x.ps.exportedAt)} · ref <span class="tape">${x.ps.exportRef}</span></div><div class="spacer"></div><button class="btn sm" onclick="previewPayload('${x.clientId}','${x.pk}')">View payload</button>`
          : `<button class="btn primary" onclick="runExport('${x.clientId}','${x.pk}')">${icon(IC.export)}Export to Odoo</button><button class="btn sm" onclick="previewPayload('${x.clientId}','${x.pk}')">Preview payload</button><div class="spacer"></div><div class="mini muted">${x.es.length} entries · locked</div>`}
      </div>
    </div>`;
  }).join('<div class="section-gap"></div>');
  return connector+`<div class="section-gap"></div>`+cards;
}

/* ===================== REPORTS ===================== */
function isoDate(d){ d=new Date(d); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function reportRange(){
  const r=state.rpt;
  const from = r.from ? new Date(r.from+'T00:00:00').getTime() : -Infinity;
  const to   = r.to   ? new Date(r.to+'T23:59:59').getTime()   :  Infinity;
  return [from,to];
}
function reportEntries(){
  const r=state.rpt; const [from,to]=reportRange();
  let es=scopedEntries().slice();
  if(!r.includeVoid) es=es.filter(e=>e.status!=='void');
  es=es.filter(e=> e.startedAt>=from && e.startedAt<=to);
  if(r.client!=='all') es=es.filter(e=>e.clientId===r.client);
  if(isAdmin() && r.tech!=='all') es=es.filter(e=>e.techId===r.tech);
  if(r.type!=='all')   es=es.filter(e=>e.typeId===r.type);
  if(r.billable==='billable') es=es.filter(e=>priced(e).billable);
  if(r.billable==='nonbill')  es=es.filter(e=>{const p=priced(e);return !p.billable && !p.unclassified;});
  if(r.scope==='open')   es=es.filter(e=>!isLocked(e));
  if(r.scope==='locked') es=es.filter(e=> isLocked(e));
  return es;
}
function buildReport(){
  const r=state.rpt, es=reportEntries(), cols=[], rows=[];
  const money=canSeeMoney(), admin=isAdmin();
  if(r.group==='entry'){
    cols.push({k:'date',l:'Date'},{k:'client',l:'Client'},{k:'ticket',l:'Ticket'});
    if(admin) cols.push({k:'tech',l:'Technician'});
    cols.push({k:'activity',l:'Activity'});
    if(r.det.rate && money) cols.push({k:'rate',l:'Rate',num:true});
    cols.push({k:'billable',l:'Billable'},{k:'hours',l:'Hours',num:true});
    if(money) cols.push({k:'amount',l:'Amount',num:true});
    if(r.det.status) cols.push({k:'status',l:'Status'});
    if(r.det.note)   cols.push({k:'note',l:'Note'});
    if(r.det.zammad) cols.push({k:'zammad',l:'Docket ref'});
    es.slice().sort((a,b)=>a.startedAt-b.startedAt).forEach(e=>{
      const p=priced(e), c=client(e.clientId), t=tech(e.techId), a=atype(e.typeId);
      rows.push({ date:fmtDate(e.startedAt), client:c.name, ticket:'#'+e.zTicket+' '+e.ticketTitle, tech:t.name, activity:a.name,
        rate:p.billable?p.rate:0, billable:p.unclassified?'Unclassified':(p.billable?'Yes':'No'),
        hours:p.h, amount:p.amount, status:e.status==='void'?'Voided':(isLocked(e)?'Locked':(e.tsApproved?'Approved':(e.submitted?'Submitted':'Pending'))),
        note:e.content, zammad:'entry #'+e.zEntryId });
    });
  } else {
    const groups={};
    es.forEach(e=>{
      let key,label,meta='';
      if(r.group==='client'){ const c=client(e.clientId); key=c.id; label=c.name; meta=c.cycle; }
      else if(r.group==='tech'){ const t=tech(e.techId); key=t.id; label=t.name; }
      else if(r.group==='type'){ const a=atype(e.typeId); key=a.id; label=a.name; meta=a.sentinel?'unclassified':(a.billable?'billable':'non-billable'); }
      else if(r.group==='ticket'){ key='#'+e.zTicket; label='#'+e.zTicket+' '+e.ticketTitle; meta=client(e.clientId).name; }
      else { const c=client(e.clientId), per=periodFor(c.cycle,e.startedAt); key=c.id+'|'+per.key; label=c.name; meta=per.label+' · '+periodState(c.id,per.key).status; }
      const g=groups[key]||(groups[key]={label,meta,entries:0,hours:0,billH:0,nonbillH:0,amount:0,avg:0});
      const p=priced(e);
      g.entries++; g.hours+=p.h; g.amount+=p.amount;
      if(p.billable) g.billH+=p.h; else if(!p.unclassified) g.nonbillH+=p.h;
    });
    const gl={client:'Client',tech:'Technician',type:'Activity type',ticket:'Ticket',period:'Client'}[r.group];
    cols.push({k:'label',l:gl});
    if(r.group!=='tech') cols.push({k:'meta',l:{client:'Cycle',type:'Kind',ticket:'Client',period:'Period · status'}[r.group]});
    const m=r.metrics;
    if(m.entries)  cols.push({k:'entries',l:'Entries',num:true});
    if(m.hours)    cols.push({k:'hours',l:'Hours',num:true});
    if(m.billable) cols.push({k:'billH',l:'Billable h',num:true});
    if(m.nonbill)  cols.push({k:'nonbillH',l:'Non-bill h',num:true});
    if(m.amount && money)  cols.push({k:'amount',l:'Amount',num:true});
    if(m.avgrate && money) cols.push({k:'avg',l:'Avg $/h',num:true});
    Object.values(groups).forEach(g=>{ g.avg=g.billH>0?g.amount/g.billH:0; rows.push(g); });
    rows.sort((a,b)=> b.amount-a.amount || b.hours-a.hours);
  }
  const totals={entries:0,hours:0,billH:0,nonbillH:0,amount:0,avg:0};
  es.forEach(e=>{ const p=priced(e); totals.entries++; totals.hours+=p.h; totals.amount+=p.amount;
    if(p.billable) totals.billH+=p.h; else if(!p.unclassified) totals.nonbillH+=p.h; });
  totals.avg = totals.billH>0?totals.amount/totals.billH:0;
  return {cols,rows,totals};
}
function rcellHTML(k,row){
  switch(k){
    case 'label': return `<div class="cell-title">${esc(row.label)}</div>`;
    case 'meta': return `<span class="cell-meta" style="text-transform:capitalize">${esc(row.meta||'—')}</span>`;
    case 'entries': return row.entries;
    case 'hours': return fmtHours(row.hours);
    case 'billH': return fmtHours(row.billH);
    case 'nonbillH': return fmtHours(row.nonbillH);
    case 'amount': return `<b>${fmtMoney(row.amount)}</b>`;
    case 'avg': return row.billH>0?`<span class="tape">${fmtMoney(row.avg)}</span>`:'<span class="muted">—</span>';
    case 'date': return `<span class="tape">${esc(row.date)}</span>`;
    case 'client': return esc(row.client);
    case 'ticket': return `<div class="cell-title" style="font-weight:500">${esc(row.ticket)}</div>`;
    case 'tech': return esc(row.tech);
    case 'activity': return esc(row.activity);
    case 'rate': return row.rate?`<span class="tape">${fmtMoney(row.rate)}</span>`:'<span class="muted">—</span>';
    case 'billable': return row.billable==='Yes'?'<span class="chip billable" style="padding:1px 8px"><span class="cdot"></span>Yes</span>':row.billable==='Unclassified'?'<span class="chip unclassified" style="padding:1px 8px"><span class="cdot"></span>Uncl.</span>':'<span class="muted">No</span>';
    case 'status': return esc(row.status);
    case 'note': return `<span class="cell-meta">${esc((row.note||'').slice(0,70))}${(row.note||'').length>70?'…':''}</span>`;
    case 'zammad': return `<span class="tape cell-meta">${esc(row.zammad)}</span>`;
    default: return '';
  }
}
function rtotalHTML(k,t){
  switch(k){
    case 'entries': return t.entries;
    case 'hours': return fmtHours(t.hours);
    case 'billH': return fmtHours(t.billH);
    case 'nonbillH': return fmtHours(t.nonbillH);
    case 'amount': return `<b>${fmtMoney(t.amount)}</b>`;
    case 'avg': return t.billH>0?fmtMoney(t.avg):'—';
    default: return '';
  }
}
function rcellCSV(k,row){
  switch(k){
    case 'label': return row.label; case 'meta': return row.meta||'';
    case 'entries': return row.entries;
    case 'hours': return row.hours.toFixed(2); case 'billH': return row.billH.toFixed(2);
    case 'nonbillH': return row.nonbillH.toFixed(2); case 'amount': return row.amount.toFixed(2);
    case 'avg': return (row.billH>0?row.avg:0).toFixed(2);
    case 'date': return row.date; case 'client': return row.client; case 'ticket': return row.ticket;
    case 'tech': return row.tech; case 'activity': return row.activity;
    case 'rate': return (row.rate||0).toFixed(2); case 'billable': return row.billable;
    case 'status': return row.status; case 'note': return row.note||''; case 'zammad': return row.zammad||'';
    default: return '';
  }
}
function rtotalCSV(k,t){
  switch(k){ case 'entries':return t.entries; case 'hours':return t.hours.toFixed(2);
    case 'billH':return t.billH.toFixed(2); case 'nonbillH':return t.nonbillH.toFixed(2);
    case 'amount':return t.amount.toFixed(2); case 'avg':return (t.billH>0?t.avg:0).toFixed(2); default:return ''; }
}
function reportCSV(rep){
  const q=v=>{ v=String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[rep.cols.map(c=>q(c.l)).join(',')];
  rep.rows.forEach(row=> lines.push(rep.cols.map(c=>q(rcellCSV(c.k,row))).join(',')));
  if(rep.rows.length) lines.push(rep.cols.map((c,i)=> i===0?q('TOTAL'):q(rtotalCSV(c.k,rep.totals))).join(','));
  return lines.join('\r\n');
}
function reportTitle(){ return {entry:'Detailed timesheet report',client:'Billing summary by client',tech:'Hours by technician',type:'Summary by activity type',period:'Billing periods report',ticket:'Summary by ticket'}[state.rpt.group]; }
function reportFilename(){ const r=state.rpt; return `ledger-${r.group}-${(r.from||'start')}_to_${(r.to||'end')}.csv`; }
function setRpt(k,v){ state.rpt[k]=v; render(); }
function setRptMetric(k){ state.rpt.metrics[k]=!state.rpt.metrics[k]; render(); }
function setRptDet(k){ state.rpt.det[k]=!state.rpt.det[k]; render(); }
function rptPreset(p){
  const r=state.rpt, y=NOW.getFullYear(), m=NOW.getMonth(); let s,e;
  if(p==='thismonth'){ s=new Date(y,m,1); e=new Date(y,m+1,0); }
  else if(p==='lastmonth'){ s=new Date(y,m-1,1); e=new Date(y,m,0); }
  else if(p==='quarter'){ s=new Date(y,Math.floor(m/3)*3,1); e=NOW; }
  else { const ds=state.entries.map(x=>x.startedAt); s=new Date(Math.min(...ds)); e=new Date(Math.max(...ds)); }
  r.from=isoDate(s); r.to=isoDate(e); render();
}
function downloadCSV(){
  const rep=buildReport();
  if(!rep.rows.length){ toast('Nothing to export for this report'); return; }
  const blob=new Blob([reportCSV(rep)],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=reportFilename(); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
  toast('Exported '+reportFilename());
}
function copyCSV(){
  const rep=buildReport();
  if(!rep.rows.length){ toast('Nothing to copy'); return; }
  const csv=reportCSV(rep);
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(csv).then(()=>toast('Report copied — paste into a spreadsheet'),()=>toast('Copy blocked by browser')); }
  else toast('Clipboard unavailable in this browser');
}

    <div class="rpt-line"><span class="rpt-lab">Report</span><div class="seg wrap">${groupSeg}</div></div>

      <div class="seg">

      <label class="mini" style="display:flex;align-items:center;gap:6px">from <input type="date" value="${r.from}" onchange="setRpt('from',this.value)"></label>
      <label class="mini" style="display:flex;align-items:center;gap:6px">to <input type="date" value="${r.to}" onchange="setRpt('to',this.value)"></label>

function viewAudit(){
  const f = state.af || (state.af = {from:'', to:'', actor:'all', action:'all', entity:'all', q:''});
  const opt=(v,l,cur)=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`;
  const actions=[...new Set(state.audit.map(a=>a.action))].sort();
  const actors=[...new Set(state.audit.map(a=>a.actor).filter(Boolean))].sort();
  const entities=[...new Set(state.audit.map(a=>a.entity).filter(Boolean))].sort();
  const entLabel={entry:'Entries',period:'Billing periods',client:'Clients'};
  const filtered=auditFiltered();
  const controls=`
  <div class="card"><div class="card-pad" style="display:flex;flex-direction:column;gap:13px">
    <div class="rpt-line"><span class="rpt-lab">Period</span>
      <div class="seg">
        <button onclick="auditPreset('7d')">Last 7 days</button>
        <button onclick="auditPreset('30d')">Last 30 days</button>
        <button onclick="auditPreset('thismonth')">This month</button>
        <button onclick="auditPreset('all')">All time</button>
      </div>
      <label class="mini" style="display:flex;align-items:center;gap:6px">from <input type="date" value="${f.from}" onchange="setAF('from',this.value)"></label>
      <label class="mini" style="display:flex;align-items:center;gap:6px">to <input type="date" value="${f.to}" onchange="setAF('to',this.value)"></label>
    </div>
    <div class="rpt-line"><span class="rpt-lab">Filters</span>
      <div class="search">${icon(IC.search)}<input type="text" placeholder="Search detail, event, actor…" value="${esc(f.q)}" data-fkey="laf-q" oninput="setAF('q',this.value)"></div>
      <select onchange="setAF('action',this.value)">${opt('all','All events',f.action)}${actions.map(a=>opt(a,a,f.action)).join('')}</select>
      <select onchange="setAF('actor',this.value)">${opt('all','All actors',f.actor)}${actors.map(a=>opt(a,a,f.actor)).join('')}</select>
      ${entities.length?`<select onchange="setAF('entity',this.value)">${opt('all','All areas',f.entity)}${entities.map(e=>opt(e,entLabel[e]||e,f.entity)).join('')}</select>`:''}
      ${(f.from||f.to||f.actor!=='all'||f.action!=='all'||f.entity!=='all'||f.q)?`<button class="btn sm ghost" onclick="clearAF()">Clear</button>`:''}
    </div>
  </div></div>`;
  const body = filtered.length
    ? filtered.map(a=>`
      <tr>
        <td class="time-cell" style="white-space:nowrap">${fmtStamp(a.ts)}</td>
        <td><span class="chip ${auditChip(a.action)}"><span class="cdot"></span>${esc(a.action)}</span></td>
        <td>${esc(a.detail)}</td>
        <td class="cell-meta">${esc(a.actor)}</td>
      </tr>`).join('')
    : `<tr><td colspan="4" style="padding:26px;text-align:center" class="muted">No events match these filters. Widen the date range or clear a filter.</td></tr>`;
  return `<div class="notice info" style="margin-bottom:16px">${icon(IC.audit)}<div>Every change is recorded here and can\u2019t be edited — including entries <b>removed in Docket</b>, so a removed time event is always accounted for — the ledger keeps its own record.</div></div>
  ${controls}
  <div class="section-gap"></div>
  <div class="card">
    <div class="card-head"><h3>Audit log</h3><span class="hint">${filtered.length} of ${state.audit.length} event${state.audit.length===1?'':'s'}</span>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn sm" onclick="copyAudit()">Copy</button>
        <button class="btn primary" onclick="downloadAudit()">${icon(IC.export)}Export CSV</button>
      </div></div>
    <table class="tbl">
      <thead><tr><th style="width:150px">When</th><th style="width:190px">Event</th><th>Detail</th><th style="width:140px">Actor</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}
function setAF(k,v){ state.af[k]=v; if(k!=='q') render(); else softRerender(); }
function clearAF(){ state.af={from:'', to:'', actor:'all', action:'all', entity:'all', q:''}; render(); }
function auditRange(){
  const f=state.af||{};
  const from = f.from ? new Date(f.from+'T00:00:00').getTime() : -Infinity;
  const to   = f.to   ? new Date(f.to+'T23:59:59').getTime()   :  Infinity;
  return [from,to];
}
function auditFiltered(){
  const f=state.af||{}; const [from,to]=auditRange();
  let rows=state.audit.filter(a=>a.ts>=from && a.ts<=to);
  if(f.action&&f.action!=='all') rows=rows.filter(a=>a.action===f.action);
  if(f.actor &&f.actor!=='all')  rows=rows.filter(a=>a.actor===f.actor);
  if(f.entity&&f.entity!=='all') rows=rows.filter(a=>(a.entity||'')===f.entity);
  if(f.q){ const q=f.q.toLowerCase(); rows=rows.filter(a=>((a.action||'')+' '+(a.detail||'')+' '+(a.actor||'')).toLowerCase().includes(q)); }
  return rows;
}
function auditPreset(p){
  const now=NOW, f=state.af;   // demo uses a fixed "today"
  const d=n=>n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  if(p==='all'){ f.from=''; f.to=''; }
  else if(p==='thismonth'){ f.from=d(new Date(now.getFullYear(),now.getMonth(),1)); f.to=d(now); }
  else { const days=p==='7d'?7:30; const s=new Date(now); s.setDate(now.getDate()-days); f.from=d(s); f.to=d(now); }
  render();
}
function auditCSV(){
  const q=v=>{ v=String(v==null?'':v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[['When','Event','Detail','Actor','Area'].join(',')];
  auditFiltered().forEach(a=>lines.push([new Date(a.ts).toISOString(), a.action, a.detail, a.actor, a.entity||''].map(q).join(',')));
  return lines.join('\r\n');
}
function downloadAudit(){
  if(!auditFiltered().length){ toast('Nothing to export'); return; }
  const blob=new Blob([auditCSV()],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='ledger-audit.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200); toast('Exported ledger-audit.csv');
}
function copyAudit(){
  if(!auditFiltered().length){ toast('Nothing to copy'); return; }
  const csv=auditCSV();
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(csv).then(()=>toast('Audit copied — paste into a spreadsheet'),()=>toast('Copy blocked by browser'));
  else toast('Clipboard unavailable in this browser');
}
function auditChip(action){
  if(/approv/i.test(action)) return 'approved';
  if(/export/i.test(action)) return 'exported';
  if(/delete|void/i.test(action)) return 'void';
  if(/unclass/i.test(action)) return 'unclassified';
  if(/classif|reclass/i.test(action)) return 'billable';
  return 'pending';
}

/* searchable dropdown — ported from Docket so every client picker matches.

const _combos = {};
function combo(id, opts, val, onpick, placeholder){
  _combos[id] = { opts, onpick: typeof onpick==='function' ? onpick : null };
  const cur = opts.find(o=>o.v===val);

    <input type="hidden" id="${id}" value="${esc(val||'')}">

    <div id="${id}-list" style="display:none;position:absolute;top:100%;left:0;right:0;max-height:220px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px rgba(21,32,41,.14);z-index:80"></div>

}
function comboData(id){ return (_combos[id]||{}).opts || []; }

  box.innerHTML = opts.slice(0,50).map(o=>`<div style="padding:7px 11px;cursor:pointer;font-size:13px" onmousedown="comboPick('${id}','${jsq(String(o.v))}')"><b>${esc(o.label)}</b>${o.sub?` <span class="mini muted">${esc(o.sub)}</span>`:''}</div>`).join('')
    || `<div class="mini muted" style="padding:9px 11px">No matches.</div>`;

function comboPick(id, v){

function _presetDates(f,p){
  const now=NOW, d=n=>n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  if(p==='all'){ f.from=''; f.to=''; }

  else { const days=p==='7d'?7:p==='90d'?90:30; const s=new Date(now); s.setDate(now.getDate()-days); f.from=d(s); f.to=d(now); }
}

/* scriptable surface — mirrors the future ledger-api */
window.LedgerAPI = {
  call(path){
    const [p, qs] = String(path).split('?');
    if(p==='/api/entries'){
      const params = Object.fromEntries((qs||'').split('&').filter(Boolean).map(x=>x.split('=')));
      let rows = state.entries.filter(e=>e.status!=='void');
      if(params.client) rows = rows.filter(e=>e.clientId===params.client);
      if(params.status) rows = rows.filter(e=>e.status===params.status);
      return rows.map(e=>({ ticket:e.zTicket, tech:tech(e.techId)?.name, client:client(e.clientId)?.name, type:atype(e.typeId)?.name, hours:e.hours, amount:priced(e).amount, status:e.status, started:new Date(e.startedAt).toISOString() }));
    }
    if(p==='/api/reports/utilization'){
      const mkey = new Date().toISOString().slice(0,7);
      return state.techs.map(t=>{ const es = state.entries.filter(e=>e.techId===t.id && e.status!=='void' && new Date(e.startedAt).toISOString().slice(0,7)===mkey);
        const tot = es.reduce((s,e)=>s+e.hours,0), bil = es.filter(e=>priced(e).billable).reduce((s,e)=>s+e.hours,0);
        return { tech:t.name, total:+tot.toFixed(2), billable:+bil.toFixed(2), utilization:+(tot?bil/tot*100:0).toFixed(1) }; });
    }
    throw new Error('404 \u2014 known: /api/entries, /api/reports/utilization');
  }
};
function retSet(cid, k, v, srcEl){
  const c = client(cid); c.retainer = c.retainer||{ enabled:false, includedHours:0, overageRate:null, rolloverCap:0, note:'' };
  const was = JSON.stringify({e:c.retainer.enabled,i:c.retainer.includedHours,o:c.retainer.overageRate,r:c.retainer.rolloverCap});
  if(k==='enabled') c.retainer.enabled = !!v;
  else if(k==='overageRate') c.retainer.overageRate = v===''? null : Number(v);
  else c.retainer[k] = Number(v)||0;
  log('Retainer agreement changed', `${c.name}: ${k} \u2192 ${k==='enabled'?(c.retainer.enabled?'active':'off'):(c.retainer[k]??'standard rates')} (was ${was})`);
  commitRender(srcEl);
}
function setTypeRate(id,v,srcEl){
  const a = atype(id); const nv = Number(v)||0;
  if(nv === a.rate){ return; }
  const today = new Date(Date.now()).toISOString().slice(0,10);
  a.rateHist = a.rateHist||[];
  if(!a.rateHist.length) a.rateHist.push({ from:'1970-01-01', rate:a.rate });   /* anchor: history before any change */
  const last = a.rateHist[a.rateHist.length-1];
  if(last.from===today) last.rate = nv;            /* same-day edits collapse into one row */
  else a.rateHist.push({ from:today, rate:nv });
  const was = a.rate; a.rate = nv;
  log('Rate changed (effective-dated)', `${a.name}: ${fmtMoney(was)}/h \u2192 ${fmtMoney(nv)}/h effective ${today} \u2014 entries before today keep ${fmtMoney(was)}/h`, id);
  toast(`${a.name}: ${fmtMoney(nv)}/h from today \u2014 history keeps its price.`);
  commitRender(srcEl);
}
