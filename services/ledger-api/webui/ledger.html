function toast(msg){
  const w=document.getElementById('toasts'); const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<span class="cdot"></span>${esc(msg)}`; w.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); },2600);
}

/* boot */
render();
</script>
<script>
/* ==========================================================================
   SUITE BRIDGE — live link to Docket when both run inside the suite shell.
   Time logged, edited or removed on a Docket ticket lands here instantly,
   through the same rules real entries follow (voided, never hard-deleted).
   ========================================================================== */
window._docketMap = {};   /* docket eid → ledger entry id */
window._docketRev = {};   /* ledger entry id → docket eid */
function notifyDocket(payload){ try{ if(window.parent!==window) window.parent.postMessage(Object.assign({src:'ledger'}, payload), '*'); }catch(e){} }
function openDirectoryInDocket(){
  if(window.parent!==window){ window.parent.postMessage({src:'ledger', type:'open-directory'}, '*'); }
  else toast('Open the suite (SUITE-open-me-first.html) to jump between the apps.');
}
function openInDocket(ticket){
  if(window.parent!==window){ window.parent.postMessage({src:'ledger', type:'open-ticket', ticket}, '*'); }
  else toast('Open the suite (SUITE-open-me-first.html) to jump between the apps.');
}
window.addEventListener('message', ev=>{
  /* only accept relayed messages from our own suite shell */
  if(window.parent===window || ev.source!==window.parent) return;
  const d = ev.data || {};
  if(d.src!=='docket') return;
  if(d.type==='time-logged'){
    const e = addEntry({ clientId:d.clientId, techId:d.techId, title:d.title||('Ticket #'+d.ticket), zticket:d.ticket,
      typeId:d.typeId||'a0', content:d.note||'Logged from Docket.', start:new Date(d.startedAt||Date.now()).toISOString(), dur:d.h, status:'pending' });
    if(d.startedAt && d.endedAt){ e.startedAt=d.startedAt; e.endedAt=d.endedAt; e.hours=Math.round((d.endedAt-d.startedAt)/36000)/100; }
    e.source = 'docket-live';
    if(d.task) e.zTask = { id:d.task.id, label:d.task.label };
    if(d.eid){ window._docketMap[d.eid] = e.id; window._docketRev[e.id] = d.eid; }
    log('Entry received from Docket', `${client(d.clientId)?.name||d.clientId} \u00b7 #${d.ticket}: ${fmtHours(d.h)} h \u00b7 ${atype(e.typeId)?.name||e.typeId} \u2014 arrived live over the shared database`, e.id);
    toast(`\u26a1 ${fmtHours(d.h)} h just landed from Docket ticket #${d.ticket}.`);
    render();
  }
  const findByHeuristic = ()=> state.entries.find(x=> x.zTicket===d.ticket && x.techId===d.techId
      && x.status!=='void' && !x.zDeleted && Math.abs(x.hours-(d.oldH!=null?d.oldH:d.h))<0.011);
  if(d.type==='time-updated'){
    const id = window._docketMap[d.eid]; let e = id && state.entries.find(x=>x.id===id);
    if(!e) e = findByHeuristic();
    if(!e) return;
    if(e.status==='approved' || e.status==='locked' || isLocked(e) || e.tsApproved){
      log('Docket edit refused (locked)', `#${e.zTicket}: the ${e.tsApproved?'manager-approved':'billed'} entry is immutable \u2014 Docket change recorded but not applied`, e.id);
    } else {
      const was = e.hours;
      if(d.startedAt) e.startedAt = d.startedAt;
      if(d.endedAt) e.endedAt = d.endedAt;
      e.hours = d.h; if(!d.endedAt) e.endedAt = e.startedAt + d.h*3600000;
      if(d.typeId) e.typeId = d.typeId;
      if(d.task!==undefined) e.zTask = d.task? { id:d.task.id, label:d.task.label } : null;
      log('Time edited in Docket', `${client(e.clientId)?.name} \u00b7 #${e.zTicket}: ${fmtHours(was)} h \u2192 ${fmtHours(d.h)} h \u00b7 ${atype(e.typeId)?.name}`, e.id);
      toast(`\u26a1 Docket updated #${e.zTicket} \u2014 now ${fmtHours(d.h)} h.`);
    }
    render();
  }
  if(d.type==='time-removed'){
    const id = window._docketMap[d.eid]; let e = id && state.entries.find(x=>x.id===id);
    if(!e) e = findByHeuristic();
    if(!e) return;
    if(e.status==='approved' || e.status==='locked' || isLocked(e) || e.tsApproved){
      log('Removed in Docket (locked)', `#${e.zTicket}: ${e.tsApproved?'manager-approved':'billed'} entry retained (immutable); removal recorded`, e.id);
    } else {
      e.status='void'; e.voidedAt=Date.now(); e.voidReason='Removed in Docket';
      log('Voided (removed in Docket)', `${client(e.clientId)?.name} \u00b7 #${e.zTicket}: ledger row voided (not billed), retained for audit`, e.id);
      toast(`\u26a1 Docket removed an entry on #${e.zTicket} \u2014 row voided, kept for audit.`);
    }
    render();
  }
  /* ---- directory sync: Docket hosts the shared control plane ---- */
  const upsertClient = (cl)=>{
    let c = state.clients.find(x=>x.id===cl.id);
    if(!c){
      c = { id:cl.id, zorg: 100 + state.clients.length + 1, name:cl.name, cycle:'monthly', rateOverride:null,
            billableDefault:true, rates:{}, access:{mode:'all', techs:[]} };
      state.clients.push(c);
      log('Client received from Directory', `${cl.name} \u2014 created in Docket, billing defaults applied (monthly cycle, standard rates)`);
      toast(`\u26a1 New client from Docket: ${cl.name} \u2014 set its cycle and rates here.`);
    } else if(c.name!==cl.name){
      log('Client renamed via Directory', `${c.name} \u2192 ${cl.name}`);
      c.name = cl.name;
    }
    c.archivedInDocket = cl.active===false;
  };
  const upsertGroup = (g)=>{
    let x = state.zammadGroups.find(y=>y.id===g.id);
    if(!x){ state.zammadGroups.push({ id:g.id, name:g.name, archived:g.active===false }); log('Group received from Directory', g.name); }
    else { if(x.name!==g.name){ log('Group renamed via Directory', `${x.name} \u2192 ${g.name}`); x.name=g.name; } x.archived = g.active===false; }
  };
  const upsertAgent = (a)=>{
    const t = state.techs.find(x=>x.id===a.id);
    if(t){ const was=t.groups.join(', ');
      t.groups = a.groups.slice(); t.name=a.name; if(a.initials) t.initials=a.initials;
      if(was!==t.groups.join(', ')) log('Group membership via Directory', `${a.name}: ${was||'\u2014'} \u2192 ${t.groups.join(', ')}`); }
    else { state.techs.push({ id:a.id, zuser:null, name:a.name, initials:a.initials||'??', groups:a.groups.slice() });
      log('Agent received from Directory', a.name); }
  };
  const upsertType = (x)=>{
    const t = state.types.find(y=>y.id===x.id);
    if(!t){ state.types.splice(state.types.length-1, 0, { id:x.id, ztype:null, name:x.name, billable:!!x.billable, rate:0, sentinel:false, active:true, note:'' });
      log('Activity type received from Directory', `${x.name} \u2014 non-billable until a rate is set here`);
      toast(`\u26a1 New activity type from Docket: ${x.name} \u2014 set billable + rate here.`); }
    else { if(t.name!==x.name){ log('Activity type renamed via Directory', `${t.name} \u2192 ${x.name}`); t.name=x.name; }
      if(x.active!==undefined && t.active!==x.active){ t.active = x.active;
        log(x.active?'Activity type restored via Directory':'Activity type archived via Directory', t.name); } }
  };
  if(d.type==='project-approved' && d.ticket){
    state.projects = state.projects||{};
    state.projects[d.ticket] = { ticket:d.ticket, title:d.title||('Project #'+d.ticket), clientId:d.clientId,
      pmode:d.pmode||'tasks', projectFlat:d.projectFlat||null,
      tasks:(d.tasks||[]).slice(), approvedBy:d.approvedBy||'Docket', approvedAt:d.approvedAt||Date.now() };
    let marked=0;
    state.entries.forEach(e=>{
      if(e.zTicket!==d.ticket || e.status==='void' || isLocked(e)) return;
      if(!e.submitted){ e.submitted=true; e.submittedAt=Date.now();
        e.returnedBy=null; e.returnedAt=null; e.returnReason=null; marked++; }
    });
    const flat = d.pmode==='flat' ? (d.projectFlat||0) : (d.tasks||[]).filter(x=>x.mode==='flat').reduce((a,x)=>a+(x.flat||0),0);
    log('Project approved in Docket', `${client(d.clientId)?.name||d.clientId} \u00b7 #${d.ticket} \u201c${d.title||''}\u201d \u2014 ${d.tasks?d.tasks.length:0} tasks, $${flat} in flat fees, hourly tasks price by task rate \u2014 approved by ${d.approvedBy||'?'}; ${marked} entr${marked===1?'y':'ies'} queued for timesheet approval`);
    toast(`\u26a1 Project #${d.ticket} approved \u2014 ${flat>0?('$'+flat+' flat registered, '):''}${marked} entr${marked===1?'y':'ies'} submitted. Review them on the Approvals page (bundled into each tech\u2019s timesheet for the period).`);
    render();
  }
  if(d.type==='ticket-reclient' && d.ticket && d.clientId){
    let moved = 0;
    state.entries.forEach(e=>{ if(e.zTicket===d.ticket && e.status!=='void' && e.status!=='approved' && e.status!=='locked'){ e.clientId = d.clientId; moved++; } });
    if(moved){ log('Ticket moved to client in Docket', `#${d.ticket} \u2192 ${client(d.clientId)?.name||d.clientId}: ${moved} entr${moved===1?'y':'ies'} repriced under the new client`); render(); }
  }
  if(d.type==='ticket-merged'){
    let moved = 0;
    state.entries.forEach(e=>{ if(e.zTicket===d.from){ e.zTicket = d.to; moved++; } });
    if(moved){ log('Ticket merged in Docket', `#${d.from} \u2192 #${d.to}: ${moved} entr${moved===1?'y':'ies'} relabelled`); render(); }
  }
  if(d.type==='dir-client-upsert'){ upsertClient(d.client); render(); }
  if(d.type==='dir-group-upsert'){ upsertGroup(d.group); render(); }
  if(d.type==='dir-group-delete'){
    const i = state.zammadGroups.findIndex(g=>g.id===d.groupId);
    if(i>=0){ log('Group deleted via Directory', state.zammadGroups[i].name); state.zammadGroups.splice(i,1);
      state.clients.forEach(c=>{ if(c.access.groups) c.access.groups = c.access.groups.filter(g=>g!==d.groupId); });
      render(); }
  }
  if(d.type==='dir-agent-upsert'){ upsertAgent(d.agent); render(); }
  if(d.type==='dir-role-upsert' && d.role){
    let r = d.role.oldName ? state.zammadRoles.find(x=>x.name===d.role.oldName) : state.zammadRoles.find(x=>x.name===d.role.name);
    if(!r){ r = { name:d.role.name, tech:true, note:d.role.note||'', perms:(d.role.ledgerPerms||[]).slice() }; state.zammadRoles.push(r);
      log('Role added via Directory', `${d.role.name} \u00b7 ${r.perms.length} Ledger permissions`); }
    else {
      if(d.role.oldName && d.role.oldName!==d.role.name) log('Role renamed via Directory', `${d.role.oldName} \u2192 ${d.role.name}`);
      r.name = d.role.name; r.note = d.role.note||r.note;
      if(d.role.ledgerPerms) r.perms = d.role.ledgerPerms.slice();
      if(d.role.active!==undefined && r.archived!==!d.role.active){ r.archived = !d.role.active;
        log(r.archived?'Role archived via Directory':'Role restored via Directory', r.name); }
    }
    render();
  }
  if(d.type==='dir-role-delete' && d.name){
    const i = state.zammadRoles.findIndex(x=>x.name===d.name);
    if(i>=0){ log('Role deleted via Directory', d.name); state.zammadRoles.splice(i,1); render(); }
  }
  if(d.type==='dir-role-perms' && d.role){
    let r = state.zammadRoles.find(x=>x.name===d.role.name);
    if(!r){ r = { name:d.role.name, tech:true, note:d.role.note||'', perms:[] }; state.zammadRoles.push(r); }
    const was = r.perms.length;
    r.perms = d.role.perms.slice();
    log('Role updated via Directory', `${d.role.name}: ${was} \u2192 ${r.perms.length} Ledger permissions`);
    render();
  }
  if(d.type==='dir-type-upsert' && d.typeRec){ upsertType(d.typeRec); render(); }
  if(d.type==='dir-snapshot' && d.snapshot){
    const sn = d.snapshot;
    sn.clients.forEach(upsertClient);
    sn.groups.forEach(upsertGroup);
    sn.agents.forEach(upsertAgent);
    sn.types.forEach(upsertType);
    if(sn.roles) sn.roles.forEach(rr=>{
      let r = state.zammadRoles.find(x=>x.name===rr.name);
      if(!r){ state.zammadRoles.push({ name:rr.name, tech:true, note:rr.note||'', perms:(rr.ledgerPerms||[]).slice() }); }
      else if(rr.ledgerPerms) r.perms = rr.ledgerPerms.slice();
    });
    log('Directory reconciled', `${sn.clients.length} clients \u00b7 ${sn.groups.length} groups \u00b7 ${sn.agents.length} agents \u00b7 ${sn.types.length} activity types \u2014 authoritative copy from the shared control plane`);
    const el = document.getElementById('syncTxt'); if(el) el.textContent = 'Directory linked \u00b7 shared DB';
    render();
  }
});
</script>

<script>
/* LIVE ADAPTER (Ledger) — hydrates the prototype from ledger-api.
   Phase 1 wiring: classify, timesheet approve/return, period approve.
   Unwired mutations stay local until the next drops. */
(function(){
  const $fetch=(p,o)=>fetch(p,{credentials:'same-origin',...(o||{})});
  let PERIODS=[];
  function mapIn(d){
    state.clients.length=0; d.clients.forEach(c=>state.clients.push(c));
    state.techs.length=0;   d.techs.forEach(t=>state.techs.push(t));
    state.types.length=0;   d.types.forEach(t=>state.types.push(t));
    state.entries.length=0; d.entries.forEach(e=>state.entries.push(e));
    if(d.cfg){
      if(d.cfg.ledger) Object.assign(state.settings, d.cfg.ledger);
      if(d.cfg.odoo)   Object.assign(state.settings.odoo, d.cfg.odoo);
      if(d.cfg.retainers&&state.settings.retainers!==undefined)
        Object.assign(state.settings.retainers, d.cfg.retainers);
    }
    state.odooSecret=d.odooSecret||null;
    state.settings.odoo.apiKey='';        /* write-only — never round-trips */
    PERIODS=d.periods||[];
    /* seed the period-lock registry from the server — approved/exported
       periods must LOOK locked, not just refuse edits (gap #4 closed) */
    Object.keys(state.periods).forEach(k=>delete state.periods[k]);
    PERIODS.forEach(p=>{ state.periods[p.clientId+'|'+p.key]={
      status:p.status, approvedAt:p.approvedAt||null, approvedBy:p.approvedBy||null,
      exportedAt:p.exportedAt||null, exportRef:p.exportRef||null}; });
    if(state.projects!==undefined){
      if(Array.isArray(state.projects)) state.projects.length=0;
      else Object.keys(state.projects).forEach(k=>delete state.projects[k]);
      (d.projects||[]).forEach(p=>{ if(Array.isArray(state.projects)) state.projects.push(p);
        else state.projects[p.zTicket]=p; });
    }
    state.user={name:d.me.name,initials:d.me.initials,role:'Live',email:d.me.email};
    state.perms=new Set(d.me.perms.map(p=>p.replace(/^l_/,'')));
    state.persona='live';
    const me=state.techs.find(t=>t.email===d.me.email);
    if(me) state.demoTechId=me.id;
  }
  async function hydrate(){
    const r=await $fetch('/api/bootstrap');
    if(r.status===401){ location.href=location.protocol+'//'+location.hostname+':8081/ui/login.html'; return; }
    mapIn(await r.json());
    render();
  }
  const oops=async d=>{ alert((d&&d.detail)? 'Server declined: '+d.detail
    : 'Live sync failed \u2014 check ledger-api logs'); hydrate(); };
  const post=(p,body)=>$fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},
      body:body?JSON.stringify(body):undefined})
    .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0));
      setTimeout(hydrate,600); });

  /* every wrap mirrors ONLY when the local action actually changed state —
     a locally-refused click (toast) must never reach the server */
  if(window.classify){ const _c=window.classify;
    window.classify=function(id,typeId){
      const e=state.entries.find(x=>x.id===id), was=e?e.typeId:null;
      _c(id,typeId);
      if(!e||e.typeId===was||String(id).length<=10) return;
      const ty=state.types.find(t=>t.id===e.typeId);
      $fetch('/api/entries/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({activity_type:ty?ty.name:e.typeId})})
        .then(async r=>{ if(!r.ok) oops(await r.json().catch(()=>0)); });
    }; }
  /* the prototype prefixes period keys (M2026-07 / W2026-07-20); the server
     stores to_char formats (2026-07 / 2026-W30). Translate at the boundary —
     every timesheet call matched ZERO rows until this existed (bug #22). */
  const srvPeriodKey=pk=>{
    if(pk && pk[0]==='M') return pk.slice(1);
    if(pk && pk[0]==='W'){
      const d=new Date(pk.slice(1)+'T00:00:00Z');
      const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+3)); // ISO-week Thursday
      const y=t.getUTCFullYear(), jan4=new Date(Date.UTC(y,0,4));
      const wk=1+Math.round(((t-jan4)/86400000-3+((jan4.getUTCDay()+6)%7))/7);
      return y+'-W'+String(wk).padStart(2,'0');
    }
    return pk;
  };
  if(window.tsApprove){ const _a=window.tsApprove;
    window.tsApprove=function(techId,clientId,perKey){
      const before=new Map(state.entries.map(e=>[e.id,e.tsApproved]));
      _a(techId,clientId,perKey);
      if(!state.entries.some(e=>e.tsApproved&&!before.get(e.id))) return;
      const t=state.techs.find(x=>x.id===techId), c=state.clients.find(x=>x.id===clientId);
      if(t&&c) post('/api/timesheets/approve',{tech_email:t.email,client:c.name,period_key:srvPeriodKey(perKey)});
    }; }
  if(window.tsReturn){ const _r=window.tsReturn;
    window.tsReturn=function(techId,clientId,perKey){
      const before=new Map(state.entries.map(e=>[e.id,e.submitted]));
      _r(techId,clientId,perKey);
      const done=state.entries.find(e=>!e.submitted&&before.get(e.id)&&e.techId===techId&&e.clientId===clientId);
      if(!done) return;
      const t=state.techs.find(x=>x.id===techId), c=state.clients.find(x=>x.id===clientId);
      if(t&&c) post('/api/timesheets/return',{tech_email:t.email,client:c.name,
        period_key:srvPeriodKey(perKey),reason:done.returnReason||''});
    }; }
  if(window.tsRevoke){ const _rv=window.tsRevoke;
    window.tsRevoke=function(techId,clientId,perKey){
      const before=new Map(state.entries.map(e=>[e.id,e.tsApproved]));
      _rv(techId,clientId,perKey);
      if(!state.entries.some(e=>!e.tsApproved&&before.get(e.id)&&e.techId===techId&&e.clientId===clientId)) return;
      const t=state.techs.find(x=>x.id===techId), c=state.clients.find(x=>x.id===clientId);
      if(t&&c) post('/api/timesheets/revoke',{tech_email:t.email,client:c.name,period_key:srvPeriodKey(perKey)});
    }; }
  if(window.approvePeriod){ const _p=window.approvePeriod;
    window.approvePeriod=function(clientId,pk){
      /* the status flip happens inside the confirm modal's callback, AFTER
         this returns — a synchronous before/after compare never fires. Watch
         for the flip; if the modal is dismissed, give up quietly. */
      const was=(state.periods[clientId+'|'+pk]||{}).status||'open';
      _p(clientId,pk);
      if(was!=='open') return;
      const per=PERIODS.find(x=>x.clientId===clientId&&x.key===pk);
      if(!per) return;
      let n=0; const iv=setInterval(()=>{
        const now=(state.periods[clientId+'|'+pk]||{}).status||'open';
        if(now==='approved'){
          clearInterval(iv);
          post('/api/periods/'+per.id+'/approve',{approver_email:state.user.email});
        } else if(++n>240) clearInterval(iv);
      },250);
    }; }
  const srvId=v=>v&&String(v).length>10;
  const iso=ms=>new Date(ms).toISOString();
  if(window.applySubmitSelected){ const _s=window.applySubmitSelected;
    window.applySubmitSelected=function(){
      const before=new Map(state.entries.map(e=>[e.id,e.submitted]));
      _s();
      const done=state.entries.filter(e=>e.submitted&&!before.get(e.id)&&srvId(e.id));
      if(!done.length) return;
      Promise.all(done.map(e=>$fetch('/api/entries/'+e.id+'/submit',{method:'POST'})))
        .then(async rs=>{ const bad=rs.find(r=>!r.ok);
          if(bad) return oops(await bad.json().catch(()=>0));
          setTimeout(hydrate,600); });
    }; }
  if(window.recallSelected){ const _rc=window.recallSelected;
    window.recallSelected=function(){
      const before=new Map(state.entries.map(e=>[e.id,e.submitted]));
      _rc();
      const done=state.entries.filter(e=>!e.submitted&&before.get(e.id)&&srvId(e.id));
      if(!done.length) return;
      Promise.all(done.map(e=>$fetch('/api/entries/'+e.id+'/recall',{method:'POST'})))
        .then(async rs=>{ const bad=rs.find(r=>!r.ok);
          if(bad) return oops(await bad.json().catch(()=>0));
          setTimeout(hydrate,600); });
    }; }
  if(window.applyDeleteSelected){ const _dv=window.applyDeleteSelected;
    window.applyDeleteSelected=function(){
      const before=new Map(state.entries.map(e=>[e.id,e.status]));
      _dv();
      const done=state.entries.filter(e=>e.status==='void'&&before.get(e.id)!=='void'&&srvId(e.id));
      if(!done.length) return;
      Promise.all(done.map(e=>$fetch('/api/entries/'+e.id,{method:'PATCH',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({void:true,void_reason:'removed in Ledger'})})))
        .then(async rs=>{ const bad=rs.find(r=>!r.ok);
          if(bad) return oops(await bad.json().catch(()=>0));
          setTimeout(hydrate,600); });
    }; }
  if(window.saveTime){ const _st=window.saveTime;
    window.saveTime=function(id){
      const e=state.entries.find(x=>x.id===id);
      const was=e?{s:e.startedAt,en:e.endedAt}:null;
      _st(id);
      if(!e||!was||(e.startedAt===was.s&&e.endedAt===was.en)||!srvId(id)) return;
      $fetch('/api/entries/'+id,{method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({started_at:iso(e.startedAt),ended_at:iso(e.endedAt)})})
        .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0)); });
    }; }
  if(window.runExport){ const _rx=window.runExport;
    window.runExport=function(clientId,pk){
      const before=periodState(clientId,pk).status;
      _rx(clientId,pk);
      if(before!=='approved'||periodState(clientId,pk).status!=='exported') return;
      const per=PERIODS.find(x=>x.clientId===clientId&&x.key===pk);
      if(per&&srvId(per.id)) post('/api/periods/'+per.id+'/mark-exported');
    }; }
  /* ---- settings persist: global defaults + Odoo connector ---- */
  let cfgTimer=null;
  window.persistLedgerCfg=function(){
    clearTimeout(cfgTimer);
    cfgTimer=setTimeout(()=>{
      const st=state.settings;
      const gen={currency:st.currency,host:st.host,defaultCycle:st.defaultCycle,
                 defaultBillable:st.defaultBillable,rounding:st.rounding,minMinutes:st.minMinutes};
      const od=Object.assign({},st.odoo); delete od.apiKey;   // write-only, separate path
      $fetch('/api/config/ledger',{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({value:gen})})
        .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0)); });
      $fetch('/api/config/odoo',{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({value:od})})
        .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0)); });
    },600);
  };
  window.saveOdooKey=function(){
    const el=document.getElementById('odooKeyIn');
    const v=el?el.value.trim():'';
    if(!v){ toast('Paste the key first'); return; }
    $fetch('/api/secrets/odoo',{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({value:v})})
      .then(async r=>{ if(!r.ok) return oops(await r.json().catch(()=>0));
        toast('Odoo key sealed — write-only from here on'); hydrate(); });
  };
  ['s_toggle','s_toggleOdoo'].forEach(name=>{ if(window[name]){ const orig=window[name];
    window[name]=function(){ orig.apply(null,arguments); persistLedgerCfg(); }; } });

  /* ---- admin: client billing, activity types, rate overrides, access ---- */
  const jshort=r=>r.json().catch(()=>0);
  const _setClientCycle=window.setClientCycle;
  window.setClientCycle=function(id,v){
    _setClientCycle(id,v);
    if(v!=='monthly'&&v!=='weekly'){ toast('Live billing supports monthly or weekly cycles'); hydrate(); return; }
    $fetch('/api/clients/'+encodeURIComponent(id),{method:'PATCH',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({cycle:v})})
      .then(async r=>{ if(!r.ok) return oops(await jshort(r)); });
  };
  const _toggleClientBillable=window.toggleClientBillable;
  window.toggleClientBillable=function(id){
    const c=client(id), was=c?c.billableDefault:null;
    _toggleClientBillable(id);
    if(!c||c.billableDefault===was) return;
    $fetch('/api/clients/'+encodeURIComponent(id),{method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({billable_default:c.billableDefault})})
      .then(async r=>{ if(!r.ok) return oops(await jshort(r)); });
  };
  const _toggleTypeBillable=window.toggleTypeBillable;
  window.toggleTypeBillable=function(id){
    const a=atype(id), was=a?{b:a.billable,r:a.rate}:null;
    _toggleTypeBillable(id);
    if(!a||!was||a.billable===was.b) return;       // sentinel guard refused
    $fetch('/api/types/'+encodeURIComponent(id),{method:'PATCH',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({billable:a.billable})})
      .then(async r=>{ if(!r.ok) return oops(await jshort(r)); });
    if(a.rate!==was.r)                              // "billable needs a rate" default
      $fetch('/api/types/'+encodeURIComponent(id)+'/rate',{method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({rate_cents:Math.round(a.rate*100)})})
        .then(async r=>{ if(!r.ok) return oops(await jshort(r)); });
  };
  const _setTypeRate=window.setTypeRate;
  window.setTypeRate=function(id,v,srcEl){
    const a=atype(id), was=a?a.rate:null;
    _setTypeRate(id,v,srcEl);
    if(!a||a.rate===was) return;
    $fetch('/api/types/'+encodeURIComponent(id)+'/rate',{method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({rate_cents:Math.round(a.rate*100)})})
      .then(async r=>{ if(!r.ok) return oops(await jshort(r)); });
  };
  const rateTimers={};
  const clientRatePut=(cid,tid,o)=>{
    const k=cid+'|'+(tid||'wide');
    clearTimeout(rateTimers[k]);
    rateTimers[k]=setTimeout(()=>
      $fetch('/api/clients/'+encodeURIComponent(cid)+'/rates',{method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({activity_type:tid,
          rate_cents:(o&&o.rate!=null)?Math.round(o.rate*100):null,
          billable:(o&&o.billable!=null)?o.billable:null})})
        .then(async r=>{ if(!r.ok) return oops(await jshort(r)); }),600);
  };
  const _setClientRate=window.setClientRate;
  window.setClientRate=function(cid,v){
    _setClientRate(cid,v);
    const c=client(cid);
    clientRatePut(cid,null,(c&&c.rateOverride!=null)?{rate:c.rateOverride}:null);
  };
  const _setClientTypeRate=window.setClientTypeRate;
  window.setClientTypeRate=function(cid,tid,v){
    _setClientTypeRate(cid,tid,v);
    clientRatePut(cid,tid,(client(cid).rates||{})[tid]);   // debounced; latest wins
  };
  const _toggleClientTypeBillable=window.toggleClientTypeBillable;
  window.toggleClientTypeBillable=function(cid,tid){
    _toggleClientTypeBillable(cid,tid);
    clientRatePut(cid,tid,(client(cid).rates||{})[tid]);
  };
  const _clearClientTypeOverride=window.clearClientTypeOverride;
  window.clearClientTypeOverride=function(cid,tid){
    _clearClientTypeOverride(cid,tid);
    clientRatePut(cid,tid,null);                    // all-NULL row = inherit, history kept
  };
  let accTimers={};
  const pushAccess=cid=>{
    clearTimeout(accTimers[cid]);
    accTimers[cid]=setTimeout(()=>{
      const a=(client(cid)||{}).access||{mode:'all',techs:[],groups:[]};
      $fetch('/api/clients/'+encodeURIComponent(cid)+'/access',{method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({mode:a.mode,techs:a.techs||[],groups:a.groups||[]})})
        .then(async r=>{ if(!r.ok) return oops(await jshort(r)); });
    },500);
  };
  ['setClientAccessMode','toggleClientAccessTech','toggleClientAccessGroup'].forEach(n=>{
    if(window[n]){ const orig=window[n];
      window[n]=function(cid){ orig.apply(null,arguments); pushAccess(cid); }; } });

  window.addEventListener('focus',()=>{ if(!window.__h||Date.now()-window.__h>30000){window.__h=Date.now();hydrate();} });
  hydrate();
})();
</script>

</body>
</html>
